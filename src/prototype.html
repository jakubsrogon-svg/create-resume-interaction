.tl-gen input.is-error { border-color: var(--kr-primary); }
.tl-gen form button { display: inline-flex; align-items: center; height: 34px; margin-left: 33px; padding: 0 32px; border: 0; border-radius: 4px; background: linear-gradient(90deg, #666cff 11.8%, #a066ff 84%); color: var(--kr-white); font: 500 14px/20px var(--font-sans); white-space: nowrap; cursor: pointer; transition: filter .2s; }
.tl-gen form button:hover { filter: brightness(1.07); }
.tl-gen .spin { width: 18px; height: 18px; margin-right: 6px; animation: spin .8s linear infinite; fill: none; stroke: currentColor; stroke-width: 2; }
.tl-note { padding: 8px 0; font: 400 12px/18px var(--font-sans); filter: drop-shadow(1px 2px 5px rgba(0, 0, 0, .1)); }
.tl-skills { display: grid; gap: 32px; justify-items: center; }
.tl-skills > h2 { width: 498px; max-width: 100%; margin: 0; font: 500 24px/28px var(--font-sans); }
.tl-skill { width: 498px; max-width: 100%; border-radius: 20px; background: var(--kr-white); box-shadow: 1px 2px 5px rgba(0, 0, 0, .1); }
.tl-skill > h3 { margin: 0; padding: 16px 24px; border-radius: 20px 20px 0 0; background: linear-gradient(rgba(0, 0, 0, .4), rgba(0, 0, 0, .4)), linear-gradient(90deg, #666cff 11.8%, #a066ff 84%); color: var(--kr-white); font: 500 16px/24px var(--font-sans); }
.tl-skill > div { display: grid; gap: 16px; padding: 8px 24px 24px; }
.tl-skill > div > p { font: 400 14px/20px var(--font-sans); color: var(--kr-grey-80); }
.tl-skill hr { height: 1px; margin: 0; border: 0; background: var(--kr-grey-60); }
.tl-res { display: flex; align-items: center; gap: 16px; }
.tl-res > div { flex: 1; min-width: 0; display: grid; gap: 16px; }
.tl-res b { width: 290px; max-width: 100%; font: 500 16px/24px var(--font-sans); }
.tl-res p { font: 400 14px/20px var(--font-sans); color: var(--kr-grey-80); }
.tl-res > button { flex: none; padding: 8px; border: 0; border-radius: 10px; background: var(--kr-grey-40); color: #514eea; font: 400 14px/20px var(--font-sans); text-decoration: underline; text-underline-position: from-font; cursor: pointer; }
.tl-res > button:hover { background: #e9e9f7; }
/* grid columns that can shrink, so fixed-width parts (495px, 498px…) don't push the column wider on small screens */
.tl-main :is(.tl-col, .tl-cc, .tl-cc-top, .tl-skills, .tl-card, .tl-sec, .tl-pcard, .tl-pg, .tl-pt, .tl-tt, .tl-gen, .tl-rows, .tl-row, .tl-len, .tl-keys, .tl-chk, .tl-chk-b, .tl-gauss, .tl-found, .tl-intro, .tl-score.is-key, .tl-skill > div, .tl-res > div) { grid-template-columns: minmax(0, 1fr); }
/* the resume preview on the right */
.tl-prev { position: relative; grid-column: 3; grid-row: 1; min-width: 0; }
/* under 1440px the column narrows and the preview shrinks with it (--tl-z, set by fitPrev) */
.tl-pv { position: relative; width: 628px; zoom: var(--tl-z, 1); }
.tl-frame { position: absolute; left: 0; top: 0; width: 628px; height: 1080px; border: 1px solid var(--kr-grey-60); pointer-events: none; }
.is-proof .tl-frame { height: 2441px; }
.is-coach .tl-frame { height: 988px; }
.tl-paper { position: absolute; left: 43px; top: 82px; width: 541px; height: 764px; box-shadow: 1px 2px 20px rgba(0, 0, 0, .1); background: var(--kr-white); }
.is-proof .tl-paper, .is-coach .tl-paper { left: 31px; }
.tl-paper > img, .tl-paper > i { position: absolute; display: block; }
.tl-paper > img:first-child { position: static; width: 541px; height: 764px; }
.tl-ptabs { position: absolute; left: 99px; top: 16px; width: 406px; height: 34px; }
.is-proof .tl-ptabs { filter: blur(5px); pointer-events: none; }
.tl-ptabs > div { position: absolute; left: .4px; top: 0; width: 401px; height: 32px; display: flex; align-items: center; gap: 20px; padding: 0 5px; border: 1px solid var(--kr-grey-60); border-radius: 4px; background: var(--kr-white); }
.tl-ptabs button { display: flex; align-items: flex-start; gap: 6px; height: 20px; padding: 0; border: 0; background: none; font: 400 14px/20px var(--font-sans); white-space: nowrap; cursor: pointer; }
.tl-ptabs button svg { width: 16px; height: 16px; margin-top: 2px; }
.tl-ptabs button[aria-current="page"] { color: var(--kr-primary); cursor: default; }
.tl-ptabs button:not([aria-current]):hover { color: var(--kr-primary); }
.tl-ptabs > i { position: absolute; left: 0; top: 0; width: 89px; height: 32px; border: 1px solid var(--kr-primary); border-radius: 4px; pointer-events: none; }
/* narrower windows: the preview goes first, then the menus; phones get one column */
@container (max-width: 1180px) {
  .tl { grid-template-columns: 232px minmax(0, 1fr); }
  .tl-prev { display: none; }
}
@container (max-width: 760px) {
  .tl { grid-template-columns: minmax(0, 1fr); }
  .tl-main { grid-column: 1; grid-row: 2; padding: 20px 16px 64px; }
  .tl-col, .is-proof .tl-col, .is-coach .tl-col { width: 100%; }
  .tl-checks.is-two > div { width: 100%; }
  .tl-gen form { flex-wrap: wrap; gap: 12px; }
  .tl-gen input { width: 100%; }
  .tl-gen form button { margin-left: 0; }
  .tl-res { flex-wrap: wrap; }
  .tl-pcard { padding: 24px 20px; }
  .tl-person { min-width: 0; flex-basis: 100%; }
}

/* ---------- Select your template (/dashboard/create-resume/) ----------
   Recreated from Figma (Kickresume 3.0 › 61941:33517). A page of its own (its own top bar with the logo and ×,
   a grey wash with the Kickresume symbol faint in it), so like Sign up it replaces the logo bar and the page
   (APPS.tpl). Sizes are Figma's (a 1440px-wide frame; phones from its 375px one). */
body[data-screen="tpl"] .stage { padding-right: 0; }  /* the page runs to the window's edge, under the side rail */
.tps { position: relative; margin-inline: -16px; min-height: calc(var(--vh) * 100); padding-bottom: 64px; overflow: clip; background: var(--kr-white); color: var(--kr-grey-100); }
body.has-note .tps, body:has(.flow-bar:not([hidden])) .tps { padding-bottom: 164px; }  /* scrolls clear of the flow bar */
:where(.tps) :where(button) { font: inherit; color: inherit; }
.tps button:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
/* the frame's wash (#f4f7f8 to white over its 900px) and the symbol at 60%, fading out as it goes down */
.tps-bg { position: absolute; inset: 0 0 auto; height: 900px; background: linear-gradient(#f4f7f8, rgba(244, 247, 248, 0)); pointer-events: none; }
.tps-bg img { position: absolute; left: calc(50% - 629px); top: -509px; width: 1697.69px; height: 1866.26px; max-width: none; }
.tps-top { position: relative; display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 32px 0 25px; }
.tps-logo { display: inline-flex; padding: 0; border: 0; background: none; cursor: pointer; border-radius: var(--radius); }
.tps-logo svg { display: block; width: 152px; height: 24px; }
.tps-logo svg path { fill: var(--kr-grey-100); }  /* the design's logo is one colour */
.tps-x { display: grid; place-items: center; width: 40px; height: 40px; margin-left: auto; padding: 0; border: 0; border-radius: 10px; background: none; cursor: pointer; transition: background .2s; }
.tps-x:hover { background: rgba(0, 0, 0, .04); }
.tps-x svg { display: block; width: 24px; height: 24px; }
.tps-body { position: relative; display: flex; flex-direction: column; gap: 48px; max-width: 1000px; margin-inline: auto; padding: 32px 16px 0; }
/* the content keeps clear of the side rail; from 1162px the centred page already does */
@media (min-width: 481px) and (max-width: 1161px) { body:not(.is-mobile) .tps-body { padding-inline: 68px; } }
.tps-head { display: flex; flex-direction: column; align-items: center; gap: 24px; }
.tps-head h1 { position: relative; top: -2px; margin: 0; font: 500 32px/40px var(--font-sans); text-align: center; }  /* Graphik Web sets 2px lower than Figma's Graphik */
/* the filters: 1px outline inside (so a chip is the design's 34px; the label 1px up, as above), dark when picked; hover and focus darken the outline */
.tps-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.tps-chip { padding: 5px 15px 7px; border: 1px solid #f2f2f2; border-radius: 99px; background: rgba(255, 255, 255, .6); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); font-size: 14px; line-height: 20px; white-space: nowrap; cursor: pointer; transition: border-color .2s, background .2s, color .2s; }
.tps-chip:hover { border-color: var(--kr-grey-100); }
.tps .tps-chip:focus-visible { border-color: var(--kr-grey-100); box-shadow: inset 0 0 0 1px var(--kr-grey-100); }
.tps-chip[aria-pressed="true"] { border-color: var(--kr-grey-100); background: var(--kr-grey-100); color: var(--kr-white); box-shadow: 1px 2px 5px rgba(0, 0, 0, .1); cursor: default; }
.tps .tps-chip[aria-pressed="true"]:focus-visible { box-shadow: 1px 2px 5px rgba(0, 0, 0, .1), var(--kr-focus-ring); }
/* the templates: 200 × 275 with a 1px #e9e9e9 outline inside; hover (Doodle in the design) darkens it and lifts the card */
.tps-grid { --tps-lift: -1px 2px 4px rgba(82, 82, 82, .05), -4px 7px 8px rgba(82, 82, 82, .04), -9px 15px 11px rgba(82, 82, 82, .03), -17px 27px 13px rgba(82, 82, 82, .01), -26px 42px 14px rgba(82, 82, 82, 0);
  display: grid; grid-template-columns: repeat(auto-fill, 200px); justify-content: center; gap: 40px; }
.tps-card { position: relative; width: 200px; height: 275px; padding: 0; border: 0; border-radius: 10px; overflow: hidden; background: var(--kr-white); cursor: pointer; transition: box-shadow .2s; }
.tps-card img { display: block; width: 100%; height: 100%; object-fit: cover; }
.tps-card::after { content: ""; position: absolute; inset: 0; border: 1px solid #e9e9e9; border-radius: inherit; pointer-events: none; transition: border-color .2s; }
.tps-card:is(:hover, :focus-visible)::after { border-color: #8c8c8c; }
.tps-card:hover { box-shadow: var(--tps-lift); }
.tps .tps-card:focus-visible { box-shadow: var(--tps-lift), var(--kr-focus-ring); }
/* phones (Figma's 375px frame): no logo, a 72px bar, a smaller headline, the chips from the left, two columns */
@container (max-width: 560px) {
  .tps-bg img { left: calc(50% - 848.84px); top: -230px; }
  .tps-top { height: 72px; padding-inline: 16px 32px; }
  .tps-logo { display: none; }
  .tps-body { gap: 24px; padding-top: 0; }
  .tps-head { align-items: stretch; }
  .tps-head h1 { top: -1px; font-size: 21px; line-height: 28px; }
  .tps-chips { justify-content: flex-start; }
  .tps-chip { padding-block: 8px 10px; }
  .tps-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .tps-card { width: auto; height: auto; aspect-ratio: 163.48 / 225.66; border-radius: 8px; }
}

/* ---------- Wireframes: Wire, Kubo's grayscale wireframe kit (copied in; its tokens are scoped to .wf so
   they can't touch the prototype's own, and its accent, status and note colours are greys, so a wireframe
   is only shades of grey). Used for every screen without a design. ---------- */
.wf{--paper:#ffffff;--fill:#f2f2f2;--fill-strong:#d9d9d9;--line-soft:#e0e0e0;--line:#8a8a8a;--ink-muted:#616161;--ink:#1f1f1f;--accent:#4d4d4d;--on-accent:#ffffff;--danger:#4d4d4d;--success:#4d4d4d;--note:#f2f2f2;--scrim:rgba(31,31,31,0.4);--space-1:4px;--space-2:8px;--space-4:16px;--space-6:24px;--space-8:32px;--radius-0:0px;--radius-sm:4px;--radius-pill:999px;--font-sans:system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif}
.wf .t-display{font-size:32px;line-height:40px;font-weight:700;letter-spacing:normal}
.wf .t-title{font-size:24px;line-height:32px;font-weight:600;letter-spacing:normal}
.wf .t-heading{font-size:18px;line-height:26px;font-weight:600;letter-spacing:normal}
.wf .t-body{font-size:15px;line-height:22px;font-weight:400;letter-spacing:normal}
.wf .t-small{font-size:13px;line-height:18px;font-weight:400;letter-spacing:normal}
.wf .t-label{font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.04em}
.wf{font-family:var(--font-sans);font-size:15px;line-height:22px;color:var(--ink);background:var(--paper)}
.wf *,.wf *::before,.wf *::after{box-sizing:border-box}
.wf h1,.wf h2,.wf h3,.wf h4,.wf p{margin:0}
/* layout */
.wf-stack{display:flex;flex-direction:column;gap:var(--space-4)}
.wf-row{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-4)}
.wf-grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:var(--space-4)}
.wf-spread{justify-content:space-between}
.wf-grow{flex:1}
.wf-gap-sm{gap:var(--space-2)}
.wf-gap-lg{gap:var(--space-8)}
/* frame */
.wf-frame{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.wf-frame--desktop,.wf-frame--mobile{display:flex;flex-direction:column;flex:none;height:800px}
.wf-frame--desktop{width:1440px}
.wf-frame--mobile{width:375px}
.wf-frame--long{height:auto;min-height:800px}
.wf-frame--desktop>.wf-frame-body,.wf-frame--mobile>.wf-frame-body,.wf-frame--desktop>.wf-shell,.wf-frame--mobile>.wf-main{flex:1;min-height:0;overflow:hidden}
.wf-canvas{overflow:auto;padding:var(--space-6);background:var(--paper)}
.wf-canvas .wf-frame--desktop,.wf-canvas .wf-frame--mobile{zoom:var(--zoom,1)}
.wf-frame-bar{display:flex;align-items:center;gap:var(--space-2);height:32px;padding:0 var(--space-4);background:var(--fill);border-bottom:1px solid var(--line-soft);font-size:12px;color:var(--ink-muted)}
.wf-frame-bar::before{content:"";width:36px;height:8px;border-radius:var(--radius-pill);background:var(--fill-strong)}
.wf-frame-body{padding:var(--space-6)}
/* stand-ins */
.wf-ph{display:flex;align-items:center;justify-content:center;min-height:96px;background-color:var(--fill);border:1px solid var(--line-soft);border-radius:var(--radius-sm);color:var(--ink-muted);font-size:12px;line-height:16px;font-weight:600;
background-image:linear-gradient(to top right,transparent calc(50% - 1px),var(--line-soft) 50%,transparent calc(50% + 1px)),linear-gradient(to top left,transparent calc(50% - 1px),var(--line-soft) 50%,transparent calc(50% + 1px))}
.wf-ph>*{background:var(--fill);padding:0 var(--space-1)}
.wf-ph--wide{aspect-ratio:16/9;min-height:0}
.wf-ph--square{aspect-ratio:1;min-height:0}
.wf-ph--circle{aspect-ratio:1;min-height:0;border-radius:var(--radius-pill);background-image:none}
.wf-ph--icon{width:20px;height:20px;min-height:0;flex:none;background-image:none;border-radius:var(--radius-sm)}
.wf-lines{display:flex;flex-direction:column;gap:var(--space-2);width:100%}
.wf-line{display:block;height:8px;width:100%;border-radius:var(--radius-pill);background:var(--fill-strong)}
.wf-lines>.wf-line:last-child:not(:first-child),.wf-line--short{width:60%}
.wf-line--head{height:16px;width:45%;background:var(--ink-muted)}
/* actions */
.wf-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);height:40px;padding:0 var(--space-4);border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);color:var(--ink);font:600 14px/20px var(--font-sans);white-space:nowrap;cursor:pointer}
.wf-btn--primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.wf-btn--ghost{background:transparent;border-color:transparent;text-decoration:underline;padding:0 var(--space-2)}
.wf-btn--sm{height:32px;padding:0 var(--space-2);font-size:13px}
.wf-btn:disabled{opacity:.45;cursor:default}
.wf-btn:focus-visible,.wf-input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wf-link{color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--accent);text-underline-offset:3px}
/* forms */
.wf-field{display:flex;flex-direction:column;gap:var(--space-1);font-size:13px;line-height:18px;font-weight:600}
.wf-input{display:flex;align-items:center;width:100%;height:40px;padding:0 var(--space-2);border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);color:var(--ink-muted);font:400 14px/20px var(--font-sans)}
.wf-input--area{height:96px;align-items:flex-start;padding-top:var(--space-2)}
.wf-input--select{justify-content:space-between}
.wf-input--select::after{content:"\25BE";color:var(--ink)}
.wf-hint{font-size:12px;line-height:16px;font-weight:400;color:var(--ink-muted)}
.wf-field--error .wf-input{border-color:var(--danger)}
.wf-field--error .wf-hint{color:var(--danger)}
.wf-check,.wf-radio{display:inline-flex;align-items:center;gap:var(--space-2);font-size:14px;line-height:20px}
.wf-check::before,.wf-radio::before{content:"";width:16px;height:16px;flex:none;border:1px solid var(--line);border-radius:3px;background:var(--paper)}
.wf-radio::before{border-radius:var(--radius-pill)}
.wf-check--on::before,.wf-radio--on::before{background:var(--ink);box-shadow:inset 0 0 0 3px var(--paper)}
/* containers */
.wf-card{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-4);background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius-sm)}
.dz-wire{display:flex;flex-direction:column;gap:var(--space-4)}
.wf-badge{display:inline-flex;align-items:center;height:20px;padding:0 var(--space-2);border:1px solid var(--line-soft);border-radius:var(--radius-pill);background:var(--fill);font-size:12px;font-weight:600;line-height:16px;white-space:nowrap}
.wf-overlay{display:flex;align-items:center;justify-content:center;padding:var(--space-8);background:var(--scrim)}
.wf-dialog{width:100%;max-width:400px;gap:var(--space-4);padding:var(--space-6);border-color:var(--line)}
/* navigation */
.wf-nav{display:flex;align-items:center;gap:var(--space-6);height:56px;padding:0 var(--space-6);border-bottom:1px solid var(--line-soft);background:var(--paper)}
.wf-logo{font-weight:700}
.wf-nav-item{font-size:14px;color:var(--ink-muted)}
.wf-nav-item--active{color:var(--ink);font-weight:600}
.wf-tabs{display:flex;gap:var(--space-6);border-bottom:1px solid var(--line-soft)}
.wf-tab{padding:var(--space-2) 0;font-size:14px;color:var(--ink-muted)}
.wf-tab--active{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
/* data */
.wf-table{width:100%;border-collapse:collapse;font-size:14px;line-height:20px}
.wf-table th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-muted);padding:var(--space-2);border-bottom:1px solid var(--line)}
.wf-table td{padding:var(--space-2);border-bottom:1px solid var(--line-soft)}
/* annotation */
.wf-note{display:block;max-width:320px;padding:var(--space-2) var(--space-4);background:var(--note);color:var(--ink);border-radius:var(--radius-sm);font-size:13px;line-height:18px}
.wf-pin{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none;border-radius:var(--radius-pill);background:var(--ink);color:var(--paper);font:700 12px/1 var(--font-sans)}
.wf-anchor{position:relative}
.wf-anchor>.wf-pin{position:absolute;top:-12px;right:-12px;z-index:1}
/* flow */
.wf-flow{display:flex;align-items:flex-start;flex-wrap:wrap;gap:var(--space-2)}
.wf-screen{display:flex;flex-direction:column;gap:var(--space-2);min-width:0}
.wf-screen-label{align-self:flex-start;padding:2px var(--space-2);background:var(--ink);color:var(--paper);border-radius:var(--radius-sm);font-size:12px;line-height:16px;font-weight:600}
.wf-arrow{position:relative;align-self:center;min-width:96px;padding:0 var(--space-2) 14px;text-align:center;font-size:12px;line-height:16px;color:var(--ink-muted)}
.wf-arrow::after{content:"";position:absolute;left:0;right:6px;bottom:4px;height:2px;background:var(--ink)}
.wf-arrow::before{content:"";position:absolute;right:0;bottom:0;border-left:8px solid var(--ink);border-top:5px solid transparent;border-bottom:5px solid transparent}
/* feedback */
.wf-alert{display:flex;align-items:flex-start;gap:var(--space-2);padding:var(--space-2) var(--space-4);background:var(--fill);border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;line-height:20px}
.wf-alert::before{content:"i";flex:none;width:20px;height:20px;border-radius:var(--radius-pill);background:var(--ink);color:var(--paper);font:700 12px/20px var(--font-sans);text-align:center}
.wf-alert--success{border-color:var(--success)}
.wf-alert--success::before{content:"\2713";background:var(--success)}
.wf-alert--error{border-color:var(--danger)}
.wf-alert--error::before{content:"!";background:var(--danger)}
.wf-toast{display:inline-flex;align-items:center;gap:var(--space-4);padding:var(--space-2) var(--space-4);background:var(--ink);color:var(--paper);border-radius:var(--radius-sm);font-size:14px;line-height:20px}
.wf-toast .wf-link{color:var(--paper);font-weight:600}
.wf-empty{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-8) var(--space-4);border:1px dashed var(--line);border-radius:var(--radius-sm);text-align:center}
.wf-empty>.wf-ph{width:64px;min-height:64px}
/* progress */
.wf-steps{display:flex;gap:var(--space-4);margin:0;padding:0;list-style:none;counter-reset:wfs}
.wf-step{flex:1;display:flex;align-items:center;gap:var(--space-2);font-size:13px;line-height:18px;color:var(--ink-muted);counter-increment:wfs}
.wf-step::before{content:counter(wfs);display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none;border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--paper);color:var(--ink);font:700 12px/1 var(--font-sans)}
.wf-step--active{color:var(--ink);font-weight:600}
.wf-step--active::before{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.wf-step--done::before{content:"\2713";background:var(--fill-strong);border-color:var(--fill-strong)}
.wf-progress{height:8px;border-radius:var(--radius-pill);background:var(--fill-strong);overflow:hidden}
.wf-progress::before{content:"";display:block;height:100%;width:var(--value,50%);background:var(--ink)}
/* overlays */
.wf-menu{display:flex;flex-direction:column;min-width:180px;padding:var(--space-1) 0;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm)}
.wf-menu-item{padding:var(--space-2) var(--space-4);font-size:14px;line-height:20px}
.wf-menu-item--active{background:var(--fill);font-weight:600}
.wf-menu-sep{height:1px;margin:var(--space-1) 0;background:var(--line-soft)}
.wf-tooltip{position:relative;display:inline-block;max-width:220px;padding:var(--space-1) var(--space-2);background:var(--ink);color:var(--paper);border-radius:var(--radius-sm);font-size:12px;line-height:16px}
.wf-tooltip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}
.wf-sheet{display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-2) var(--space-6) var(--space-6);background:var(--paper);border:1px solid var(--line);border-bottom:0;border-radius:calc(var(--radius-sm) * 3) calc(var(--radius-sm) * 3) 0 0}
.wf-sheet::before{content:"";align-self:center;width:40px;height:4px;border-radius:var(--radius-pill);background:var(--fill-strong)}
/* app layout */
.wf-shell{display:grid;grid-template-columns:var(--side,220px) minmax(0,1fr);min-height:320px}
.wf-sidebar{display:flex;flex-direction:column;gap:var(--space-1);padding:var(--space-4);background:var(--fill);border-right:1px solid var(--line-soft)}
.wf-side-item{padding:var(--space-2);border-radius:var(--radius-sm);font-size:14px;line-height:20px;color:var(--ink-muted)}
.wf-side-item--active{background:var(--paper);color:var(--ink);font-weight:600}
.wf-main,.wf-pane{display:flex;flex-direction:column;gap:var(--space-4);min-width:0;padding:var(--space-6)}
.wf-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.wf-split>*+*{border-left:1px solid var(--line-soft)}
.wf-pane--muted{background:var(--fill)}
/* mobile nav */
.wf-mbar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:var(--space-2);height:48px;padding:0 var(--space-4);border-bottom:1px solid var(--line-soft);background:var(--paper)}
.wf-mbar>:last-child{justify-self:end}
.wf-mbar-title{text-align:center;font-size:16px;line-height:22px;font-weight:600}
.wf-back{font-size:14px;font-weight:600}
.wf-back::before{content:"\2190  "}
.wf-tabbar{display:flex;border-top:1px solid var(--line-soft);background:var(--paper)}
.wf-tabbar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:var(--space-2) 0;font-size:12px;line-height:16px;color:var(--ink-muted)}
.wf-tabbar-item::before{content:"";width:20px;height:20px;border-radius:var(--radius-sm);background:var(--fill-strong)}
.wf-tabbar-item--active{color:var(--ink);font-weight:600}
.wf-tabbar-item--active::before{background:var(--ink)}
/* more controls */
.wf-switch{display:inline-flex;align-items:center;gap:var(--space-2);font-size:14px;line-height:20px}
.wf-switch::before{content:"";width:36px;height:20px;flex:none;border-radius:var(--radius-pill);background:radial-gradient(circle at 10px 50%,var(--paper) 6px,var(--line) 7px)}
.wf-switch--on::before{background:radial-gradient(circle at 26px 50%,var(--paper) 6px,var(--ink) 7px)}
.wf-search{justify-content:flex-start;gap:var(--space-2);padding:0 var(--space-4);border-radius:var(--radius-pill)}
.wf-search::before{content:"";width:12px;height:12px;flex:none;border:2px solid var(--ink-muted);border-radius:var(--radius-pill)}
.wf-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);padding:var(--space-6);background:var(--fill);border:2px dashed var(--line);border-radius:var(--radius-sm);text-align:center;font-size:14px;line-height:20px}
.wf-flow--down{flex-direction:column;flex-wrap:nowrap}
.wf-flow--down>.wf-arrow{align-self:flex-start;min-width:0;height:64px;margin-left:48px;padding:0 0 0 var(--space-6);display:flex;align-items:center;text-align:left}
.wf-flow--down>.wf-arrow::after{left:4px;right:auto;top:0;bottom:6px;width:2px;height:auto}
.wf-flow--down>.wf-arrow::before{left:0;right:auto;border-top:8px solid var(--ink);border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:0}
.rt-wire { max-width: 100%; background: none; }  /* the label sits on the page, the card keeps its paper */

/* Flow bar (prototype chrome, bottom centre): the running flow template, its steps, wireframe steps hollow */
.flow-bar {
  position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 220px); padding: 6px 6px 6px 14px; border-radius: 14px;
  background: var(--kr-blue-dark); color: var(--kr-white); box-shadow: var(--kr-shadow-modal); font-size: 12px; line-height: 16px; white-space: nowrap;
}
.flow-bar[hidden] { display: none; }
/* A wireframe's note (prototype chrome, bottom centre, above the flow bar when one runs): what the screen is for, which flow it belongs to */
.proto-note {
  position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20; transform: translateX(-50%);
  display: flex; align-items: baseline; gap: 8px; width: max-content; max-width: min(560px, calc(100vw - 220px)); padding: 8px 14px; border-radius: 12px;
  background: var(--kr-blue-dark); color: #c9cde0; box-shadow: var(--kr-shadow-modal); font-size: 12px; line-height: 16px;
}
.proto-note[hidden] { display: none; }
.proto-note b { flex: none; color: var(--kr-white); font-weight: 500; }
.flow-bar:not([hidden]) ~ .proto-note { bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }
body.has-note #screen-route { padding-bottom: 148px; }  /* the screen can scroll clear of the note */
body.has-note .au-main { padding-bottom: 96px; }
/* Mobile view on a wide window: in the free margin left of the phone frame, above the version tag */
@media (min-width: 900px) {
  body.is-mobile .proto-note, body.is-mobile .flow-bar:not([hidden]) ~ .proto-note { left: 12px; transform: none; bottom: calc(48px + env(safe-area-inset-bottom, 0px)); max-width: min(320px, calc(50vw - 240px)); }
}
/* On a real phone the bottom row is full (version, flow bar, More options, rail): the note gets its own row above it */
@media (max-width: 480px) {
  body .proto-note, .flow-bar:not([hidden]) ~ .proto-note { left: 12px; right: 12px; transform: none; width: auto; max-width: none; bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
  /* so does a running flow's bar, and the note goes one row higher */
  body .flow-bar { left: 12px; right: 12px; transform: none; max-width: none; bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
  body .flow-bar .fb-steps { flex: 1; min-width: 0; }
  .flow-bar:not([hidden]) ~ .proto-note { bottom: calc(164px + env(safe-area-inset-bottom, 0px)); }
  /* the dock, the flow bar and a note stack up over the bottom of the page: every screen can scroll clear of them
     (a spacer at the end of the page, as tall as they are) */
  #device::after { content: ""; display: block; height: 88px; }
  body:has(.flow-bar:not([hidden])) #device::after { height: 140px; }
  body.has-note #device::after { height: 170px; }
  body.has-note:has(.flow-bar:not([hidden])) #device::after { height: 220px; }
  body.has-note #screen-route { padding-bottom: 0; }
}
/* a short window: Sign up and Log in scroll clear of the dock (their form sits in its column) */
@media (min-width: 481px) and (max-height: 900px) { .au-main { padding-bottom: 64px; } }
.fb-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.fb-steps { display: flex; gap: 10px; }
.fb-grp { display: flex; gap: 6px; padding-bottom: 4px; margin-bottom: -6px; border-bottom: 2px solid rgba(255, 255, 255, .22); }
.fb-grp.st-process, .fb-grp.st-state { background: none; border-color: #f3d9a4; }
.fb-grp.st-dest { background: none; border-color: #9fe0c4; }
.fb-grp.st-entry, .fb-grp.st-intent, .fb-grp.st-prep { background: none; }
.fb-dot { position: relative; width: 12px; height: 12px; padding: 0; border: 2px solid #8a93ab; border-radius: 50%; background: #8a93ab; cursor: pointer; }
.fb-dot.is-wire { background: transparent; border-style: dashed; }
.fb-dot.is-past { opacity: .55; }
.fb-dot.is-on { border-color: var(--kr-white); background: var(--kr-white); }
.fb-dot.is-on.is-wire { background: transparent; }
.fb-now { color: #c9cde0; overflow: hidden; text-overflow: ellipsis; }
.fb-now i { font-style: normal; color: #8a93ab; }
.fb-nav { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 8px; background: rgba(255, 255, 255, .08); color: var(--kr-white); cursor: pointer; }
.fb-nav:disabled { opacity: .35; cursor: default; }
.fb-nav:hover:not(:disabled) { background: rgba(255, 255, 255, .16); }
.fb-nav svg { width: 16px; height: 16px; }
.fb-next svg { transform: rotate(180deg); }
.flow-bar [data-tip]::after { right: auto; left: 50%; top: auto; bottom: calc(100% + 10px); transform: translate(-50%, 4px); }
.flow-bar [data-tip]:is(:hover, :focus-visible)::after { transform: translate(-50%, 0); }
@media (max-width: 760px) { .fb-name, .fb-now { display: none; } .flow-bar, .proto-note { max-width: calc(100vw - 140px); } }

/* More options has two views (tabs at the top, they stay put while the panel scrolls): Flows, with the processing
   result, the four flows (each with its own CV choice) and the goal and method screens' look; and URLs, a CV
   choice for the screens opened from there and every screen */
.pm-tabs { position: sticky; top: -10px; z-index: 2; display: flex; gap: 2px; margin: -10px -10px 0 -12px; padding: 10px 10px 4px 12px; background: var(--kr-blue-dark); }
.pm-tab { flex: 1; height: 30px; border: 0; border-radius: 8px; background: rgba(255, 255, 255, .06); color: #c9cde0; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; transition: background var(--dur-fast), color var(--dur-fast); }
.pm-tab:hover { background: rgba(255, 255, 255, .12); color: var(--kr-white); }
.pm-tab[aria-selected="true"] { background: var(--kr-white); color: var(--kr-blue-dark); }
.pm-tab:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(255, 255, 255, .5); }
.pm-count { font-weight: 400; opacity: .6; }
.pm-view { display: grid; gap: 10px; }
.pm-view[hidden] { display: none; }
.pm-view > .pm-sec:last-child { padding-bottom: 0; border-bottom: 0; }
.pm-key { font-size: 12px; line-height: 16px; color: #c9cde0; }
.proto-more .pm-seg button { width: auto; height: 28px; padding: 0 10px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.proto-more .pm-sec > .pm-row { min-height: 34px; }
/* More options › URLs: the recreated product screens, each with its URL */
.pm-sec { display: grid; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, .1); }
.pm-route {
  display: grid; gap: 1px; margin-inline: -6px; padding: 6px; border: 0; border-radius: 8px; background: none;
  color: var(--kr-white); text-align: left; cursor: pointer; transition: background var(--dur-fast);
}
.pm-route:hover { background: rgba(255, 255, 255, .08); }
.pm-route:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(255, 255, 255, .5); }
.pm-route b { font-size: 13px; line-height: 18px; font-weight: 500; }
.pm-route code { font: 11px/14px ui-monospace, SFMono-Regular, Menlo, monospace; color: #8a93ab; }
.pm-route[aria-current="true"] code { color: #c9cde0; }
.pm-route.is-todo b::after { content: " · wireframe"; font-weight: 400; color: #8a93ab; }
.pm-sub { margin-top: 6px; font-size: 11px; line-height: 14px; color: #8a93ab; }
.pm-sub:first-child { margin-top: 2px; }
#pm-routes { display: grid; gap: 2px; }
/* The four flow templates: stage chips coloured like the flow board (preparation grey, processing sand,
   destination green, dashboard blue), a feature (URL) picker and what that feature puts in the stages */
#pm-flows { display: grid; gap: 8px; }
/* More options › Flows: the Flow checker switch, then Look */
.pmf-check { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 34px; }
.pmf-cv {
  position: relative; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: 8px;
  background: rgba(255, 255, 255, .1); color: #c9cde0; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; transition: background var(--dur-fast);
}
.pmf-cv:hover { background: rgba(255, 255, 255, .16); }
.pmf-cv i, .dk-sw i { position: relative; display: block; width: 24px; height: 14px; border-radius: 7px; background: rgba(255, 255, 255, .25); transition: background var(--dur-fast) var(--ease-standard); }
.pmf-cv i::after, .dk-sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--kr-white); transition: transform var(--dur-fast) var(--ease-standard); }
.pmf-cv[aria-checked="true"] { color: var(--kr-white); }
.pmf-cv[aria-checked="true"] i, .dk-cv[aria-checked="true"] .dk-sw i { background: var(--kr-blue); }
.pmf-cv[aria-checked="true"] i::after, .dk-cv[aria-checked="true"] .dk-sw i::after { transform: translateX(10px); }
.pmf-cv:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(255, 255, 255, .5); }
.pm-opts { gap: 2px; padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, .1); }
.st-process, .st-state { background: rgba(251, 225, 168, .16); color: #f3d9a4; }
.st-dest { background: rgba(143, 214, 184, .16); color: #9fe0c4; }
.st-entry { background: none; color: #8a93ab; box-shadow: inset 0 0 0 1px rgba(138, 147, 171, .5); }

/* The run dock, bottom right beside More options: Open (the URL), From, CV, Ends (the processing result) and Run, in one
   row; a caption over each value, each list opening upwards (fixed, so nothing clips it) and scrolling inside itself */
.proto-dock {
  position: fixed; right: 56px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  display: flex; align-items: center; gap: 2px; max-width: calc(100vw - 80px); padding: 4px; border-radius: 14px;
  background: var(--kr-blue-dark); color: var(--kr-white); box-shadow: var(--kr-shadow-modal);
}
.proto-dock:empty { display: none; }
.dk-btn, .dk-cv {
  position: relative; display: grid; align-content: center; justify-items: start; gap: 1px; height: 40px; padding: 0 10px; border: 0; border-radius: 10px;
  background: none; color: var(--kr-white); font: inherit; text-align: left; cursor: pointer; transition: background var(--dur-fast);
}
.dk-btn:hover, .dk-btn[aria-expanded="true"], .dk-cv:hover:not([aria-disabled="true"]) { background: rgba(255, 255, 255, .08); }
.dk-btn:focus-visible, .dk-cv:focus-visible, .dk-run:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(255, 255, 255, .5); }
.dk-cap { font-size: 10px; line-height: 12px; font-weight: 500; letter-spacing: .4px; text-transform: uppercase; color: #8a93ab; }
.dk-val { display: flex; align-items: center; gap: 4px; max-width: 100%; font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; }
.dk-val b { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.dk-short { display: none; }
[data-dd="url"] .dk-val b { max-width: 190px; }
.dk-chev { flex: none; width: 12px; height: 12px; fill: none; stroke: #8a93ab; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform var(--dur-fast) var(--ease-standard); }
.dk-btn[aria-expanded="true"] .dk-chev { transform: rotate(180deg); }
.dk-sw { display: flex; align-items: center; height: 16px; }
.dk-cv[aria-disabled="true"] { cursor: default; }
.dk-cv[aria-disabled="true"] .dk-sw { opacity: .4; }
.dk-run {
  position: relative; display: flex; align-items: center; gap: 6px; height: 40px; margin-left: 4px; padding: 0 12px 0 10px; border: 0; border-radius: 10px;
  background: var(--kr-white); color: var(--kr-blue-dark); font: inherit; font-size: 12px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: background var(--dur-fast);
}
.dk-run:hover { background: #e4e7f0; }
.dk-run svg { width: 14px; height: 14px; fill: currentColor; }
.dk-run.is-on { box-shadow: 0 0 0 2px #9fe0c4; }  /* this flow is the one running */
.dk-list {
  position: fixed; z-index: 25; overflow-y: auto; overscroll-behavior: contain; padding: 4px; border-radius: 12px; background: var(--kr-blue-dark); color: var(--kr-white);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .16), var(--kr-shadow-modal); scrollbar-width: thin;
}
.dk-list:focus { outline: none; }
.dk-g { padding: 8px 8px 3px; font-size: 11px; line-height: 14px; color: #8a93ab; }
.dk-opt { position: relative; display: grid; gap: 1px; padding: 6px 28px 6px 8px; border-radius: 7px; font-size: 12px; line-height: 16px; color: #d6dae4; cursor: pointer; }
.dk-opt small { font-size: 11px; line-height: 15px; color: #8a93ab; }
.dk-opt.is-active { background: rgba(255, 255, 255, .1); color: var(--kr-white); }
.dk-list:focus-visible .dk-opt.is-active { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .45); }
.dk-opt[aria-selected="true"] { color: var(--kr-white); font-weight: 500; }
.dk-opt[aria-selected="true"]::after { content: ""; position: absolute; right: 10px; top: 11px; width: 10px; height: 6px; border: solid #9fe0c4; border-width: 0 0 2px 2px; transform: rotate(-45deg); }
.dk-opt[aria-disabled="true"] { opacity: .4; cursor: default; }
.dk-opt[aria-disabled="true"]::before { content: "Not for this URL"; order: 3; font-size: 11px; line-height: 15px; font-weight: 400; color: #8a93ab; }
.proto-dock [data-tip]::after { right: auto; left: 50%; top: auto; bottom: calc(100% + 10px); transform: translate(-50%, 4px); }
.proto-dock [data-tip]:is(:hover, :focus-visible)::after { transform: translate(-50%, 0); }
/* while a flow runs its bar sits over the dock, and a wireframe's note over the bar */
.flow-bar { bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
.proto-note { bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
.flow-bar:not([hidden]) ~ .proto-note { bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 760px) { [data-dd="url"] .dk-val b { max-width: 120px; } .dk-btn, .dk-cv { padding: 0 8px; } }
/* On a real phone the dock gets its own row above the bottom one (version, More options, rail): no captions or
   chevrons, short labels (Landing, Done, ▶ 4) and the URL taking what is left; the flow bar and a note go above it */
@media (max-width: 480px) {
  .proto-dock { left: 12px; right: 12px; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); max-width: none; }
  .dk-cap, .dk-chev, .dk-long { display: none; }
  .dk-short { display: inline; }
  .dk-dd { flex: none; }
  .dk-dd[data-dd="url"] { flex: 1 1 auto; min-width: 0; }
  [data-dd="url"] .dk-btn { width: 100%; grid-template-columns: minmax(0, 1fr); }
  [data-dd="url"] .dk-val b { max-width: none; }
  .dk-btn, .dk-cv { height: 36px; padding: 0 7px; }
  .dk-run { flex: none; height: 36px; padding: 0 12px 0 10px; }
}
@media (max-width: 360px) { .dk-btn, .dk-cv { padding: 0 4px; } .dk-run { padding: 0 8px 0 6px; } .proto-dock { gap: 0; } }  /* the URL keeps some room */
.proto-more-panel { width: min(360px, calc(100vw - 24px)); max-height: calc(100vh - 72px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
@media (max-width: 480px) { .proto-more-panel { width: calc(100vw - 72px); } }  /* beside the folded rail */
.pm-route code { overflow-wrap: anywhere; }

/* ---------- Responsive ---------- */
/* Goal cards: two columns (560px) below ~1100px */
@container (max-width: 1068px) {
  .intent-grid:not(.is-list) { --gw: min(560px, 100cqw); grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@container (max-width: 560px) {
  .topbar { padding-block: 16px; padding-inline: 0; }
  .logo svg, .topbar .logo svg { width: 120px; }
  .page { padding-block: max(12px, calc(var(--sp-page-top) - var(--anchor-cut))) var(--sp-page-bottom); }
  .page-head h1 { font-size: min(34px, var(--h1)); letter-spacing: -1px; }
  /* headlines and subheadlines take one or two lines here: two are kept for all (a short headline sits on its
     subheadline), so the content below starts at the same place on every screen */
  .page-head h1 { display: grid; align-content: end; min-height: calc(2em * 1.17); }
  .page-head p { min-height: calc(2 * 24px); }
  .intent-grid, .intent-grid:not(.is-list) { grid-template-columns: 1fr; gap: 12px; }
  .irow { padding: 14px; gap: 14px; }
  /* Goal cards as rows (Figma's mobile card): a 96px picture on the left, its 156px stage scaled to 72px */
  .intent { flex-direction: row; align-items: center; gap: 20px; padding: 12px; }

  const SECTION_AS = {

    } else if (opts.as === SECTION_AS.summary) q.profile = `${title} with a record of turning messy problems into clear plans and shipped results. Works closely with the people around them and keeps every project moving.`;

  /* Each finished step visibly fills part of the page, so progress reads as "your resume taking shape" */
  function runBuilding() {
    const steps = [...screens.loading.querySelectorAll('.step')];

    const fills = [[0], [1, 2], [3]];

    // a run's processing set to fail (More options › Result) stops on its second step, with no "ready" and no
    // confetti, and goes on to the processing state that says so
    if (procResult !== 'ok' && flowNow && flowNow.steps[flowAt] && flowNow.steps[flowAt].stage === 'process') {
      steps.slice(0, 2).forEach((st, i) => later(() => { if (i) steps[0].classList.replace('is-active', 'is-done'); st.classList.add('is-active'); }, start + i * T));
      return later(afterBuild, start + 1.6 * T);
    }
    steps.forEach((st, i) => later(() => {
      if (i) { steps[i - 1].classList.replace('is-active', 'is-done'); fills[i - 1].forEach(g => groups[g].classList.add('is-filled')); }
      st.classList.add('is-active');
    }, start + i * T));
    later(() => {
      const last = steps.length - 1;
      steps[last].classList.replace('is-active', 'is-done');
      fills[last].forEach(g => groups[g].classList.add('is-filled'));
      paper.classList.add('is-done');

    { transform: `scale(${from})`, opacity: 0 },

    { transform: 'scale(.96)', offset: .78 },
    { transform: 'scale(1)', opacity: 1 }], POP);

  // Lightweight confetti: brand colours, gravity, drag, a little flutter. One shared canvas.
  const CONFETTI_COLORS = ['#ff5e59', '#a066ff', '#666cff', '#1da36e', '#ffc107', '#514eea', '#fbe0de'];
  let confettiCanvas = null, confettiParts = [], confettiRaf = 0;
  function confetti(x, y, opts = {}) {
    if (reduce) return;
    const { count = 90, spread = 70, angle = -90, power = 12 } = opts;
    if (!confettiCanvas) {
      confettiCanvas = document.createElement('canvas');
      confettiCanvas.className = 'confetti';
      document.body.appendChild(confettiCanvas);
    }
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    confettiCanvas.width = innerWidth * dpr; confettiCanvas.height = innerHeight * dpr;
    for (let i = 0; i < count; i++) {
      const a = (angle + (Math.random() - .5) * spread) * Math.PI / 180;
      const v = power * (.55 + Math.random() * .6);
      confettiParts.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: Math.random() * 360, vr: (Math.random() - .5) * 18,
        w: 6 + Math.random() * 5, h: 3 + Math.random() * 4, round: Math.random() < .3, t: 0,
        life: 70 + Math.random() * 50, flutter: Math.random() * Math.PI * 2,
        color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0]
      });
    }
    if (!confettiRaf) confettiRaf = requestAnimationFrame(drawConfetti);
  }
  function drawConfetti() {
    const ctx = confettiCanvas.getContext('2d'), dpr = confettiCanvas.width / innerWidth;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.save();
    if (framed()) {  // keep the party inside the phone
      const b = device.getBoundingClientRect();
      ctx.beginPath(); ctx.roundRect(b.left + device.clientLeft, b.top + device.clientTop, device.clientWidth, device.clientHeight, 38); ctx.clip();
    }
    confettiParts = confettiParts.filter(p => p.t < p.life && p.y < innerHeight + 40);
    for (const p of confettiParts) {
      p.t++; p.vx *= .985; p.vy = p.vy * .985 + .32; p.flutter += .18;
      p.x += p.vx + Math.sin(p.flutter) * .6; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.globalAlpha = Math.min(1, (p.life - p.t) / 22);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);

      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    ctx.restore();
    if (confettiParts.length) confettiRaf = requestAnimationFrame(drawConfetti);
    else { confettiRaf = 0; confettiCanvas.remove(); confettiCanvas = null; }

  /* On the building screen: the page pops, a check stamps onto it,

  function celebrateBuilt() {

  /* Moving between pages inside the app the menu stays where it is; only the page next to it changes */
  const hasSide = el => !!el && shown(el) && !!el.querySelector(':scope > .ed-side') && shown(el.querySelector(':scope > .ed-side'));
  async function leaveOut(fromEl, keepSide) {
    if (!fromEl) return;
    const els = keepSide ? [...fromEl.children].filter(c => !c.matches('.ed-side')) : [fromEl];
    if (!reduce) await Promise.all(els.map(x => x.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: APPS[current] ? 'none' : 'translateY(-8px)' }], { duration: DUR.fast, easing: EASE.exit, fill: 'forwards' }).finished.catch(() => {})));
    els.forEach(x => x.getAnimations().forEach(a => a.cancel()));
  }
  /* Open a full-screen app view (dashboard) from any screen */

      { duration: DUR.base + 60, delay: i * (STAGGER + 15), easing: EASE.standard }));

    scale: '<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
    briefcase: '<path d="M12 12h.01"/><path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M22 13a18.15 18.15 0 0 1-20 0"/><rect width="20" height="14" x="2" y="6" rx="2"/>',
    goal: '<path d="M12 13V2l8 4-8 4"/><path d="M20.561 10.222a9 9 0 1 1-12.55-5.29"/><path d="M8.002 9.997a5 5 0 1 0 8.9 2.02"/>',
    list: '<path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/>',
    lines: '<path d="M15 12H3"/><path d="M17 18H3"/><path d="M21 6H3"/>',
    pen: '<path d="M15 3 8.6 10.4"/><path d="M8.6 10.4 4.2 15.3a2 2 0 0 0-.5 1.3V20H11l4-4z"/><path d="m15 16 5.5-5.5"/>'
  };
  /* Language dropdown (the same component as on Create Resume with AI) */
  function langHTML(langs) {
    return `<div class="aim-lang-wrap">
      <button class="aim-lang" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Language: ${langs[0]}">${aimIcon.globe}<span class="val">${langs[0]}</span>${aimIcon.chevron}</button>
      <ul class="aim-menu" role="listbox" aria-label="Language" hidden>${langs.map((l, i) =>
        `<li role="presentation"><button class="aim-opt" type="button" role="option" aria-selected="${i === 0}" data-lang="${l}">${l}${aimIcon.check}</button></li>`).join('')}</ul></div>`;
  }
  function initLang(wrap) {
    if (!wrap) return;
    const btn = wrap.querySelector('.aim-lang'), menu = wrap.querySelector('.aim-menu');
    const set = open => { menu.hidden = !open; btn.setAttribute('aria-expanded', String(open)); if (open) (menu.querySelector('[aria-selected="true"]') || menu.querySelector('.aim-opt')).focus(); };
    btn.addEventListener('click', () => set(menu.hidden));
    menu.addEventListener('click', e => {
      const o = e.target.closest('.aim-opt'); if (!o) return;
      menu.querySelectorAll('.aim-opt').forEach(x => x.setAttribute('aria-selected', String(x === o)));
      btn.querySelector('.val').textContent = o.dataset.lang; btn.setAttribute('aria-label', 'Language: ' + o.dataset.lang);
      set(false); btn.focus();
    });
    wrap.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !menu.hidden) { e.stopPropagation(); set(false); btn.focus(); }
      if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.closest('.aim-menu')) {
        e.preventDefault();
        const opts = [...menu.querySelectorAll('.aim-opt')], i = opts.indexOf(e.target.closest('.aim-opt'));
        opts.at((i + (e.key === 'ArrowDown' ? 1 : -1)) % opts.length).focus();
      }
    });
    closeOnLeave(wrap, () => !menu.hidden, () => set(false));
  }
  /* Required fields: a coral outline until the person types */
  function needFilled(fields) {
    const bad = fields.filter(el => !el.value.trim());
    fields.forEach(el => el.classList.toggle('is-error', bad.includes(el)));
    if (bad[0]) bad[0].focus();
    return !bad.length;
  }
  document.addEventListener('input', e => { if (e.target.classList && e.target.classList.contains('is-error') && e.target.value.trim()) e.target.classList.remove('is-error'); });
  /* Where the result would open isn't designed yet: show it's working, then say so */
  function notYet(btn, label, msg) { busy(btn, label, 1400, () => toast(msg)); }

  /* ---------- Generate work experience / resume objective (/ai/resume/…) ---------- */
  const TONES = [['friendly', 'Friendly', RT_IC.smile], ['professional', 'Professional', RT_IC.scale], ['formal', 'Formal', RT_IC.briefcase], ['confident', 'Confident', RT_IC.goal]];
  const FORMS = [['bullets', 'Bullet points', RT_IC.list], ['paragraphs', 'Paragraphs', RT_IC.lines], ['structured', 'Structured', RT_IC.pen]];
  // the section writers (Generate work experience / objective) and the Summary generator: one design, their own copy
  const AIG = {
    experience: ['Generate work experience', [['title', 'Job title'], ['company', 'Company']], 'structured'],
    objective: ['Generate resume objective', [['title', 'Job you’re applying for']], 'paragraphs'],
    summary: ['Generate resume summary', [['title', 'Job title']], 'paragraphs']
  };
  function aigHTML(kind) {
    const [title, fields, rec] = AIG[kind];
    const chips = (list, sel, recId) => list.map(([id, label, ic]) => `<button class="aig-chip" type="button" role="radio" aria-checked="${id === sel}" tabindex="${id === sel ? 0 : -1}" data-v="${id}"><span class="aig-in">${rtIc(ic)}<span class="lbl">${label}</span></span>${id === recId ? '<span class="aig-rec">Recommended</span>' : ''}</button>`).join('');
    return `<form class="rt-card aig" data-kind="${kind}" novalidate aria-labelledby="aig-h">
      <div class="aig-head"><h1 id="aig-h">${title}</h1>${langHTML(AIM_LANGS)}</div>
      <div class="aig-fields${fields.length > 1 ? '' : ' is-one'}">${fields.map(([n, l]) => `<div class="aig-field"><label for="aig-${n}">${l}</label><input class="aig-input" id="aig-${n}" name="${n}" placeholder="${l}" autocomplete="off"></div>`).join('')}</div>
      <div class="aig-opts">
        <div><span class="aig-l" id="aig-tone">Tone of Voice</span><div class="aig-chips" role="radiogroup" aria-labelledby="aig-tone">${chips(TONES, 'professional')}</div></div>
        <div><span class="aig-l" id="aig-form">Form</span><div class="aig-chips" role="radiogroup" aria-labelledby="aig-form">${chips(FORMS, rec, rec)}</div></div>
      </div>
      <div class="aig-foot"><button class="rt-btn rt-ai aig-go" type="submit">Generate</button></div>
    </form>`;
  }
  function initAig(form, generate) {
    initLang(form.querySelector('.aim-lang-wrap'));
    form.addEventListener('click', e => {
      const chip = e.target.closest('.aig-chip');
      if (chip) chip.parentElement.querySelectorAll('.aig-chip').forEach(c => c.setAttribute('aria-checked', String(c === chip)));
    });
    form.addEventListener('submit', e => {
      e.preventDefault();
      if (!needFilled([form.elements.title])) return;
      if (generate) return generate(form);  // the writer pop-up over Fill In
      startCreation(form, 'ai', { name: [person.first, person.last].filter(Boolean).join(' '), title: form.elements.title.value,
        company: form.elements.company ? form.elements.company.value : '', as: SECTION_AS[form.dataset.kind] });
    });
  }

  /* ---------- AI writers with Basic / Personalized: cover letter, interview questions ---------- */
  const COVER_LANGS = ['English', 'Czech', 'Slovak', 'German', 'French', 'Spanish', 'Italian', 'Polish', 'Portuguese', 'Dutch'];
  const IVW_DESC = {
    basic: 'In Basic mode, Kickresume quickly generates a set of interview questions tailored to your desired job position.',
    personalized: 'In Personalized mode, Kickresume generates interview questions tailored not only to the job you want but also to your previous work experience.'
  };
  const SAMPLE_AD = `Product Designer (mid-level), Lumen Health, Bratislava or remote. You will own the patient onboarding flow end to end: research, flows, UI and hand-off. 3+ years designing web or mobile products, a portfolio with shipped work, and comfort running usability tests. Figma, design systems, working closely with engineers.`;
  const tabsHTML = () => `<div class="aim-tabs" role="group" aria-label="AI Writer mode">
      <button class="aim-tab" type="button" data-aim-mode="basic" aria-pressed="true">${aimIcon.clock}<span>Basic</span></button>
      <button class="aim-tab" type="button" data-aim-mode="personalized" aria-pressed="false">${aimIcon.upCircle}<span>Personalized</span></button>
    </div>`;
  const stepTwoPanes = kind => `<div class="rt-pane" data-pane="s2" hidden>${selectHTML(kind)}</div>`;
  function coverHTML() {
    return `<div class="rt-panes" data-writer="cover">
      <div class="rt-pane" data-pane="s1"><form class="rt-card aiw" data-mode="basic" novalidate aria-labelledby="cov-h">
        <h1 id="cov-h">AI Cover Letter Writer</h1>${tabsHTML()}
        <p class="aim-desc">${AIM_DESC.basic}</p>
        <div class="aim-field"><label for="cov-title">Job title on the application (required)</label><input class="aim-input" id="cov-title" name="title" autocomplete="off"></div>
        <div class="aim-field"><label for="cov-post">Copy and paste the job post here</label><textarea class="aim-input aim-ta" id="cov-post" name="post" maxlength="6000"></textarea><span class="aim-count">0/6000</span></div>
        <p class="rt-step" data-only="personalized" hidden>Step 1/2</p>
        <div class="aim-foot">${langHTML(COVER_LANGS)}<button class="rt-btn rt-ai aiw-go" type="submit" data-only="basic">Generate with AI</button><button class="rt-btn rt-coral aiw-next" type="button" data-only="personalized" hidden>Next</button></div>
      </form></div>${stepTwoPanes('cover')}</div>`;
  }
  function interviewHTML() {
    return `<div class="rt-panes" data-writer="interview">
      <div class="rt-pane" data-pane="s1"><form class="rt-card aiw ivw" data-mode="basic" novalidate aria-labelledby="ivw-h">
        <h1 id="ivw-h">Job Interview Questions</h1>${tabsHTML()}
        <p class="aim-desc">${IVW_DESC.basic}</p>
        <div class="aim-field"><label for="ivw-title">Job title from the job ad (required)</label><input class="aim-input" id="ivw-title" name="title" autocomplete="off"></div>
        <div class="aim-field" data-only="personalized" hidden><label for="ivw-post">Copy-paste the job ad here (required)</label>
          <div class="aiw-ta"><textarea class="aim-input aim-ta" id="ivw-post" name="post" maxlength="1000"></textarea><button class="aiw-paste" type="button">${rtIc(RT_IC.clipboard)}Paste</button></div><span class="aim-count">0/1000</span></div>
        <div class="aim-field"><span class="aiw-l" id="ivw-sen">Seniority</span><div class="seg3" role="radiogroup" aria-labelledby="ivw-sen">${['Junior', 'Mid', 'Senior'].map(s => `<button type="button" role="radio" aria-checked="${s === 'Mid'}" tabindex="${s === 'Mid' ? 0 : -1}">${s}</button>`).join('')}</div></div>
        <p class="rt-step" data-only="personalized" hidden>Step 1/2</p>
        <div class="aim-foot"><button class="rt-btn rt-ai ivw-go" type="submit" data-only="basic">Generate with AI</button><button class="rt-btn rt-coral aiw-next" type="button" data-only="personalized" hidden>Next</button></div>
      </form></div>${stepTwoPanes('interview')}</div>`;
  }
  function initWriter(root) {
    const kind = root.dataset.writer, form = root.querySelector('form'), desc = form.querySelector('.aim-desc');
    const DESC = kind === 'cover' ? AIM_DESC : IVW_DESC, result = kind === 'cover' ? 'cover letter' : 'interview questions';
    initLang(form.querySelector('.aim-lang-wrap'));
    function setMode(mode) {
      if (mode === form.dataset.mode) return;
      morphHeight(form, () => {
        form.dataset.mode = mode;
        form.querySelectorAll('.aim-tab').forEach(t => t.setAttribute('aria-pressed', String(t.dataset.aimMode === mode)));
        desc.textContent = DESC[mode];
        form.querySelectorAll('[data-only]').forEach(el => { el.hidden = el.dataset.only !== mode; });
      });
      if (!reduce) play(desc, [{ opacity: 0 }, { opacity: 1 }], { duration: DUR.base, easing: EASE.standard }).finished.catch(() => {}).then(a => desc.getAnimations().forEach(x => x.cancel()));
    }
    const required = () => [form.elements.title, ...(kind === 'interview' && form.dataset.mode === 'personalized' ? [form.elements.post] : [])];
    const toStepTwo = () => { refreshSel(root.querySelector('.sel')); showPane(root, 's2', 1); };
    form.addEventListener('click', e => {
      const tab = e.target.closest('.aim-tab'); if (tab) return setMode(tab.dataset.aimMode);
      const seg = e.target.closest('.seg3 button'); if (seg) return seg.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', String(b === seg)));
      if (e.target.closest('.aiw-paste')) {
        const ta = form.elements.post;
        const fill = t => { ta.value = t.slice(0, +ta.maxLength); ta.dispatchEvent(new Event('input', { bubbles: true })); ta.focus(); };
        (navigator.clipboard && navigator.clipboard.readText ? navigator.clipboard.readText() : Promise.reject()).then(t => fill(t.trim() || SAMPLE_AD), () => fill(SAMPLE_AD));
        return;
      }
      // step 2 picks one of the person's resumes: without one, the method screen makes it first and step 2 follows
      if (e.target.closest('.aiw-next') && needFilled(required())) { const r = routeNow; cvUploaded ? toStepTwo() : askCv(() => backToRoute(r, toStepTwo)); }
    });
    form.addEventListener('input', e => { if (e.target.name === 'post') e.target.parentElement.closest('.aim-field').querySelector('.aim-count').textContent = `${e.target.value.length}/${e.target.maxLength}`; });
    form.addEventListener('submit', e => {
      e.preventDefault();
      // Enter in Personalized goes on to step 2, like Next
      if (form.dataset.mode === 'personalized') return form.querySelector('.aiw-next').click();
      if (!needFilled(required())) return;
      if (kind === 'interview') { iqRole = form.elements.title.value.trim() || iqRole; if (!flowOn()) openInterview('process'); return; }  // Job Interviews: its loading, then the questions
      if (kind === 'cover') { if (!flowOn()) writeLetter('cover', form.elements.title.value.trim()); else letterFor('cover', form.elements.title.value.trim()); return; }  // its building screen, then Fill In with the letter
      if (!flowOn()) notYet(form.querySelector('[type="submit"]'), 'Writing…', `The ${result} would open here; that screen isn’t part of the prototype yet.`);
    });
    const sel = root.querySelector('.sel');
    sel.addEventListener('click', e => {
      const it = e.target.closest('.sel-item'); if (it) return sel.querySelectorAll('.sel-item').forEach(x => x.setAttribute('aria-checked', String(x === it)));
      if (e.target.closest('.sel-back')) showPane(root, 's1', -1);
      if (e.target.closest('.sel-go') && kind === 'cover') { const t = form.elements.title.value.trim(); if (!flowOn()) writeLetter('cover', t); else letterFor('cover', t); return; }
      if (e.target.closest('.sel-go') && kind === 'interview') { iqRole = form.elements.title.value.trim() || iqRole; if (!flowOn()) openInterview('process'); return; }
      if (e.target.closest('.sel-go') && !flowOn()) notYet(e.target.closest('.sel-go'), 'Writing…', `The personalized ${result} would open here; that screen isn’t part of the prototype yet.`);
    });
  }

  /* ---------- Tailor your resume to a job (/dashboard/tailor-resume/, /jobs/job/{id}/tailor/) ----------
     The job post as a URL or typed in (the link under the fields switches), or the job a job page passed on;
     Tailor Now opens the tailoring screen (tldHTML) in the same route. */
  const TRL_IC = {
    flame: '<path d="M12 3c.667 2.667 2 4.833 4 6.5s3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.082.351-2.135 1-3a2.5 2.5 0 0 0 5 0c0-2-1.5-3-1.5-5 0-1.333.833-2.667 2.5-4Z"/>',
    clock: '<circle cx="8" cy="8" r="6.667"/><path d="M8 4v4l2.667 1.333"/>',
    pin: '<path d="M13.333 6.667c0 3.329-3.692 6.796-4.932 7.866a.67.67 0 0 1-.802 0C6.359 13.463 2.667 9.996 2.667 6.667a5.333 5.333 0 0 1 10.666 0Z"/><circle cx="8" cy="6.667" r="2"/>',
    fading: '<path d="M8 1.334a6.667 6.667 0 0 1 4.92 11.167"/><path d="M8 4v4l2.667 1.333"/><path d="M1.667 5.916a6.67 6.67 0 0 0-.334 2"/><path d="M1.887 10.666a6.67 6.67 0 0 0 1.62 2.267"/><path d="M3.09 3.491q.28-.303.595-.571"/><path d="M5.763 14.279a6.67 6.67 0 0 0 5.087-.254"/>',
    brief: '<path d="M10.667 13.334V2.667A1.333 1.333 0 0 0 9.333 1.334H6.667a1.333 1.333 0 0 0-1.334 1.333v10.667"/><rect x="1.333" y="4" width="13.333" height="9.333" rx="1.333"/>'
  };
  const TRL_LEVELS = [
    ['conservative', 'Conservative', RT_IC.smile, 'Safe. Sticks close to your own words. Doesn’t invent or oversell.'],
    ['balanced', 'Balanced', RT_IC.scale, 'Recommended. The sweet spot — polished, relevant, and still you.'],
    ['turbo', 'Turbo', TRL_IC.flame, 'Bold. Goes all-in on the job match. Double-check before sending.']
  ];
  const TRL_POST_MAX = 6000;
  // the job a job page passes on (the design's sample)
  // the job the job page shows (Figma concepting-KR › 294:3680), the one tailoring from it uses
  const TRL_JOB = { title: 'Server Administrator', company: 'Cisco', logo: '__ASSET:jobs/cisco.png__',
    meta: [['clock', '5 days ago'], ['pin', 'United States +2'], ['fading', 'Part-time +2'], ['brief', 'Remote']] };
  const TRL_SWITCH = { url: 'No URL? Paste job description', manual: 'Got URL? Paste it instead' };
  function trlHTML(fromJob) {
    const field = (id, label, input) => `<div class="trl-field"><label for="trl-${id}">${label}</label>${input}</div>`;
    const job = `<div class="trl-field"><span class="trl-l">Job post</span><div class="trl-job"><img src="${TRL_JOB.logo}" alt="" width="40" height="40">
      <b title="${TRL_JOB.title}">${TRL_JOB.title}</b><span class="trl-job-co">${TRL_JOB.company}</span>
      <span class="trl-meta">${TRL_JOB.meta.map(([ic, t]) => `<span><svg viewBox="0 0 16 16" aria-hidden="true">${TRL_IC[ic]}</svg>${t}</span>`).join('')}</span></div></div>`;
    const typed = `<div class="trl-fields" data-only="url">${field('url', 'Job post URL', '<input class="trl-input" id="trl-url" name="url" type="url" inputmode="url" autocomplete="off">')}</div>
      <div class="trl-fields" data-only="manual" hidden>
        <div class="trl-row">${field('title', 'Job title', '<input class="trl-input" id="trl-title" name="title" autocomplete="off">')}${field('company', 'Company name', '<input class="trl-input" id="trl-company" name="company" autocomplete="off">')}</div>
        ${field('post', 'Job post', `<textarea class="trl-input trl-ta" id="trl-post" name="post" maxlength="${TRL_POST_MAX}" aria-describedby="trl-count"></textarea><span class="trl-count" id="trl-count">0/${TRL_POST_MAX}</span>`)}
      </div>`;
    return `<form class="rt-card trl" data-mode="${fromJob ? 'job' : 'url'}" novalidate aria-labelledby="trl-h">
      <h1 id="trl-h">Tailor your resume to a job</h1>
      <div class="trl-main"><div class="trl-body"><div class="trl-top">${fromJob ? job : typed}
        <div class="trl-level"><span class="trl-l" id="trl-lv">Tailoring level</span>
          <div class="trl-seg" role="radiogroup" aria-labelledby="trl-lv">${TRL_LEVELS.map(([id, name, ic], i) =>
            `<button class="trl-opt" type="button" role="radio" aria-checked="${i === 1}" tabindex="${i === 1 ? 0 : -1}" aria-label="${name}" data-level="${id}">${rtIc(ic)}<span>${name}</span></button>`).join('')}</div>
          <p class="trl-desc" aria-live="polite">${TRL_LEVELS[1][3]}</p></div>
      </div>${fromJob ? '' : `<button class="trl-switch" type="button">${TRL_SWITCH.url}</button>`}</div>
      <div class="trl-foot">${fromJob ? '<button class="rt-btn rt-ghost trl-cancel" type="button">Cancel</button>' : ''}<button class="rt-btn rt-ai trl-go" type="submit"${fromJob ? '' : ' disabled'}>Tailor Now</button></div></div>
    </form>`;
  }
  function initTrl(form, r) {
    const root = form.closest('.rt-panes'), go = form.querySelector('.trl-go'), desc = form.querySelector('.trl-desc');
    // Cancel (the job version) goes back to the job page; in a run, to its job page step
    form.querySelector('.trl-cancel')?.addEventListener('click', () => {
      const i = flowNow ? flowNow.steps.findIndex(st => st.match.startsWith('route:/jobs/job/1234/#')) : -1;
      if (i >= 0) return flowGo(i);
      openRoute(findRoute('/jobs/job/1234/'));
    });
    const val = n => (form.elements[n] ? form.elements[n].value.trim() : '');
    // Tailor Now needs the URL, or the job post when it's typed in; a job from a job page is enough on its own
    const check = () => { if (form.dataset.mode !== 'job') go.disabled = !val(form.dataset.mode === 'url' ? 'url' : 'post'); };
    function setMode(mode) {
      const part = form.querySelector(`[data-only="${mode}"]`);
      morphHeight(form, () => {
        form.dataset.mode = mode;
        form.querySelectorAll('[data-only]').forEach(el => { el.hidden = el !== part; });
        form.querySelector('.trl-switch').textContent = TRL_SWITCH[mode];
        check();
      });
      if (!reduce) part.animate([{ opacity: 0 }, { opacity: 1 }], { duration: DUR.base, easing: EASE.standard });
      part.querySelector('.trl-input').focus({ preventScroll: true });
    }
    function setLevel(opt) {
      form.querySelectorAll('.trl-opt').forEach(o => { o.setAttribute('aria-checked', String(o === opt)); o.tabIndex = o === opt ? 0 : -1; });
      desc.textContent = TRL_LEVELS.find(l => l[0] === opt.dataset.level)[3];
    }
    form.addEventListener('click', e => {
      const opt = e.target.closest('.trl-opt');
      if (opt) return setLevel(opt);
      if (e.target.closest('.trl-switch')) setMode(form.dataset.mode === 'url' ? 'manual' : 'url');
    });
    form.querySelector('.trl-seg').addEventListener('keydown', e => {
      const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      if (!step) return;
      e.preventDefault();
      const opts = [...form.querySelectorAll('.trl-opt')], at = opts.findIndex(o => o.getAttribute('aria-checked') === 'true');
      const next = opts[(at + step + opts.length) % opts.length];
      setLevel(next); next.focus();
    });
    form.addEventListener('input', e => {
      if (e.target.name === 'post') form.querySelector('.trl-count').textContent = `${e.target.value.length}/${TRL_POST_MAX}`;
      check();
    });
    form.addEventListener('submit', e => {
      e.preventDefault();
      check();
      if (go.disabled) return;
      // the tailoring is this route's next pane: a running flow's bar moves on, and Close comes back to what was typed
      flowTo(`route:${r.path}#process`);
      showPane(root, 'process', 1);
      root.querySelector('.tld')._run();
    });
    initTld(root.querySelector('.tld'), r.path);
    check();
  }

  /* ---------- Tailoring (the route's "process" pane, after Tailor Now) ----------
     Four steps with their own looping pictures (CSS), each TLD_STEP_MS long (about 30 s in the product); then
     Done! (Continue opens the editor) or, when More options › Result is Failed or Error, Something went wrong.
     Clicking beside the card, the spinner button or Escape while it runs shows "Please wait…". */
  const TLD_STEP_MS = 3000;
  const TLD_STEPS = [
    ['Creating a copy...', 'Your original resume stays untouched. Find it in the Documents tab.'],

    return `${appNavHTML('docs')}

            .map((t, i) => `<button class="md-tab" type="button" role="tab" aria-selected="${!i}"${i ? ' data-md="tab"' : ''}>${t}</button>`).join('')}</div>
            <button class="md-new" type="button" data-action="dash-start" data-method="">Create New</button></div>
          <div class="md-grid">

              ${opt('filePen', 'New Resume', 'data-action="dash-start" data-method=""')}<i></i>${opt('sparkles', 'New Resume with AI', 'data-route="/dashboard/create-ai-resume/"')}<i></i>

  /* ATS checker (Analytics): scores, then each check with what to fix */

        <section class="tl-card is-shadow" data-sec="structure" aria-labelledby="tl-structure">${head('Structure', '60/100', 'Here you can confirm that your resume contains all the essential information every ATS will be looking for.', 'tl-structure')}
          <div class="tl-checks is-two"><div>${chk('ok', 'Profile section', '<p>An ATS can find your profile at the top of the resume.</p>')}
            ${chk('err', 'Dates', `<div class="tl-boxes"><span>${TL_IC.cbOff}Start dates</span><span>${TL_IC.cbOn}End dates</span></div>`, true)}${chk('ok', 'Work experience')}</div>
            <div>${chk('err', 'Skills')}${chk('ok', 'Education section')}${chk('ok', 'Strengths')}</div></div></section>
        <section class="tl-card is-shadow" data-sec="content" aria-labelledby="tl-content">${head('Content', '25/100', 'Some parts of your resume appear to be either shorter or longer than the average calculated from successful resumes in our database.', 'tl-content')}
          <div class="tl-rows">${row('Word count', '450-600 ideal', '1500', '392', 'is-ok', 142)}${row('Paragraphs per section', '5-6 ideal', '7', '6', 'is-ok', 212)}

  /* Where the person comes from (the dock's From): Sign up (a new user, Flow 1's goal screen), a landing page (lp),

  const fromOf = f => f.flow === 1 ? 'signup' : f.lp ? 'lp' : f.guest || f.id === 'guest-edit' ? 'guest' : 'app';
  /* From a landing page (a new user, the doc's "New"): the App's run after Sign up. Landing pages collect a CV only
     for URLs that need or make one (the user's rule: none on the others, and none for Log in, the latest-resume links
     or the guest editor). The editor (/edit/) has no landing page: it only opens with a document (the user's rule:
     uploaded, a sample…; /edit/ alone is a 404). With a CV it is uploaded after sign-up (the upload modal; a LinkedIn profile is imported)
     and the run goes on to the setup (Flow 2), or straight to the loading or page when there is none (Flow 3). The
     writers' details may come with it too (data): then their form is skipped and the run is Flow 3. */
  const LP_UPM = S.route('Upload modal · Uploading resume...', '/dashboard/upload-resume/', 'progress');

  // not the resume-building URLs (New resume, a template, Create Resume with AI): someone there has no resume yet, and

    '/jobs/job/1234/tailor/', '/dashboard/rewrite-resume/', ATS, '/dashboard/proofreading/', TR, '/dashboard/recruiter-feedback/', '/dashboard/career-coach/', JM,
    '/dashboard/create-ai-cover-from-job/', '/dashboard/create-interview/', '/ai/resignation/', '/career-map/'];
  function lpVariant(base, cv, data) {
    const list = x => [].concat(typeof x === 'function' ? x() : x || []), li = base.id === 'linkedin';
    const f = { ...base, id: `lp-${base.id}-${cv ? 'cv' : 'nocv'}${data ? '-data' : ''}`, lp: true, cv, data, redo: undefined,
      title: `${base.title.replace(/(, | · )(returning user|no CV yet)$/, '')} from a landing page${cv ? (li ? ', with a profile' : ', with a CV') : LP_CV.includes(base.path) ? ', no CV' : ''}${data ? ' and the ' + base.given.toLowerCase() : ''}` };
    if (cv && li) Object.assign(f, { flow: 3, prep: undefined, ...upmRun('/dashboard/linkedin-import/', 'Importing') });
    // with its own loading (rewriting, matching, writing) the CV is uploaded inside it: no upload modal of its own (the user's rule)
    else if (cv && (data || !base.prep)) Object.assign(f, base.flow === 4 ? { flow: 3, ...upmRun('/dashboard/upload-resume/') } : { flow: 3, prep: undefined, process: list(base.process).length ? list(base.process) : [S.process(base)] });
    // still a setup to fill (Flow 2): the CV given is uploaded first, as every feature's CV step comes before its data
    else if (cv) f.prep = [LP_UPM, ...list(base.prep)];
    // the data skips the form, not a CV the feature needs (Career Map's answers: the CV step stays)
    else if (data) Object.assign(f, { flow: base.dataPrep ? 2 : 3, prep: base.dataPrep });
    const what = cv ? (li ? 'LinkedIn profile' : data ? 'CV and ' + base.given.toLowerCase() : 'CV attached') : data ? base.given.toLowerCase() : LP_CV.includes(base.path) ? 'no CV' : 'from a landing page';
    const note = `Flow ${f.flow}: the visitor came from a landing page${cv ? (li ? ' with their LinkedIn profile' : ' with a CV (jana-cv.pdf)') : LP_CV.includes(base.path) ? ' without a CV' : ''}${data ? ` and the ${base.given.toLowerCase()}` : ''}, so after sign-up ${cv ? `it is ${li ? 'imported' : 'uploaded'} and ` : ''}${f.flow === 3 ? 'the run goes straight on' : f.flow === 4 ? 'the page opens' : cv ? 'then the setup' : 'the run goes on as in the app'}.`;
    f.entry = [S.auth('Sign up · ' + what, 'signup', note), ...list(base.entry)];

  }
  // Tailor resume (and to a job) runs either way in the code; in the app it is offered with a CV only (the user's rule:
  // the app never goes through resume creation), so its no-CV run is a copy kept for the landing pages and redo
  ['tailor-resume', 'jobs-tailor'].forEach(id => { const f = FEATURES.find(x => x.id === id); f.cv = true; FEATURES.push({ ...f, id: id + '-new', title: f.title + ' · no CV yet', cv: false }); });
  FEATURES.push(...[...new Set(FEATURES.map(f => f.path))].filter(p => !LP_NONE.includes(p)).flatMap(path => {
    const app = FEATURES.filter(f => f.path === path && fromOf(f) === 'app'), here = FEATURES.filter(f => f.path === path && f.lp);
    if (!app.length || path === TR) return [];  // Translate's landing pages always give the language: written above

    // Tailor, like Translate, is one landing-page flow: a landing page that takes the CV takes the job too (the user's

    const both = cv => cv && ['/dashboard/tailor-resume/', '/jobs/job/1234/tailor/'].includes(path);
    return [false, true].filter(cv => !cv || LP_CV.includes(path)).flatMap(cv => (both(cv) ? [true] : [false, ...(pick(cv).given ? [true] : [])]).map(data => [cv, data]))
      .filter(([cv, data]) => !here.some(f => f.cv === cv && !!f.data === data)).map(([cv, data]) => lpVariant(pick(cv), cv, data));

  // creation). The resume checks (ATS, Recruiter feedback, Career coach, Proofreading, Translate) aren't even shown

  // runs are not offered from the app; they stay as the landing-page runs' base and as a failed upload's redo
  const APP_CV_ONLY = ['analyse-resume-new', 'proofreading-new', 'recruiter-feedback-new', 'career-coach-new', 'translate-app-new',
    'tailor-resume-new', 'jobs-tailor-new', 'rewrite-resume-new', 'jobs-matcher-new', 'edit-new'];

  /* A feature's run through its flow's stages */
  function buildFlow(f) {
    // process and state may depend on the CV (functions); when they give nothing, the shared ones stand in
    const T = FLOW_T[f.flow - 1], has = st => T.stages.includes(st), list = x => [].concat(typeof x === 'function' ? x() : x || []), or = (a, b) => a.length ? a : b;
    const at = (stage, steps) => list(steps).map(s => ({ ...s, stage }));
    return { n: f.flow, title: f.title, f, steps: [
      ...at('entry', f.entry),
      ...(has('intent') ? at('intent', S.screen('Goal screen', 'intent')) : []),
      ...(has('prep') ? at('prep', f.prep) : []),
      ...(has('process') && f.process !== false ? at('process', or(list(f.process), [S.process(f)])) : []),
      ...(has('state') && f.process !== false ? at('state', [...or(list(f.state), [S.state(f)]), ...(f.guest ? [S.wire('Sign-up wall', '/register/', 'wall')] : [])]) : []),
      ...at('dest', f.dest)
