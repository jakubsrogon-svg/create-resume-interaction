<meta charset="utf-8">
<title>Resume Start Flow</title>
<style>
@font-face { font-family: "Graphik Web"; src: url("__GRAPHIK_400__") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Graphik Web"; src: url("__GRAPHIK_500__") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: "Henk-Work"; src: url("__HENK_400__") format("woff"); font-weight: 400; font-style: normal; font-display: swap; }

/* Layout: one centered 950px content column; creation cards are a 400px stack inside it.
   Single light theme on purpose — it mirrors the Kickresume product surface. */
:root {
  color-scheme: light;
  /* Kickresume design-system tokens */
  --kr-primary: #ff5e59;
  --kr-primary-hover: #ff736e;
  --kr-primary-active: #cd2927;
  --kr-primary-light: #f8aca7;
  --kr-primary-tint: #fff4f3;
  --kr-blue: #514eea;
  --kr-blue-tint: #f3f2fd;
  --kr-blue-dark: #081430;
  --kr-grey-100: #3f3f3f;
  --kr-grey-80: #8c8c8c;
  --kr-grey-60: #e9e9e9;
  --kr-grey-40: #f2f2f2;
  --kr-grey-20: #fafafa;
  --kr-white: #fff;
  --kr-background: #f4f7f8;
  --kr-mint: #1da36e;
  --kr-mint-tint: #edf8f4;
  --kr-beige: #fbefda;
  --kr-yellow: #ffc107;
  --kr-premium-gradient: linear-gradient(315deg, #a066ff 0%, #666cff 100%);
  --kr-grad-hover: linear-gradient(315deg, #b07dff 0%, #7a80ff 100%);
  --kr-grad-press: linear-gradient(315deg, #8f4fee 0%, #5359e6 100%);
  --kr-grad-disabled: #b9b6f5;
  --kr-green-apple: #48ad43;  /* resume template accent (extended palette) */

  --kr-shadow-dropdown: 1px 2px 10px 0 rgba(0, 0, 0, 0.1);
  --kr-shadow-modal: 1px 2px 20px 0 rgba(0, 0, 0, 0.1);
  --kr-shadow-cv: 0 8px 20px 0 rgba(140, 140, 140, 0.18);
  --kr-focus-ring: 0 0 0 3px rgba(63, 63, 63, 0.35);

  --font-sans: "Graphik Web", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Henk-Work", Georgia, "Times New Roman", serif;

  --content-w: 950px;
  --card-w: 500px;
  --radius: 6px;
  --radius-btn: 10px;
  --radius-card: 16px;
  --ease: cubic-bezier(.4, 0, .2, 1);

  /* Motion scale: three durations, three curves. Close to the system's
     "short and subtle, 0.25s ease-in-out, no bounce" guidance. */
  --dur-fast: 160ms;   /* feedback, exits, fades */
  --dur-base: 260ms;   /* most enters */
  --dur-slow: 380ms;   /* spatial moves, height changes */
  --ease-standard: cubic-bezier(.2, 0, 0, 1);  /* enters, moves */
  --ease-exit: cubic-bezier(.4, 0, 1, 1);      /* leaving */
  --ease-inout: cubic-bezier(.4, 0, .2, 1);    /* size changes */

  /* Height-aware spacing for the onboarding screens.
     --vh is 1% of the usable height (the window, or the phone screen in mobile view; set from JS).
     Short screens tighten every gap so the default state of each step fits without scrolling.
     Content is top-aligned so the headline stays put between steps; the gap under the navbar
     scales with height (12px on small laptops, 160px max on big displays). */
  --vh: 1vh;
  --sp-topbar: clamp(10px, calc(var(--vh) * 2.2), 20px);  /* 20 + the 24px logo + 20: Figma's 64px bar */
  --sp-page-top: clamp(12px, calc((var(--vh) * 100 - 600px) * .25), 160px);  /* top-aligned: grows with height, stops at 160px */
  --sp-page-bottom: clamp(16px, calc(var(--vh) * 4), 48px);
  --sp-head-gap: clamp(6px, calc(var(--vh) * 1.8), 16px);
  --sp-section: clamp(16px, calc(var(--vh) * 4.5), 40px);
  --sp-link: clamp(8px, calc(var(--vh) * 4.5), 40px);
  --h1: clamp(30px, calc(var(--vh) * 4 + 12px), 48px);
  --list-gap: clamp(6px, calc(var(--vh) * 1.4), 8px);
  --card-pad: clamp(10px, calc(var(--vh) * 2), 16px);
  --tile: clamp(40px, calc(var(--vh) * 6.4), 48px);
  --form-gap: clamp(10px, calc(var(--vh) * 2), 16px);
  --field-h: clamp(40px, calc(var(--vh) * 5.6), 48px);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; overflow-anchor: none; }
/* Always keep the scrollbar's space, so the page doesn't jump sideways whenever a screen change
   makes it start or stop scrolling (in browsers that show a scrollbar) */
html { scrollbar-gutter: stable; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 24px;
  letter-spacing: 0.06px;
  color: var(--kr-grey-100);
  background-color: var(--kr-white);
  background-image: linear-gradient(180deg, var(--kr-background) 0%, var(--kr-background) 50%, var(--kr-white) 100%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Device wrapper (desktop = full page, mobile = phone frame) ---------- */
.device { container-type: inline-size; padding-inline: 16px; overflow-anchor: none; }
.statusbar { display: none; }
body.is-mobile { background-image: none; background-color: var(--kr-grey-40); }
body.is-mobile .stage { padding-block: 24px; display: grid; justify-items: center; }
body.is-mobile .device {
  width: 390px; max-width: 100%; height: min(844px, calc(100vh - 48px)); min-height: 560px;
  overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none;
  border: 10px solid var(--kr-blue-dark); border-radius: 48px; box-shadow: var(--kr-shadow-modal);
  background-color: var(--kr-white);
  background-image: linear-gradient(180deg, var(--kr-background) 0%, var(--kr-background) 50%, var(--kr-white) 100%);
  background-attachment: local;
}
body.is-mobile .device::-webkit-scrollbar { display: none; }
body.is-mobile .statusbar {
  display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 5;
  height: 44px; margin-inline: -16px; padding: 4px 28px 0; background: var(--kr-background);
  font-size: 15px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums;
}
.statusbar .notch { width: 104px; height: 28px; border-radius: 999px; background: var(--kr-blue-dark); }
.statusbar .sys { display: flex; gap: 6px; align-items: center; }
.statusbar .bars { display: flex; gap: 2px; align-items: flex-end; height: 11px; }
.statusbar .bars i { width: 3px; background: var(--kr-grey-100); border-radius: 1px; }
.statusbar .batt { width: 24px; height: 11px; border: 1.5px solid var(--kr-grey-100); border-radius: 3px; padding: 1px; }
.statusbar .batt i { display: block; height: 100%; width: 75%; background: var(--kr-grey-100); border-radius: 1px; }
/* On a real phone the frame would not fit, so mobile view just fills the screen */
@media (max-width: 480px) {
  body.is-mobile .stage { padding-block: 0; }
  body.is-mobile .device { width: 100%; height: auto; min-height: 100vh; min-height: 100dvh; overflow: visible; border: 0; border-radius: 0; box-shadow: none; }
  body.is-mobile .statusbar { display: none; }
}

/* ---------- Top bar ---------- */
.topbar { position: relative; display: flex; align-items: center; padding-block: var(--sp-topbar); }
/* × in the top right corner of the full-screen modal screens (route screens' setup steps; see syncTopX), where the
   template page has its own: 32px from the edge, centred on the logo, out of the bar's flow so nothing moves */
.top-x { position: absolute; top: 50%; right: 16px; display: grid; place-items: center; width: 40px; height: 40px; margin-top: -20px; padding: 0; border: 0; border-radius: 10px; background: none; color: var(--kr-grey-100); cursor: pointer; transition: background .2s; }
.top-x[hidden] { display: none; }
.top-x:hover { background: rgba(0, 0, 0, .04); }
.top-x svg { display: block; width: 24px; height: 24px; }
.top-x:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
@media (min-width: 481px) { body:not(.is-mobile) .top-x { right: -36px; } }  /* the stage keeps 52px for the rail, the device 16px */
.logo { display: inline-flex; border: 0; background: none; padding: 0; cursor: pointer; border-radius: var(--radius); }
.logo svg { width: 140px; height: auto; display: block; }
.topbar { padding-inline: 9px; }  /* + the device's 16px: the logo 25px from the edge, as in Figma */
.topbar .logo svg { width: 152px; }
.logo:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
/* a headline or a view that takes the focus when it opens (landFocus) isn't a control: no ring */
:is(h1, h2, section, div)[tabindex="-1"]:focus { outline: none; }

/* ---------- Page ---------- */
.page { --anchor-cut: 0px; width: 100%; max-width: var(--content-w); margin-inline: auto; padding-block: calc(var(--sp-page-top) - var(--anchor-cut)) var(--sp-page-bottom); transition: padding-top var(--dur-slow) var(--ease-inout); }
.page { position: relative; }
.page-head { position: relative; text-align: center; display: grid; gap: var(--sp-head-gap); }
.page-head h1 {
  font-family: var(--font-display); font-weight: 400; font-size: var(--h1); line-height: 1.17;
  letter-spacing: 0; margin: 0; text-wrap: balance;  /* Figma's Heading/H1: 48/56, no tracking */
}
.page-head p { margin: 0; text-wrap: balance; }

.screen[hidden] { display: none !important; }

/* ---------- Intent screen ---------- */
/* Goal cards from Figma (Kickresume 3.0 › Intent screen [new], 61797:3677): four 244px cards in a 1048px row,
   wider than the 950px column of the other onboarding screens; two columns below ~1100px, rows on phones. */
.intent-grid { --gw: min(1048px, 100cqw); width: var(--gw); margin: var(--sp-section) calc((100% - var(--gw)) / 2) 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
/* List layout of the first screen: same 500px card stack as the method screen */
.intent-grid.is-list { grid-template-columns: minmax(0, 1fr); gap: var(--list-gap); width: 100%; max-width: var(--card-w); margin: var(--sp-section) auto 0; }
.irow {
  width: 100%; display: flex; align-items: center; gap: 16px; padding: var(--card-pad) 16px; text-align: left; cursor: pointer;
  background: var(--kr-white); border: 1px solid var(--kr-grey-60); border-radius: var(--radius-card);
  transition: box-shadow var(--dur-base) var(--ease-standard), background 60ms linear;
}
.irow:hover { box-shadow: var(--kr-shadow-dropdown); }
.irow:active { background: var(--kr-grey-20); }
.irow:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.tone-build { background: var(--kr-primary-tint); color: var(--kr-primary); }
.tone-tailor { background: var(--kr-blue-tint); color: var(--kr-blue); }
.tone-ats { background: var(--kr-mint-tint); color: var(--kr-mint); }
.tone-jobs { background: var(--kr-beige); color: #b7791f; }
.intent {
  position: relative; display: flex; flex-direction: column; gap: 16px; text-align: left;
  background: var(--kr-white); border: 1px solid var(--kr-grey-60); border-radius: var(--radius-card);
  padding: 16px; cursor: pointer;
  transition: box-shadow .3s, border-color .25s ease-in-out;
}
.intent:hover { box-shadow: var(--kr-shadow-dropdown); }
.intent:active { border-color: var(--kr-grey-80); background: var(--kr-grey-20); transition-duration: 60ms; }
.intent:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.intent-text { display: grid; gap: 4px; padding-inline: 4px; }
.intent-title { font-size: 18px; line-height: 24px; font-weight: 500; }
.intent-desc { font-size: 14px; line-height: 20px; }
.text-link {
  display: inline-block; margin-top: var(--sp-link); background: none; border: 0; padding: 4px 2px; cursor: pointer;
  color: var(--kr-grey-80); text-decoration: underline; text-underline-offset: 3px; font-size: 16px;
  border-radius: var(--radius); transition: color .2s;
}
#screen-intent { --sp-head-gap: clamp(6px, calc(var(--vh) * 1.2), 8px); --sp-section: clamp(16px, calc(var(--vh) * 3.6), 32px); --sp-link: clamp(4px, calc(var(--vh) * 3.2), 28px); }
.text-link:hover { color: var(--kr-grey-100); }
.text-link:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.center { text-align: center; }

/* Resume lines drawn in the pictures of variant C and the dashboard (sized in cqw there) */
.ln { height: 1.8cqw; border-radius: 1cqw; background: var(--kr-grey-60); flex: none; }
.ln.dk { background: #cfcfcf; }
.ln.w90 { width: 90%; } .ln.w80 { width: 80%; } .ln.w70 { width: 70%; } .ln.w60 { width: 60%; } .ln.w50 { width: 50%; } .ln.w40 { width: 40%; } .ln.w30 { width: 30%; }

/* Goal card pictures (.ga-*): each shows the outcome its card promises, on a 156px stage in a 210px box.
   Still at rest; on hover or keyboard focus one or two pieces ease into place and back (500ms, the design's curve). */
.ga { --ga-ease: cubic-bezier(.22, .8, .28, 1); --ga-dur: .5s; position: relative; height: 210px; border-radius: 12px; overflow: hidden; display: grid; place-items: center; }
.ga.t-build { background: var(--kr-primary-tint); --ga-tint: rgba(255, 94, 89, .08); }
.ga.t-tailor { background: var(--kr-blue-tint); --ga-tint: rgba(81, 78, 234, .06); }
.ga.t-ats { background: var(--kr-mint-tint); --ga-tint: rgba(29, 163, 110, .08); }
.ga.t-jobs { background: var(--kr-beige); --ga-tint: rgba(255, 193, 7, .12); }
/* Hover: the picture's background deepens with a tint of its colour */
.ga::before { content: ""; position: absolute; inset: 0; background: var(--ga-tint); opacity: 0; transition: opacity var(--ga-dur) var(--ga-ease); }
.intent:is(:hover, :focus-visible) .ga::before { opacity: 1; }
.ga-stage { position: relative; width: 156px; height: 156px; }
.ga-stage.is-center { display: grid; place-items: center; }
.ga-ln { display: block; height: 4px; border-radius: 2px; background: var(--kr-grey-60); flex: none; }
.ga-ln.dk { background: rgba(140, 140, 140, .4); }
.ga-row { display: flex; align-items: center; gap: 8px; }
.ga-col { display: grid; gap: 4px; flex: 1; min-width: 0; }
.ga-paper { position: absolute; top: 0; display: flex; flex-direction: column; gap: 6.4px; width: 120px; height: 156px; padding: 12px; background: var(--kr-white); border-radius: 3px; box-shadow: 0 8px 20px rgba(140, 140, 140, .18); }
.ga-paper > .ga-row:first-child { margin-bottom: 2px; }
.ga-paper .sec { margin-top: 4px; }
.ga-av { width: 20px; height: 20px; border-radius: 50%; background: var(--kr-grey-60); flex: none; }
.ga-float { background: var(--kr-white); border-radius: 6px; box-shadow: 0 2px 4px rgba(0, 0, 0, .08); }
.ga-tiny { font-size: 9px; line-height: 12px; font-weight: 500; letter-spacing: .06px; white-space: nowrap; }
.ga-pill { display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: 999px; }
.ga-pill svg.i { width: 9px; height: 9px; stroke-width: 3; }
.ga-sq { width: 20px; height: 20px; border-radius: 4px; flex: none; }
/* Build: an old file behind, the resume AI is writing in front. Hover: the AI line grows, the badge lifts */
.t-build .ga-paper { left: 26px; }
.t-build .ga-paper.old { left: 0; top: 16px; width: 96px; height: 124px; padding: 10px; gap: 6px; opacity: .6; }
.ga-ln.ai { width: 20px; background: rgba(151, 149, 242, .5); transition: width var(--ga-dur) var(--ga-ease); }
.ga-badge { position: absolute; left: 126px; top: 112px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--kr-white); box-shadow: var(--kr-shadow-dropdown); color: #9795f2; transition: transform var(--ga-dur) var(--ga-ease); }
.ga-badge svg.i { width: 14px; height: 14px; }
.intent:is(:hover, :focus-visible) .ga-ln.ai { width: 74px; }
.intent:is(:hover, :focus-visible) .ga-badge { transform: translateY(-4px) rotate(-12deg); }
/* Tailor. Hover: the job ad slides onto the resume and its keywords light up */
.t-tailor .ga-paper { left: 0; }
.ga-ln.kw { transition: background-color var(--ga-dur) var(--ga-ease); }
.ga-ad { position: absolute; right: 0; bottom: 0; width: 92px; display: grid; gap: 5px; padding: 9px; transition: transform var(--ga-dur) var(--ga-ease); }
.ga-ad .ga-sq { width: 16px; height: 16px; background: var(--kr-blue-tint); }
.ga-pill.match { justify-self: start; background: var(--kr-blue-tint); color: #9795f2; }
.intent:is(:hover, :focus-visible) .ga-ad { transform: translate(-6px, -6px); }
.intent:is(:hover, :focus-visible) .ga-ln.kw { background-color: rgba(151, 149, 242, .5); }
/* ATS check. Hover: the flagged issue gets fixed and the score ring fills further */
.ga-report { width: 156px; height: 156px; display: grid; align-content: space-between; padding: 14px; border-radius: 8px; box-shadow: 0 8px 20px rgba(140, 140, 140, .18); }
.ga-score { position: relative; width: 38px; height: 38px; flex: none; display: grid; place-items: center; }
.ga-score svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ga-score b { grid-area: 1 / 1; font-size: 12px; line-height: 1; font-weight: 600; transition: opacity calc(var(--ga-dur) * .6) var(--ga-ease); }
.ga-score .after { opacity: 0; }
.ga-arc { stroke: rgba(29, 163, 110, .5); stroke-dasharray: 100; stroke-dashoffset: 28; transition: stroke-dashoffset var(--ga-dur) var(--ga-ease); }
.ga-hr { display: block; height: 1px; background: var(--kr-grey-40); }
.ga-chk { display: grid; gap: 8px; }
.ga-mark { position: relative; width: 14px; height: 14px; border-radius: 50%; display: grid; place-items: center; flex: none; background: rgba(29, 163, 110, .08); color: #1da36e; transition: background-color var(--ga-dur) var(--ga-ease), color var(--ga-dur) var(--ga-ease); }
.ga-mark svg.i { grid-area: 1 / 1; width: 8px; height: 8px; stroke-width: 3.5; transition: opacity calc(var(--ga-dur) * .6) var(--ga-ease), transform var(--ga-dur) var(--ga-ease); }
.ga-mark.flag { background: rgba(255, 193, 7, .2); color: #ffc107; }
.ga-mark.flag .fixed { opacity: 0; transform: scale(.4); }
.intent:is(:hover, :focus-visible) .ga-arc { stroke-dashoffset: 6; }
.intent:is(:hover, :focus-visible) .ga-score .before { opacity: 0; }
.intent:is(:hover, :focus-visible) .ga-score .after { opacity: 1; }
.intent:is(:hover, :focus-visible) .ga-mark.flag { background: rgba(29, 163, 110, .08); color: #1da36e; }
.intent:is(:hover, :focus-visible) .ga-mark.flag .issue { opacity: 0; transform: scale(.4); }
.intent:is(:hover, :focus-visible) .ga-mark.flag .fixed { opacity: 1; transform: none; }
/* Find jobs. Hover: the best match rises out of the list */
.ga-jobs { width: 156px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.ga-job { min-width: 0; display: flex; align-items: center; gap: 8px; padding: 12px 9px; border-radius: 6px; box-shadow: 0 1px 1px rgba(0, 0, 0, .04); transition: transform var(--ga-dur) var(--ga-ease), box-shadow var(--ga-dur) var(--ga-ease); }
.ga-pill.fit { background: rgba(29, 163, 110, .08); color: #1da36e; }
.intent:is(:hover, :focus-visible) .ga-job:first-child { transform: translateY(-3px) scale(1.04); box-shadow: var(--kr-shadow-dropdown); }

/* ---------- Creation screen ---------- */
.methods { width: 100%; max-width: var(--card-w); margin: var(--sp-section) auto 0; }
.method-list { display: grid; gap: var(--list-gap); }

.mcard {
  background: var(--kr-white); border: 1px solid transparent; border-radius: var(--radius-card);
  transition: box-shadow var(--dur-base) var(--ease-standard), transform var(--dur-slow) var(--ease-standard);
  contain: layout style;
}
.mcard:hover, .mcard.is-open { box-shadow: var(--kr-shadow-dropdown); }
.mhead {
  width: 100%; display: flex; align-items: center; gap: 16px; padding: calc(var(--card-pad) - 1px) 15px; text-align: left;
  background: none; border: 0; border-radius: var(--radius-card); cursor: pointer;
}
.mhead:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.mhead { transition: background 60ms linear; }
button.mhead:active { background: var(--kr-grey-20); }
.mhead[aria-disabled="true"] { cursor: default; }
.mhead[aria-disabled="true"]:active { background: none; }
div.mhead { cursor: default; }
.mtile { width: var(--tile); height: var(--tile); border-radius: 10px; display: grid; place-items: center; flex: none; }
.mtile svg.i { width: 24px; height: 24px; }
.tone-linkedin { background: var(--kr-blue-tint); color: var(--kr-blue); }
.tone-ai { background: var(--kr-blue-tint); color: #8a5cff; }
.tone-upload { background: var(--kr-primary-tint); color: var(--kr-primary); }
.tone-paste { background: var(--kr-mint-tint); color: var(--kr-mint); }
.mtext { flex: 1; min-width: 0; display: grid; gap: 4px; }
.mtitle { font-size: 18px; line-height: 24px; font-weight: 500; }
.msub { font-size: 14px; line-height: 20px; letter-spacing: 0.16px; color: var(--kr-grey-80); }
.chev { display: inline-flex; color: var(--kr-grey-100); transition: transform var(--dur-slow) var(--ease-inout), opacity var(--dur-fast) var(--ease-standard); }
.mcard.is-open .chev { transform: rotate(90deg); }

/* Expanding body — shared by both variants. Collapsing = fade first, then fold;
   expanding = unfold, then the content settles in. All CSS transitions, so a
   second click mid-way reverses from wherever it is. */
.acc { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-slow) var(--ease-inout); }
.mcard.is-open .acc { grid-template-rows: 1fr; }
.acc-inner { overflow: hidden; min-height: 0; }
.acc-inner > .mbody { opacity: 0; transform: translateY(-6px); transition: opacity var(--dur-fast) var(--ease-exit), transform var(--dur-fast) var(--ease-exit); }
.mcard.is-open .acc-inner > .mbody { opacity: 1; transform: none; transition: opacity var(--dur-base) var(--ease-standard) 80ms, transform var(--dur-slow) var(--ease-standard) 40ms; }

/* Variant A: while one option is open, the others step back so the open one stands out.
   They come forward again on hover or keyboard focus, so they still read as clickable. */
.method-list > .mcard { transition: box-shadow var(--dur-base) var(--ease-standard), opacity var(--dur-base) var(--ease-standard), background var(--dur-base) var(--ease-standard), border-color var(--dur-base) var(--ease-standard); }
.method-list:has(> .mcard.is-open) > .mcard:not(.is-open) { opacity: .7; background: var(--kr-grey-20); }
.method-list:has(> .mcard.is-open) > .mcard:not(.is-open):hover,
.method-list:has(> .mcard.is-open) > .mcard:not(.is-open):focus-within { opacity: 1; background: var(--kr-white); }

/* Variant A on short windows: while one option is open, the others shrink to a single line.
   Every part of the shrink (padding, icon tile, title size, subtitle) moves with the fold, same
   duration and easing, so opening or switching is one motion with nothing snapping. */
@media (max-height: 1000px) {
  .method-list > .mcard .mhead { transition: padding var(--dur-slow) var(--ease-inout), background 60ms linear; }
  .method-list > .mcard .mtile { transition: width var(--dur-slow) var(--ease-inout), height var(--dur-slow) var(--ease-inout), border-radius var(--dur-slow) var(--ease-inout); }
  .method-list > .mcard .mtile svg.i { transition: width var(--dur-slow) var(--ease-inout), height var(--dur-slow) var(--ease-inout); }
  .method-list > .mcard .mtitle { transition: font-size var(--dur-slow) var(--ease-inout); }
  .method-list > .mcard .msub { max-height: 20px; overflow: hidden; transition: max-height var(--dur-slow) var(--ease-inout), margin var(--dur-slow) var(--ease-inout), opacity var(--dur-base) var(--ease-standard); }
  .method-list:has(> .mcard.is-open) > .mcard:not(.is-open) .mhead { padding-block: 8px; }
  .method-list:has(> .mcard.is-open) > .mcard:not(.is-open) .mtile { width: 32px; height: 32px; border-radius: 8px; }
  .method-list:has(> .mcard.is-open) > .mcard:not(.is-open) .mtile svg.i { width: 18px; height: 18px; }
  .method-list:has(> .mcard.is-open) > .mcard:not(.is-open) .mtitle { font-size: 16px; }
  .method-list:has(> .mcard.is-open) > .mcard:not(.is-open) .msub { max-height: 0; margin-top: -4px; opacity: 0; }
}

/* Variant B: once a method is open, the "Skip personalization" link folds away */
#screen-create > .center { display: grid; grid-template-rows: 1fr; padding-top: calc(var(--sp-link) - 4px); transition: grid-template-rows var(--dur-slow) var(--ease-inout), padding var(--dur-slow) var(--ease-inout), opacity var(--dur-base) var(--ease-standard) 120ms; }
#screen-create > .center > .text-link { min-height: 0; overflow: hidden; justify-self: center; margin-top: 0; }
#screen-create:has(.b-wrap.has-focus) > .center > .text-link { padding-block: 0; }
#screen-create:has(.b-wrap.has-focus) > .center { grid-template-rows: 0fr; padding-top: 0; opacity: 0; transition: grid-template-rows var(--dur-slow) var(--ease-inout), padding var(--dur-slow) var(--ease-inout), opacity var(--dur-fast) var(--ease-exit); }

/* Variant B — the picked card becomes the screen: the others fold away, Back slides in */
.b-list { display: grid; }
.slot { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--dur-slow) var(--ease-inout), opacity var(--dur-base) var(--ease-standard) 60ms; }
.slot-inner { min-height: 0; overflow: hidden; margin: -10px -14px 0; padding: 10px 14px var(--list-gap); transition: padding var(--dur-slow) var(--ease-inout) 40ms, margin var(--dur-slow) var(--ease-inout) 40ms; }
/* each slot's bottom padding is the gap to the next card (and room for its shadow); the last one has no
   next card, so cancel it, and what follows the list sits where it does in A */
.b-list > .slot:last-child { margin-bottom: calc(var(--list-gap) * -1); }
/* a folded slot keeps no padding, so the gap under Back is the same for every method */
.b-wrap.has-focus .slot:not(.is-focus) > .slot-inner { padding-block: 0; margin-top: 0; }
.slot > .slot-inner > .mcard { transition: box-shadow var(--dur-base) var(--ease-standard), transform var(--dur-base) var(--ease-standard) 40ms; }
.b-wrap.has-focus .slot:not(.is-focus) { grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows var(--dur-slow) var(--ease-inout) 40ms, opacity var(--dur-fast) var(--ease-exit); }
.b-wrap.has-focus .slot:not(.is-focus) > .slot-inner > .mcard { transform: scale(.97); transition: box-shadow var(--dur-base), transform var(--dur-fast) var(--ease-exit); }
.b-wrap .mcard.is-open .chev { transform: translateX(8px); opacity: 0; }
.b-back { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-slow) var(--ease-inout); }

/* Variant B — reassurance row under the open card. Three short answers to the doubts
   that stop people right before they act: how long, is my data safe, can I fix it later.
   No paragraphs, no FAQs: reading should never feel like part of the task. */
/* The tray sits inside the open card's slot, so it travels with the card as one object and
   only ever unfolds downward from under it. Its tuck-under margin eases together with the
   fold, in both directions, so the list's height changes continuously (no snap on Back). */
.b-aside {
  position: relative; z-index: 0; display: grid; grid-template-rows: 0fr; margin-top: 0;
  transition: grid-template-rows var(--dur-slow) var(--ease-inout), margin-top var(--dur-slow) var(--ease-inout);
}
.b-wrap.has-focus .b-aside { grid-template-rows: 1fr; margin-top: -16px; transition: grid-template-rows var(--dur-slow) var(--ease-inout) 60ms, margin-top var(--dur-slow) var(--ease-inout) 60ms; }
.slot.is-focus .mcard { position: relative; z-index: 1; }
.b-aside-inner { min-height: 0; overflow: hidden; padding-inline: 12px; }
.assure {
  list-style: none; margin: 0; padding: 26px 16px 11px; display: flex; justify-content: center; align-items: center; gap: 18px;
  background: var(--kr-grey-20); border: 1px solid var(--kr-grey-60); border-top: 0; border-radius: 0 0 14px 14px;
  transform: translateY(-12px); opacity: 0; transition: transform var(--dur-fast) var(--ease-exit), opacity var(--dur-fast) var(--ease-exit);
}
.b-wrap.has-focus .assure { transform: none; opacity: 1; transition: transform var(--dur-slow) var(--ease-standard) 140ms, opacity var(--dur-base) var(--ease-standard) 140ms; }
.assure li {
  display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; line-height: 18px; letter-spacing: 0.16px; color: var(--kr-grey-100);
  opacity: 0; transition: opacity var(--dur-fast) var(--ease-exit);
}
.assure li + li { padding-left: 18px; border-left: 1px solid var(--kr-grey-60); }
.assure li svg.i { width: 16px; height: 16px; flex: none; color: var(--kr-mint); }
.b-wrap.has-focus .assure li { opacity: 1; transition: opacity var(--dur-base) var(--ease-standard); }
.b-wrap.has-focus .assure li:nth-child(1) { transition-delay: 220ms; }
.b-wrap.has-focus .assure li:nth-child(2) { transition-delay: 270ms; }
.b-wrap.has-focus .assure li:nth-child(3) { transition-delay: 320ms; }
/* short desktop windows: a slimmer tray */
@media (max-height: 700px) {
  .assure { padding: 22px 16px 8px; }
}
.assure .t-short { display: none; }
/* phones: the same row, icon over a one-line label; columns share the spare width
   equally so each divider sits midway between two labels */
@container (max-width: 560px) {
  .assure { align-items: stretch; gap: 0; padding: 30px 4px 14px; }
  .assure li { flex: 1 1 auto; flex-direction: column; justify-content: flex-start; gap: 6px; padding-inline: 6px; }
  .assure li + li { padding-left: 6px; }
  .assure li svg.i { width: 18px; height: 18px; }
  .assure .t-long { display: none; }
  .assure .t-short { display: inline; }
}
/* the narrowest phones: a touch smaller so the labels still fit on one line */
@container (max-width: 330px) {
  .assure { padding-inline: 0; }
  .assure li { font-size: 12px; letter-spacing: 0; padding-inline: 4px; }
  .assure li + li { padding-left: 4px; }
}
.b-back-inner { min-height: 0; overflow: hidden; margin-inline: -6px; padding-inline: 6px; }
.b-wrap.has-focus .b-back { grid-template-rows: 1fr; }
.b-back .back { opacity: 0; transform: translateY(-6px); transition: opacity var(--dur-fast) var(--ease-exit), transform var(--dur-fast) var(--ease-exit), color .2s; }
.b-wrap.has-focus .b-back .back { opacity: 1; transform: none; transition: opacity var(--dur-base) var(--ease-standard) 140ms, transform var(--dur-slow) var(--ease-standard) 120ms, color .2s; }

.back {
  display: inline-flex; align-items: center; gap: 8px; margin: 4px 0 12px; padding: 6px 8px 6px 4px;
  background: none; border: 0; cursor: pointer; color: var(--kr-grey-80); font-size: 16px; border-radius: var(--radius);
  transition: color .2s;
}
.back:hover { color: var(--kr-grey-100); }
.back:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }

/* ---------- Method bodies ---------- */
.mbody { padding: 4px 16px calc(var(--card-pad) + 4px); display: grid; gap: var(--form-gap); }
.mbody p { margin: 0; font-size: 14px; line-height: 20px; letter-spacing: 0.16px; }
.mform { display: grid; gap: var(--form-gap); }
.fpair { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--form-gap); }  /* AI form: name above job title */
.field { display: grid; gap: 6px; }
.label { font-size: 14px; line-height: 20px; font-weight: 500; }
.input, .textarea {
  width: 100%; min-height: var(--field-h); padding: calc((var(--field-h) - 26px) / 2) 16px; background: var(--kr-white); color: var(--kr-grey-100);
  border: 1px solid var(--kr-grey-60); border-radius: var(--radius-btn); outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.input::placeholder, .textarea::placeholder { color: var(--kr-grey-80); }
.input:hover, .textarea:hover { border-color: var(--kr-grey-80); }
.input:focus, .textarea:focus { border-color: var(--kr-blue); }
.has-error .input, .has-error .textarea { border-color: var(--kr-primary); }
.textarea { resize: vertical; min-height: clamp(84px, calc(var(--vh) * 14), 150px); line-height: 22px; font-size: 14px; }
.input-wrap { position: relative; }
.input-wrap .input { padding-right: 52px; }
/* the field's height follows the window (40-48px), so the button inside stretches between 4px insets and stays centred */
.input-wrap .icon-btn { bottom: 4px; height: auto; }
.icon-btn {
  position: absolute; right: 4px; top: 4px; width: 40px; height: 40px; display: grid; place-items: center;
  border: 0; background: none; border-radius: 8px; cursor: pointer; color: var(--kr-grey-100);
  transition: background .2s;
}
.icon-btn:hover { background: var(--kr-grey-40); }
.icon-btn:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.error { display: none; font-size: 12px; line-height: 16px; letter-spacing: 0.16px; color: var(--kr-primary); }
.has-error .error { display: block; }
.hint-row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; line-height: 16px; letter-spacing: 0.16px; color: var(--kr-grey-80); font-variant-numeric: tabular-nums; }
.inline-link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--kr-blue); font-size: inherit; text-decoration: underline; text-underline-offset: 2px; border-radius: 3px; }
.inline-link:hover { color: var(--kr-grey-100); }
.inline-link:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.actions { display: flex; justify-content: flex-end; align-items: center; gap: 12px; }

/* Buttons (Kickresume: 10px radius, 500 weight, same size in every state) */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 31px; border: 1px solid transparent; border-radius: var(--radius-btn);
  font-size: 16px; line-height: 22px; font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background .2s, box-shadow .3s, color .2s, border-color .2s;
}
.btn:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.btn:disabled { cursor: not-allowed; }
.btn-coral { background: var(--kr-primary); color: var(--kr-white); }
.btn-coral:hover:not(:disabled) { background: var(--kr-primary-hover); }
.btn-coral:active:not(:disabled) { background: var(--kr-primary-active); }
.btn-coral:disabled { background: var(--kr-primary-light); }
.btn-gradient { background: var(--kr-premium-gradient); color: var(--kr-white); }
.btn-gradient:hover:not(:disabled) { background: var(--kr-grad-hover); }
.btn-gradient:active:not(:disabled) { background: var(--kr-grad-press); }
.btn-gradient:disabled { background: var(--kr-grad-disabled); }
.btn-block { width: 100%; }

/* Dropzone (matches the provided upload mock) */
.dropzone {
  display: grid; justify-items: center; gap: 8px; text-align: center; padding: clamp(12px, calc(var(--vh) * 3), 32px) 16px; cursor: pointer;
  border: 2px dashed var(--kr-primary); border-radius: 12px; background: var(--kr-white);
  transition: background var(--dur-fast) var(--ease-standard), border-color var(--dur-fast);
}
.dropzone:hover { background: var(--kr-primary-tint); }
.dropzone:active { background: var(--kr-primary-tint-2, #fbe0de); transition-duration: 60ms; }
.dropzone:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.dropzone.is-over { background: var(--kr-primary-tint); }
.dz-link { color: var(--kr-blue); text-decoration: underline; text-underline-offset: 2px; }
.dropzone .cloud { color: var(--kr-primary); }
.dropzone .cloud svg.i { width: clamp(28px, calc(var(--vh) * 4.4), 40px); height: clamp(28px, calc(var(--vh) * 4.4), 40px); stroke-width: 1.75; }
.dz-title { font-size: 16px; line-height: 24px; }
.dz-meta { font-size: 12px; line-height: 16px; color: var(--kr-grey-80); letter-spacing: 0.16px; }
.file-row {
  display: flex; align-items: center; gap: 12px; padding: 8px 4px 8px 12px; border: 1px solid var(--kr-grey-60);
  border-radius: var(--radius-btn); background: var(--kr-grey-20);
}
.file-row .ftext { flex: 1; min-width: 0; display: grid; }
.file-row .fname { font-size: 14px; line-height: 20px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-row .fsize { font-size: 12px; line-height: 16px; color: var(--kr-grey-80); }
.file-row .icon-btn { position: static; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Progress steps (building screen) */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: clamp(6px, calc(var(--vh) * 1.4), 12px); }
.step { display: flex; align-items: center; gap: 12px; font-size: 15px; line-height: 20px; color: var(--kr-grey-80); transition: color var(--dur-base) var(--ease-standard); }
.step .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 1.5px solid var(--kr-grey-60); color: var(--kr-white); transition: background var(--dur-base), border-color var(--dur-base); }
.step .dot svg.i { width: 12px; height: 12px; stroke-width: 3; opacity: 0; transform: scale(.6); transition: opacity var(--dur-fast), transform var(--dur-base) var(--ease-standard); }
.step.is-active { color: var(--kr-grey-100); }
.step.is-active .dot { border-color: var(--kr-blue); border-top-color: transparent; animation: spin .8s linear infinite; }
.step.is-done { color: var(--kr-grey-100); }
.step.is-done .dot { background: var(--kr-mint); border-color: var(--kr-mint); }
.step.is-done .dot svg.i { opacity: 1; transform: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.btn .spin { width: 18px; height: 18px; animation: spin .8s linear infinite; }

/* ---------- Variant C: a picture on top of each method screen ----------
   Same language as the goal-screen scenes, told as "what you give → what you get".
   Drawn in HTML and sized in cqh (1% of the banner's height), so it scales down
   with the banner on shorter screens instead of getting cropped. */
.c-scene {
  height: 250px; container-type: size;
  /* drawing unit: 0.8% of the picture's height (the drawing takes ~60% of it, with air around), never so
     big that the drawing outgrows the card's width */
  --u: min(.8cqh, .45cqw);
  border-radius: 12px; overflow: hidden; display: grid; place-items: center; background: var(--cs-bg);
}
.c-scene.cs-linkedin { --cs-bg: var(--kr-blue-tint); --cs-tone: var(--kr-blue); }
.c-scene.cs-ai { --cs-bg: #f5f1fe; --cs-tone: #8a5cff; background: linear-gradient(120deg, var(--kr-blue-tint), #f8f0ff); }
.c-scene.cs-upload { --cs-bg: var(--kr-primary-tint); --cs-tone: var(--kr-primary); }
.c-scene.cs-paste { --cs-bg: var(--kr-mint-tint); --cs-tone: var(--kr-mint); }
.cs-row { display: flex; align-items: center; gap: calc(var(--u) * 7); }
.c-scene .ln { height: calc(var(--u) * 3); border-radius: calc(var(--u) * 2); }
.cs-card { flex: none; background: var(--kr-white); border-radius: calc(var(--u) * 3); box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(140, 140, 140, .2); }
.cs-step {
  width: calc(var(--u) * 18); height: calc(var(--u) * 18); border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--kr-white); color: var(--cs-tone); box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 3) rgba(0, 0, 0, .08);
}
.cs-step svg.i { width: calc(var(--u) * 9); height: calc(var(--u) * 9); }
.cs-step.is-ai { background: var(--kr-premium-gradient); color: var(--kr-white); box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 4) rgba(160, 102, 255, .35); }
/* the resume you get */
.cs-paper { width: calc(var(--u) * 58); height: calc(var(--u) * 78); padding: calc(var(--u) * 7) calc(var(--u) * 6); display: flex; flex-direction: column; gap: calc(var(--u) * 3.4); }
.cs-head { display: flex; align-items: center; gap: calc(var(--u) * 3.5); margin-bottom: calc(var(--u) * 1); }
.cs-av { display: block; width: calc(var(--u) * 11); height: calc(var(--u) * 11); border-radius: 50%; background: var(--kr-grey-60); flex: none; }
.cs-stack { display: grid; gap: calc(var(--u) * 2.4); flex: 1; min-width: 0; }
.c-scene .ln.cs-h { width: 38%; background: var(--cs-tone); opacity: .5; margin-top: calc(var(--u) * 1.2); }
.c-scene .ln.is-ai { background: var(--kr-premium-gradient); opacity: .55; }
.cs-paper.is-tpl { padding: 0; flex-direction: row; gap: 0; overflow: hidden; }
.cs-tpl-side { width: 38%; padding: calc(var(--u) * 7) calc(var(--u) * 4); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 3.4); background: color-mix(in srgb, var(--cs-tone) 16%, var(--kr-white)); }
.cs-tpl-side .cs-av { width: calc(var(--u) * 13); height: calc(var(--u) * 13); background: var(--kr-white); margin-bottom: calc(var(--u) * 1); }
.cs-tpl-side .ln { background: var(--kr-white); }
.cs-tpl-main { flex: 1; min-width: 0; padding: calc(var(--u) * 7) calc(var(--u) * 5); display: flex; flex-direction: column; gap: calc(var(--u) * 3.4); }
/* LinkedIn: a profile card */
.cs-profile { width: calc(var(--u) * 72); overflow: hidden; padding-bottom: calc(var(--u) * 7); }
.cs-cover { height: calc(var(--u) * 17); background: color-mix(in srgb, var(--kr-blue) 16%, var(--kr-white)); }
.cs-profile .cs-av { width: calc(var(--u) * 20); height: calc(var(--u) * 20); margin: calc(var(--u) * -10) 0 0 calc(var(--u) * 6); border: calc(var(--u) * 1.4) solid var(--kr-white); background: #d9d8f8; }
.cs-pbody { padding: calc(var(--u) * 3) calc(var(--u) * 6) 0; display: grid; gap: calc(var(--u) * 3); }
.cs-in-row { display: flex; align-items: center; gap: calc(var(--u) * 3); margin-top: calc(var(--u) * 1.4); }
.cs-in { width: calc(var(--u) * 11); height: calc(var(--u) * 11); border-radius: calc(var(--u) * 2.4); flex: none; display: grid; place-items: center; background: var(--kr-blue); color: var(--kr-white); }
.cs-in svg.i { width: calc(var(--u) * 6.5); height: calc(var(--u) * 6.5); }
.cs-in-row .ln { flex: 1; }
/* AI: the two answers */
.cs-fields { width: calc(var(--u) * 68); flex: none; display: grid; gap: calc(var(--u) * 6); }
.cs-field { display: grid; gap: calc(var(--u) * 2.6); }
.cs-input {
  height: calc(var(--u) * 16); padding-inline: calc(var(--u) * 4.5); display: flex; align-items: center; gap: calc(var(--u) * 1.6);
  background: var(--kr-white); border: 1px solid var(--kr-grey-60); border-radius: calc(var(--u) * 3);
}
.cs-input .ln { flex: none; }
.cs-input.is-focus { border-color: var(--cs-tone); box-shadow: 0 0 0 calc(var(--u) * 1.2) rgba(138, 92, 255, .14); }
.cs-caret { width: 1px; height: calc(var(--u) * 7); background: var(--cs-tone); flex: none; }
/* Upload: your old files */
.cs-files { position: relative; width: calc(var(--u) * 72); height: calc(var(--u) * 76); flex: none; }
.cs-file { position: absolute; width: calc(var(--u) * 44); height: calc(var(--u) * 58); padding: calc(var(--u) * 9) calc(var(--u) * 6); display: flex; flex-direction: column; gap: calc(var(--u) * 3.4); }
.cs-file::before {
  content: ""; position: absolute; top: 0; right: 0; width: calc(var(--u) * 11); height: calc(var(--u) * 11); border-bottom-left-radius: calc(var(--u) * 2.4);

/* Once a method is open, its title and subtitle take over the page headline (setHead), so the card
   folds its own header away (icon tile, title, subtitle, chevron) in the same motion as the rest of
   the screen change, and the picture gets that room. Back brings the header back. */
.b-wrap.is-c .slot .mhead {

  transition: max-height var(--dur-slow) var(--ease-inout), padding var(--dur-slow) var(--ease-inout), opacity var(--dur-base) var(--ease-standard) 80ms, visibility 0s, background 60ms linear;
}

.mcard.is-open .cs-row > :nth-child(1) { transition-delay: 160ms; }
.mcard.is-open .cs-row > :nth-child(2) { transition-delay: 230ms; }
.mcard.is-open .cs-row > :nth-child(3) { transition-delay: 300ms; }
/* error and failure messages, with links to another method */
.c-fail, .c-error { display: grid; gap: 4px; padding-top: 2px; font-size: 12px; line-height: 16px; letter-spacing: 0.16px; color: var(--kr-primary); }
.c-fail[hidden], .c-error[hidden] { display: none; }
.c-recover { display: flex; flex-wrap: wrap; gap: 4px 14px; }

  .c-recover .inline-link, .c-error .inline-link { min-height: 44px; display: inline-flex; align-items: center; }
}
/* ---------- 3D look (rail toggle: Flat / 3D) ----------
   A lighter, more modern surface for the goal and method screens in any variant, built from brand tokens:
   a faint dot grid behind the page, frosted cards with a hairline edge that takes the method's colour
   on hover (the open method is a plain white card), gradient icon tiles, glass pills for Back and the
   chevrons, a frosted reassurance tray and a faint glow under the call to action. Markup and motion
   are the variant's own; only the surface changes. Shadows stay inside the space B's fold leaves. */
/* D's backdrop sits behind the whole page and fades in while D's method screen is on: a faint dot
   grid that fades out toward the edges (a builder's canvas), and, where there's room beside the
   list, four resume fragments in the far margins, one per method, drawn like the goal-screen
   illustrations: a resume with a LinkedIn badge, an old PDF, a page being written by AI and a page
   sorted into sections. They're background, not content: still, faded, slightly out of focus and
   muted, so the method cards stay the most prominent thing on the screen. On phones only the grid
   shows, inside the phone screen. */
.d-backdrop { display: none; }

body.is-mobile.look-3d .device { position: relative; }  /* the phone frame holds the backdrop */
body.look-3d .d-backdrop {

  opacity: 0; transition: opacity var(--dur-slow) var(--ease-standard);
}

@starting-style { body.look-3d[data-screen="intent"] .d-backdrop, body.look-3d[data-screen="create"] .d-backdrop { opacity: 0; } }
body.look-3d:not([data-screen="create"]) .d-paper { visibility: hidden; }  /* the margin fragments belong to the method screen */
.d-backdrop::before {
  content: ""; position: absolute; inset: 0;
  background-image: radial-gradient(circle, color-mix(in srgb, var(--kr-blue-dark) 12%, transparent) 1px, transparent 1.6px);
  background-size: 22px 22px; background-position: center top;
  /* covers most of the page and fades out gradually toward the edges */
  -webkit-mask-image: radial-gradient(80% 78% at 50% 45%, black 25%, transparent 100%); mask-image: radial-gradient(80% 78% at 50% 45%, black 25%, transparent 100%);
}
.d-paper {
  position: absolute; width: 132px; padding: 14px 12px; display: flex; flex-direction: column; gap: 7px;
  background: var(--kr-white); border-radius: 8px; box-shadow: var(--kr-shadow-cv);
  rotate: var(--r); scale: .9; opacity: .5; filter: blur(1.2px) saturate(.6);
}
.d-ln { display: block; height: 5px; border-radius: 3px; background: var(--kr-grey-60); flex: none; }
.d-ln.dk { background: color-mix(in srgb, var(--kr-grey-80) 45%, var(--kr-white)); }
.d-ln.hd { width: 36%; height: 6px; margin-top: 4px; background: color-mix(in srgb, var(--c) 50%, var(--kr-white)); }
.d-ln.ai { background: var(--kr-premium-gradient); opacity: .5; }
.d-ln.w45 { width: 45%; } .d-ln.w55 { width: 55%; } .d-ln.w60 { width: 60%; } .d-ln.w70 { width: 70%; } .d-ln.w80 { width: 80%; } .d-ln.w90 { width: 90%; }
.d-row { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.d-av { display: block; width: 22px; height: 22px; border-radius: 50%; background: var(--kr-grey-60); flex: none; }
.d-stack { display: grid; gap: 5px; flex: 1; }
.d-badge {
  position: absolute; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--kr-white);
  box-shadow: 0 6px 14px -6px color-mix(in srgb, var(--kr-blue-dark) 40%, transparent);
}
.d-badge svg.i { width: 16px; height: 16px; }
.d-badge.is-in { right: -12px; top: -12px; background: var(--kr-blue); }
.d-badge.is-ai { right: -14px; bottom: -14px; border-radius: 50%; background: var(--kr-premium-gradient); }
.d-badge.is-ok { left: -12px; bottom: -12px; border-radius: 50%; background: var(--kr-mint); }

  background: linear-gradient(to bottom left, var(--kr-background) 50%, var(--kr-grey-40) 50%);
}

.d-p1 { left: calc(50% - 560px); top: 25%; --r: -7deg; }

/* ---------- Building screen ---------- */

   (Everywhere else motion stays short and overshoot-free.) */

.ed-main { grid-area: main; min-width: 0; padding: 0 24px 140px; }

.premium { border: 1.5px solid transparent; border-radius: var(--radius-card); background: linear-gradient(var(--kr-white), var(--kr-white)) padding-box, var(--kr-premium-gradient) border-box; }

.doc-line { margin: 4px 0 0; font-size: 15px; line-height: 22px; }

.ecard { background: var(--kr-white); border-radius: var(--radius-card); border: 1px solid var(--kr-grey-60); transition: box-shadow var(--dur-base) var(--ease-standard); scroll-margin-top: 76px; }

.ehead { width: 100%; display: flex; align-items: center; gap: 12px; padding: 16px 20px; border: 0; background: none; cursor: pointer; text-align: left; border-radius: var(--radius-card); font-size: 18px; line-height: 24px; font-weight: 500; transition: background 60ms linear; }

.ebody { padding: 4px 20px 20px; display: grid; gap: 16px; }
.ebody > p { margin: 0; font-size: 14px; line-height: 20px; color: var(--kr-grey-80); }
.hint-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 14px; line-height: 20px; }
.hint-list li { display: flex; gap: 10px; align-items: center; }
.hint-list .hd { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.pi { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 20px; align-items: start; }
.photo { display: grid; justify-items: center; gap: 12px; }
.photo-circle { width: 108px; height: 108px; border-radius: 50%; background: var(--kr-grey-20); border: 1px solid var(--kr-grey-60); display: grid; place-items: center; color: var(--kr-grey-100); }

.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; line-height: 20px; cursor: pointer; }

.btn-ol-sm { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 6px 14px; border: 1px solid var(--kr-grey-100); border-radius: var(--radius-btn); background: var(--kr-white); font-size: 14px; line-height: 20px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background var(--dur-fast); }
.btn-ol-sm:hover { background: var(--kr-grey-40); }

.btn-ol-sm svg.i { width: 16px; height: 16px; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fgrid .full { grid-column: 1 / -1; }
.f { display: grid; gap: 4px; min-width: 0; }
.f > label { font-size: 13px; line-height: 18px; color: var(--kr-grey-80); }
.input.sm { min-height: 42px; padding: 9px 12px; font-size: 15px; line-height: 22px; border-radius: 8px; }
.textarea.sm { min-height: 120px; padding: 10px 12px; font-size: 14px; border-radius: 8px; }
.more { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--dur-slow) var(--ease-inout); }
.more.is-hidden { grid-template-rows: 0fr; }
.more-inner { min-height: 0; overflow: hidden; display: grid; gap: 16px; margin-inline: -4px; padding-inline: 4px; }
.more-inner > .fgrid { padding-top: 2px; }
.add-fields { width: 100%; padding: 10px; border: 1px dashed var(--kr-primary); border-radius: 10px; background: var(--kr-white); color: var(--kr-primary); font-size: 15px; line-height: 20px; font-weight: 500; cursor: pointer; transition: background var(--dur-fast); }
.add-fields:hover { background: var(--kr-grey-20); }
.add-fields:focus-visible, .more-toggle:focus-visible, .add-row:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.more-toggle { justify-self: center; border: 0; background: none; color: var(--kr-primary); font-size: 15px; line-height: 20px; font-weight: 500; cursor: pointer; padding: 6px 8px; border-radius: 6px; }
.entry { display: flex; gap: 12px; align-items: flex-start; padding: 12px 6px 12px 14px; border: 1px solid var(--kr-grey-60); border-radius: 10px; }
.entry-text { flex: 1; min-width: 0; display: grid; gap: 2px; }

.add-row { justify-self: start; border: 0; background: none; color: var(--kr-blue); font-size: 14px; line-height: 20px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; padding: 4px 6px; border-radius: 6px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; gap: 4px; align-items: center; padding: 4px 4px 4px 12px; border: 1px solid var(--kr-grey-60); border-radius: 999px; background: var(--kr-grey-20); font-size: 14px; line-height: 20px; }
.chip button { width: 24px; height: 24px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; cursor: pointer; color: var(--kr-grey-80); transition: background var(--dur-fast), color var(--dur-fast); }
.chip button:hover { background: var(--kr-grey-60); color: var(--kr-grey-100); }

.ed-preview {
  grid-area: preview; position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto;
  background: var(--kr-white); border-left: 1px solid var(--kr-grey-60); padding: 16px 24px 120px; display: grid; align-content: start; gap: 20px;
}
.pv-tabs { justify-self: center; display: flex; border: 1px solid var(--kr-grey-60); border-radius: 10px; background: var(--kr-white); }
.pv-tab { display: inline-flex; gap: 6px; align-items: center; padding: 8px 12px; border: 0; border-right: 1px solid var(--kr-grey-60); background: none; font-size: 14px; line-height: 20px; color: var(--kr-grey-100); cursor: pointer; white-space: nowrap; transition: background var(--dur-fast); }
.pv-tab:first-child { border-radius: 10px 0 0 10px; } .pv-tab:last-child { border-right: 0; border-radius: 0 10px 10px 0; }
.pv-tab:hover { box-shadow: inset 0 0 0 1px var(--kr-grey-100); }  /* the design's dark outline */
.pv-tab.is-active, .pv-tab.is-active:hover { color: var(--kr-primary); background: var(--kr-white); box-shadow: inset 0 0 0 1px var(--kr-primary); }
.pv-tab:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.pv-tab svg { flex: none; width: 16px; height: 16px; }
.pv-body[hidden] { display: none; }

/* Resume Tailoring (the right pane's second tab, after tailoring): from Figma 56166:15938 and the frames beside it */
.trt { justify-self: center; display: grid; gap: 16px; align-content: start; width: 100%; max-width: 540px; margin-top: 33px; color: var(--kr-grey-100); }
.trt[hidden] { display: none; }
:where(.trt) button { font: inherit; color: inherit; }  /* low specificity: each button's own size and colour win */
.trt-head { display: flex; align-items: center; gap: 16px; }
.trt-ic { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, rgba(83, 69, 255, .2), rgba(156, 62, 255, .2)); }
.trt-ic svg { width: 20px; height: 20px; }
.trt-head > div { display: grid; justify-items: start; }
.trt-head b { font-size: 16px; line-height: 24px; font-weight: 500; }
.trt-job { padding: 0; border: 0; background: none; font-size: 14px; line-height: 20px; text-align: left; text-decoration: underline; text-underline-position: from-font; cursor: pointer; }
.trt-job:hover { color: var(--kr-grey-80); }
.trt-strat { display: grid; gap: 8px; padding: 15px; border: 1px solid var(--kr-grey-60); border-radius: 10px; background: var(--kr-white); font-size: 14px; line-height: 20px; }
.trt-strat b { font-weight: 500; letter-spacing: 1.12px; text-transform: uppercase; color: var(--kr-grey-80); }
.trt-strat p { margin: 0; }
.trt-acc { display: grid; border: 1px solid var(--kr-grey-60); border-radius: 10px; background: var(--kr-white); overflow: hidden; }
.trt-acc-h { display: flex; align-items: center; gap: 17px; width: 100%; padding: 7px; border: 0; border-radius: 9px; background: none; text-align: left; cursor: pointer; }
.trt-acc-h > svg { flex: none; width: 20px; height: 20px; }
.trt-acc-h b { flex: 1; font-size: 16px; line-height: 24px; font-weight: 500; }
.trt-count { font-size: 14px; line-height: 20px; font-weight: 500; }
.trt-count.is-blue { color: #514eea; }
.trt-count.is-green { color: #48ad43; }
.trt-chev { flex: none; display: grid; width: 16px; height: 16px; transition: transform var(--dur-base) var(--ease-standard); }
.trt-chev svg { width: 16px; height: 16px; }
.trt-acc-h .trt-chev { margin-left: -1px; }
[aria-expanded="true"] > .trt-chev { transform: rotate(180deg); }
.trt-acc-h:focus-visible, .trt-ch-h:focus-visible, .trt-job:focus-visible, .trt-chip:focus-visible, .trt-tag:focus-visible, .trt-kw button:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.trt-acc-b[hidden], .trt-ch-b[hidden] { display: none; }
.trt-acc-b { padding-top: 1px; }
.trt-changes { display: grid; gap: 8px; margin: 0; padding: 0 16px 16px; list-style: none; }
.trt-ch { display: grid; gap: 4px; padding: 7px; border: 1px solid var(--kr-grey-40); border-radius: 10px; transition: border-color var(--dur-fast); }
.trt-ch:hover { border-color: var(--kr-grey-80); }
.trt-ch.is-hit { padding: 6px; border: 2px solid #ffc107; }  /* the picked keyword's changes */
.trt-ch-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; width: 100%; padding: 0; border: 0; background: none; font-size: 14px; line-height: 20px; font-weight: 500; text-align: left; cursor: pointer; }
.trt-ch-b { display: grid; gap: 4px; }
.trt-ch-b p { margin: 0; font-size: 14px; line-height: 20px; }
.trt-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.trt-tag { padding: 2px 4px; border: 0; border-radius: 4px; background: var(--kr-grey-40); font-size: 12px; line-height: 18px; color: var(--kr-grey-80); cursor: pointer; }
.trt-tag.is-hit { background: #ffc107; color: var(--kr-grey-100); }
.trt-kw { position: relative; display: grid; justify-items: start; gap: 16px; padding: 0 16px 16px; }
.trt-chips { display: flex; flex-wrap: wrap; gap: 10px; }
.trt-chip, .trt-kw-hide { padding: 7px 8px; border: 0; border-radius: 99px; background: var(--kr-grey-40); font-size: 14px; line-height: 20px; cursor: pointer; }
.trt-kw-hide { font-weight: 500; }
.trt-chip[aria-pressed="true"] { padding: 5px 6px; border: 2px solid #ffc107; }
.trt-kw-more { display: none; }
/* folded: the first row or two, fading under View All Keywords (58275:3563) */
.trt-kw.is-compact { height: 78px; padding-bottom: 0; overflow: hidden; }
.trt-kw.is-compact .trt-kw-hide { display: none; }
.trt-kw.is-compact .trt-kw-more {
  position: absolute; inset: 14px 0 0; display: flex; justify-content: center; align-items: flex-end; padding: 8px 0 16px;
  background: linear-gradient(rgba(255, 255, 255, 0), rgba(255, 255, 255, .8)); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  -webkit-mask-image: linear-gradient(transparent, #000 24px); mask-image: linear-gradient(transparent, #000 24px);
}

.trt-kw-more svg { width: 16px; height: 16px; }
.trt-tips { display: grid; gap: 16px; padding: 0 16px 16px; }
.trt-tip { display: grid; gap: 4px; padding: 8px; font-size: 14px; line-height: 20px; }
.trt-tip b { font-weight: 500; }
.trt-tip p { margin: 0; }
.pv-body { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 16px; }
.pv-tools { display: grid; gap: 12px; align-content: start; padding-top: 24px; }
.pv-paper-wrap { container-type: inline-size; min-width: 0; }

/* The resume page — sized in container units so it scales with the pane */
.rv {
  position: relative; width: 100%; aspect-ratio: 1 / 1.414; overflow: clip; background: var(--kr-white); box-shadow: var(--kr-shadow-cv);
  padding: 7cqw 6cqw; font-family: var(--font-sans); font-size: 1.62cqw; line-height: 1.5; color: var(--kr-grey-100); display: grid; align-content: start; gap: 1.2cqw;
}
.rv::before {
  content: ""; position: absolute; right: -10cqw; top: -10cqw; width: 42cqw; aspect-ratio: 1; border-radius: 50%; pointer-events: none;
  background: repeating-radial-gradient(circle, transparent 0 2.6cqw, rgba(0, 0, 0, .045) 2.6cqw calc(2.6cqw + 1px));
}

.rv-sec { position: relative; margin-inline: -1.6cqw; padding: 1cqw 1.6cqw; border-radius: .6cqw; outline: 2px solid transparent; outline-offset: -1px; cursor: pointer; transition: outline-color var(--dur-fast) var(--ease-standard); }

  background: var(--kr-primary); color: var(--kr-white); font-size: max(10px, 1.5cqw); line-height: 1.5; padding: .2cqw 1cqw; border-radius: 0 .6cqw 0 .6cqw;
}

.rv-name { font-family: var(--font-display); font-weight: 400; color: var(--rv-accent, var(--kr-green-apple)); font-size: 5.4cqw; line-height: 1.12; letter-spacing: -.06cqw; margin: 0; }
.rv-role { margin: .2cqw 0 1.4cqw; font-size: 2cqw; color: var(--kr-grey-80); }
.rv-details { display: grid; gap: .25cqw; }

.rv h3 { font-family: var(--font-display); font-weight: 400; font-size: 2.5cqw; line-height: 1.3; margin: 0 0 1cqw; display: flex; gap: 1.2cqw; align-items: baseline; }
.rv h3 span { color: var(--rv-accent, var(--kr-green-apple)); font-size: 2.1cqw; }

.rv-ul { display: block; width: 9cqw; height: .25cqw; background: var(--rv-accent, var(--kr-green-apple)); margin: -.6cqw 0 1.2cqw; }
.rv p { margin: 0; }
.rv-entry { display: grid; gap: .2cqw; }

.rv-skills li:last-child::after { display: none; }
.rv-hobbies { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.2cqw 2cqw; text-align: center; }
.rv-hobbies div { display: grid; justify-items: center; gap: .8cqw; font-size: 1.5cqw; }
.rv-hobbies svg.i { width: 4.6cqw; height: 4.6cqw; stroke-width: 1.4; }

/* ---------- Dashboard ---------- */
.dash { margin-inline: -16px; min-height: 100vh; background: var(--kr-background); display: grid; grid-template-columns: 232px minmax(0, 1fr); }

.btn-up { min-height: 42px; padding: 8px 18px; font-size: 15px; }
