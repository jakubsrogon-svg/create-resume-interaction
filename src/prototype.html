<title>Resume Start Flow</title>
<style>
@font-face { font-family: "Graphik Web"; src: url("__GRAPHIK_400__") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Graphik Web"; src: url("__GRAPHIK_500__") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: "Henk-Work"; src: url("__HENK_400__") format("woff"); font-weight: 400; font-style: normal; font-display: swap; }

/* Layout: one centered 950px content column; creation cards are a 400px stack inside it.
   Single light theme on purpose — it mirrors the Kickresume product surface. */
:root {
  color-scheme: light;
  /* Kickresume design-system tokens */
  --kr-primary: #ff5e59;
  --kr-primary-hover: #ff736e;
  --kr-primary-active: #cd2927;
  --kr-primary-light: #f8aca7;
  --kr-primary-tint: #fff4f3;
  --kr-blue: #514eea;
  --kr-blue-tint: #f3f2fd;
  --kr-blue-dark: #081430;
  --kr-grey-100: #3f3f3f;
  --kr-grey-80: #8c8c8c;
  --kr-grey-60: #e9e9e9;
  --kr-grey-40: #f2f2f2;
  --kr-grey-20: #fafafa;
  --kr-white: #fff;
  --kr-background: #f4f7f8;
  --kr-mint: #1da36e;
  --kr-mint-tint: #edf8f4;
  --kr-beige: #fbefda;
  --kr-yellow: #ffc107;
  --kr-premium-gradient: linear-gradient(315deg, #a066ff 0%, #666cff 100%);
  --kr-grad-hover: linear-gradient(315deg, #b07dff 0%, #7a80ff 100%);
  --kr-grad-press: linear-gradient(315deg, #8f4fee 0%, #5359e6 100%);
  --kr-grad-disabled: #b9b6f5;
  --kr-green-apple: #48ad43;  /* resume template accent (extended palette) */

  --kr-shadow-dropdown: 1px 2px 10px 0 rgba(0, 0, 0, 0.1);
  --kr-shadow-modal: 1px 2px 20px 0 rgba(0, 0, 0, 0.1);
  --kr-shadow-cv: 0 8px 20px 0 rgba(140, 140, 140, 0.18);
  --kr-focus-ring: 0 0 0 3px rgba(63, 63, 63, 0.35);

  --font-sans: "Graphik Web", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Henk-Work", Georgia, "Times New Roman", serif;

  --content-w: 950px;
  --card-w: 400px;
  --radius: 6px;
  --radius-btn: 10px;
  --radius-card: 16px;
  --ease: cubic-bezier(.4, 0, .2, 1);

  /* Motion scale: three durations, three curves. Close to the system's
     "short and subtle, 0.25s ease-in-out, no bounce" guidance. */
  --dur-fast: 160ms;   /* feedback, exits, fades */
  --dur-base: 260ms;   /* most enters */
  --dur-slow: 380ms;   /* spatial moves, height changes */
  --ease-standard: cubic-bezier(.2, 0, 0, 1);  /* enters, moves */
  --ease-exit: cubic-bezier(.4, 0, 1, 1);      /* leaving */
  --ease-inout: cubic-bezier(.4, 0, .2, 1);    /* size changes */
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; overflow-anchor: none; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 24px;
  letter-spacing: 0.06px;
  color: var(--kr-grey-100);
  background-color: var(--kr-white);
  background-image: linear-gradient(180deg, var(--kr-background) 0%, var(--kr-background) 50%, var(--kr-white) 100%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Device wrapper (desktop = full page, mobile = phone frame) ---------- */
.device { container-type: inline-size; padding-inline: 16px; overflow-anchor: none; }
.statusbar { display: none; }
body.is-mobile { background-image: none; background-color: var(--kr-grey-40); }
body.is-mobile .stage { padding-block: 24px; display: grid; justify-items: center; }
body.is-mobile .device {
  width: 390px; max-width: 100%; height: min(844px, calc(100vh - 48px)); min-height: 560px;
  overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none;
  border: 10px solid var(--kr-blue-dark); border-radius: 48px; box-shadow: var(--kr-shadow-modal);
  background-color: var(--kr-white);
  background-image: linear-gradient(180deg, var(--kr-background) 0%, var(--kr-background) 50%, var(--kr-white) 100%);
  background-attachment: local;
}
body.is-mobile .device::-webkit-scrollbar { display: none; }
body.is-mobile .statusbar {
  display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 5;
  height: 44px; margin-inline: -16px; padding: 4px 28px 0; background: var(--kr-background);
  font-size: 15px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums;
}
.statusbar .notch { width: 104px; height: 28px; border-radius: 999px; background: var(--kr-blue-dark); }
.statusbar .sys { display: flex; gap: 6px; align-items: center; }
.statusbar .bars { display: flex; gap: 2px; align-items: flex-end; height: 11px; }
.statusbar .bars i { width: 3px; background: var(--kr-grey-100); border-radius: 1px; }
.statusbar .batt { width: 24px; height: 11px; border: 1.5px solid var(--kr-grey-100); border-radius: 3px; padding: 1px; }
.statusbar .batt i { display: block; height: 100%; width: 75%; background: var(--kr-grey-100); border-radius: 1px; }
/* On a real phone the frame would not fit, so mobile view just fills the screen */
@media (max-width: 480px) {
  body.is-mobile .stage { padding-block: 0; }
  body.is-mobile .device { width: auto; height: auto; min-height: 0; overflow: visible; border: 0; border-radius: 0; box-shadow: none; }
  body.is-mobile .statusbar { display: none; }
}

/* ---------- Top bar ---------- */
.topbar { display: flex; align-items: center; padding-block: 24px; max-width: 1400px; margin-inline: auto; }
.logo { display: inline-flex; border: 0; background: none; padding: 0; cursor: pointer; border-radius: var(--radius); }
.logo svg { width: 140px; height: auto; display: block; }
.logo:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }

/* ---------- Page ---------- */
.page { width: 100%; max-width: var(--content-w); margin-inline: auto; padding-block: 56px 96px; }
.page { position: relative; }
.page-head { position: relative; text-align: center; display: grid; gap: 12px; }
.page-head h1 {
  font-family: var(--font-display); font-weight: 400; font-size: 48px; line-height: 56px;
  letter-spacing: -1.4px; margin: 0; text-wrap: balance;
}
.page-head p { margin: 0; text-wrap: balance; }

.screen[hidden] { display: none !important; }

/* ---------- Intent screen ---------- */
.intent-grid { margin-top: 56px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.intent {
  position: relative; display: flex; flex-direction: column; gap: 16px; text-align: left;
  background: var(--kr-white); border: 1px solid var(--kr-grey-60); border-radius: var(--radius-card);
  padding: 12px 12px 20px; cursor: pointer;
  transition: box-shadow .25s ease-in-out, border-color .25s ease-in-out;
}
.intent:hover { box-shadow: var(--kr-shadow-dropdown); }
.intent:active:not(:disabled) { border-color: var(--kr-grey-80); background: var(--kr-grey-20); transition-duration: 60ms; }
.intent:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.intent:disabled { cursor: not-allowed; }
.intent:disabled:hover { box-shadow: none; }
.intent:disabled .scene, .intent:disabled .intent-text { opacity: .5; }
.intent-text { display: grid; gap: 4px; padding-inline: 4px; }
.intent-title { font-size: 18px; line-height: 24px; font-weight: 500; }
.intent-desc { font-size: 14px; line-height: 20px; letter-spacing: 0.16px; }
.badge-soon {
  position: absolute; top: 20px; right: 20px; z-index: 1;
  font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.16px;
  background: var(--kr-white); border: 1px solid var(--kr-grey-60); color: var(--kr-grey-100);
  padding: 3px 8px; border-radius: 999px;
}
.text-link {
  display: inline-block; margin-top: 40px; background: none; border: 0; padding: 4px 2px; cursor: pointer;
  color: var(--kr-grey-80); text-decoration: underline; text-underline-offset: 3px; font-size: 16px;
  border-radius: var(--radius); transition: color .2s;
}
.text-link:hover { color: var(--kr-grey-100); }
.text-link:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.center { text-align: center; }

/* Mini scenes inside intent cards.
   Everything is sized in cqw (1% of the scene's width), so each scene keeps
   its proportions at any card size, from the 96px phone tile to the desktop card. */
.scene { position: relative; aspect-ratio: 1 / 1; max-width: 100%; border-radius: 12px; overflow: hidden; display: grid; place-items: center; container-type: inline-size; }
.scene.t-coral { background: var(--kr-primary-tint); }
.scene.t-violet { background: var(--kr-blue-tint); }
.scene.t-mint { background: var(--kr-mint-tint); }
.scene.t-beige { background: var(--kr-beige); }
.paper {
  width: 50cqw; height: 66cqw; background: var(--kr-white); border-radius: 1.6cqw; box-shadow: 0 2.4cqw 6cqw rgba(140, 140, 140, .18);
  padding: 6cqw 6cqw; display: flex; flex-direction: column; gap: 3.2cqw;
}
.paper .row { display: flex; align-items: center; gap: 4cqw; margin-bottom: 1.2cqw; }
.paper .av { width: 10cqw; height: 10cqw; border-radius: 50%; background: var(--kr-grey-60); flex: none; }
.ln { height: 1.8cqw; border-radius: 1cqw; background: var(--kr-grey-60); flex: none; }
.ln.dk { background: #cfcfcf; }
.ln.w90 { width: 90%; } .ln.w80 { width: 80%; } .ln.w70 { width: 70%; } .ln.w60 { width: 60%; } .ln.w50 { width: 50%; } .ln.w40 { width: 40%; } .ln.w30 { width: 30%; }
.stack { display: grid; gap: 2cqw; flex: 1; min-width: 0; }
.ai-chip {
  position: absolute; right: 19cqw; bottom: 14cqw; width: 15cqw; height: 15cqw; border-radius: 50%;
  background: var(--kr-premium-gradient); color: var(--kr-white); display: grid; place-items: center;
  box-shadow: 0 .8cqw 2.4cqw rgba(160, 102, 255, .3), 0 .8cqw 6cqw rgba(102, 108, 255, .3);
}
.ai-chip svg.i { width: 7cqw; height: 7cqw; }
.scene-tailor .paper { transform: translateX(-12cqw); }
.job-card {
  position: absolute; right: 8cqw; bottom: 16cqw; width: 44cqw; background: var(--kr-white); border-radius: 2.4cqw;
  box-shadow: 0 .8cqw 4cqw rgba(0, 0, 0, .1); padding: 4.5cqw; display: grid; gap: 2.6cqw;
}
.pill { justify-self: start; font-size: 4.2cqw; line-height: 1.4; font-weight: 500; padding: .6cqw 2.4cqw; border-radius: 999px; background: var(--kr-blue-tint); color: var(--kr-blue); white-space: nowrap; }
.jobs { width: 74cqw; display: grid; gap: 3.5cqw; }
.job-row { background: var(--kr-white); border-radius: 2.6cqw; padding: 3.5cqw; display: flex; gap: 3.5cqw; align-items: center; box-shadow: 0 .4cqw 1cqw rgba(0, 0, 0, .04); }
.job-logo { width: 9cqw; height: 9cqw; border-radius: 2cqw; flex: none; }
.board { width: 78cqw; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3cqw; }
.col { display: grid; gap: 2.6cqw; align-content: start; }
.col > .ln { margin-bottom: .6cqw; }
.mini { background: var(--kr-white); border-radius: 1.8cqw; padding: 2.6cqw; display: grid; gap: 1.8cqw; box-shadow: 0 .4cqw 1cqw rgba(0, 0, 0, .04); }
.mini .ln { height: 1.4cqw; }

/* ---------- Creation screen ---------- */
.methods { width: 100%; max-width: var(--card-w); margin: 48px auto 0; }
.method-list { display: grid; gap: 12px; }

.mcard {
  background: var(--kr-white); border: 1px solid var(--kr-grey-60); border-radius: var(--radius-card);
  transition: box-shadow var(--dur-base) var(--ease-standard), transform var(--dur-slow) var(--ease-standard);
  contain: layout style;
}
.mcard:hover, .mcard.is-open { box-shadow: var(--kr-shadow-dropdown); }
.mhead {
  width: 100%; display: flex; align-items: center; gap: 16px; padding: 16px; text-align: left;
  background: none; border: 0; border-radius: var(--radius-card); cursor: pointer;
}
.mhead:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.mhead { transition: background 60ms linear; }
button.mhead:active { background: var(--kr-grey-20); }
.mhead[aria-disabled="true"] { cursor: default; }
.mhead[aria-disabled="true"]:active { background: none; }
div.mhead { cursor: default; }
.mtile { width: 52px; height: 52px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.mtile svg.i { width: 24px; height: 24px; }
.tone-linkedin { background: var(--kr-blue-tint); color: var(--kr-blue); }
.tone-ai { background: var(--kr-blue-tint); color: #8a5cff; }
.tone-upload { background: var(--kr-primary-tint); color: var(--kr-primary); }
.tone-paste { background: var(--kr-mint-tint); color: var(--kr-mint); }
.mtext { flex: 1; min-width: 0; display: grid; gap: 2px; }
.mtitle { font-size: 18px; line-height: 24px; font-weight: 500; }
.msub { font-size: 14px; line-height: 20px; letter-spacing: 0.16px; color: var(--kr-grey-80); }
.chev { display: inline-flex; color: var(--kr-grey-100); transition: transform var(--dur-slow) var(--ease-inout), opacity var(--dur-fast) var(--ease-standard); }
.mcard.is-open .chev { transform: rotate(90deg); }

/* Expanding body — shared by both variants. Collapsing = fade first, then fold;
   expanding = unfold, then the content settles in. All CSS transitions, so a
   second click mid-way reverses from wherever it is. */
.acc { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-slow) var(--ease-inout); }
.mcard.is-open .acc { grid-template-rows: 1fr; }
.acc-inner { overflow: hidden; min-height: 0; }
.acc-inner > .mbody { opacity: 0; transform: translateY(-6px); transition: opacity var(--dur-fast) var(--ease-exit), transform var(--dur-fast) var(--ease-exit); }
.mcard.is-open .acc-inner > .mbody { opacity: 1; transform: none; transition: opacity var(--dur-base) var(--ease-standard) 80ms, transform var(--dur-slow) var(--ease-standard) 40ms; }

/* Variant B — the picked card becomes the screen: the others fold away, Back slides in */
.b-list { display: grid; }
.slot { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--dur-slow) var(--ease-inout), opacity var(--dur-base) var(--ease-standard) 60ms; }
.slot-inner { min-height: 0; overflow: hidden; margin: -10px -14px 0; padding: 10px 14px 12px; }
.slot > .slot-inner > .mcard { transition: box-shadow var(--dur-base) var(--ease-standard), transform var(--dur-base) var(--ease-standard) 40ms; }
.b-wrap.has-focus .slot:not(.is-focus) { grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows var(--dur-slow) var(--ease-inout) 40ms, opacity var(--dur-fast) var(--ease-exit); }
.b-wrap.has-focus .slot:not(.is-focus) > .slot-inner > .mcard { transform: scale(.97); transition: box-shadow var(--dur-base), transform var(--dur-fast) var(--ease-exit); }
.b-wrap .mcard.is-open .chev { transform: translateX(8px); opacity: 0; }
.b-back { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-slow) var(--ease-inout); }
.b-back-inner { min-height: 0; overflow: hidden; margin-inline: -6px; padding-inline: 6px; }
.b-wrap.has-focus .b-back { grid-template-rows: 1fr; }
.b-back .back { opacity: 0; transform: translateX(12px); transition: opacity var(--dur-fast) var(--ease-exit), transform var(--dur-fast) var(--ease-exit), color .2s; }
.b-wrap.has-focus .b-back .back { opacity: 1; transform: none; transition: opacity var(--dur-base) var(--ease-standard) 140ms, transform var(--dur-slow) var(--ease-standard) 120ms, color .2s; }

.back {
  display: inline-flex; align-items: center; gap: 8px; margin: 4px 0 12px; padding: 6px 8px 6px 4px;
  background: none; border: 0; cursor: pointer; color: var(--kr-grey-80); font-size: 16px; border-radius: var(--radius);
  transition: color .2s;
}
.back:hover { color: var(--kr-grey-100); }
.back:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }

/* ---------- Method bodies ---------- */
.mbody { padding: 4px 16px 20px; display: grid; gap: 16px; }
.mbody p { margin: 0; font-size: 14px; line-height: 20px; letter-spacing: 0.16px; }
.mform { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; }
.label { font-size: 14px; line-height: 20px; font-weight: 500; }
.input, .textarea {
  width: 100%; min-height: 48px; padding: 12px 16px; background: var(--kr-white); color: var(--kr-grey-100);
  border: 1px solid var(--kr-grey-60); border-radius: var(--radius-btn); outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.input::placeholder, .textarea::placeholder { color: var(--kr-grey-80); }
.input:hover, .textarea:hover { border-color: var(--kr-grey-80); }
.input:focus, .textarea:focus { border-color: var(--kr-blue); }
.has-error .input, .has-error .textarea { border-color: var(--kr-primary); }
.textarea { resize: vertical; min-height: 168px; line-height: 22px; font-size: 14px; }
.input-wrap { position: relative; }
.input-wrap .input { padding-right: 52px; }
.icon-btn {
  position: absolute; right: 4px; top: 4px; width: 40px; height: 40px; display: grid; place-items: center;
  border: 0; background: none; border-radius: 8px; cursor: pointer; color: var(--kr-grey-100);
  transition: background .2s;
}
.icon-btn:hover { background: var(--kr-grey-40); }
.icon-btn:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.error { display: none; font-size: 12px; line-height: 16px; letter-spacing: 0.16px; color: var(--kr-primary); }
.has-error .error { display: block; }
.hint-row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; line-height: 16px; letter-spacing: 0.16px; color: var(--kr-grey-80); font-variant-numeric: tabular-nums; }
.inline-link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--kr-blue); font-size: inherit; text-decoration: underline; text-underline-offset: 2px; border-radius: 3px; }
.inline-link:hover { color: var(--kr-grey-100); }
.inline-link:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.actions { display: flex; justify-content: flex-end; align-items: center; gap: 12px; }

/* Buttons (Kickresume: 10px radius, 500 weight, same size in every state) */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 31px; border: 1px solid transparent; border-radius: var(--radius-btn);
  font-size: 16px; line-height: 22px; font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background .2s, box-shadow .3s, color .2s, border-color .2s;
}
.btn:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.btn:disabled { cursor: not-allowed; }
.btn-coral { background: var(--kr-primary); color: var(--kr-white); }
.btn-coral:hover:not(:disabled) { background: var(--kr-primary-hover); }
.btn-coral:active:not(:disabled) { background: var(--kr-primary-active); }
.btn-coral:disabled { background: var(--kr-primary-light); }
.btn-gradient { background: var(--kr-premium-gradient); color: var(--kr-white); }
.btn-gradient:hover:not(:disabled) { background: var(--kr-grad-hover); }
.btn-gradient:active:not(:disabled) { background: var(--kr-grad-press); }
.btn-gradient:disabled { background: var(--kr-grad-disabled); }
.btn-white { background: var(--kr-white); color: var(--kr-grey-100); border-color: var(--kr-grey-60); }
.btn-white:hover { background: var(--kr-grey-40); }
.btn-white:active { background: var(--kr-grey-60); }
.btn-block { width: 100%; }

/* Dropzone (matches the provided upload mock) */
.dropzone {
  display: grid; justify-items: center; gap: 8px; text-align: center; padding: 32px 16px; cursor: pointer;
  border: 2px dashed var(--kr-primary); border-radius: 12px; background: var(--kr-white);
  transition: background var(--dur-fast) var(--ease-standard), border-color var(--dur-fast);
}
.dropzone:hover { background: var(--kr-primary-tint); }
.dropzone:active { background: var(--kr-primary-tint-2, #fbe0de); transition-duration: 60ms; }
.dropzone:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.dropzone.is-over { background: var(--kr-primary-tint); }
.dz-link { color: var(--kr-blue); text-decoration: underline; text-underline-offset: 2px; }
.dropzone .cloud { color: var(--kr-primary); }
.dropzone .cloud svg.i { width: 40px; height: 40px; stroke-width: 1.75; }
.dz-title { font-size: 16px; line-height: 24px; }
.dz-meta { font-size: 12px; line-height: 16px; color: var(--kr-grey-80); letter-spacing: 0.16px; }
.file-row {
  display: flex; align-items: center; gap: 12px; padding: 8px 4px 8px 12px; border: 1px solid var(--kr-grey-60);
  border-radius: var(--radius-btn); background: var(--kr-grey-20);
}
.file-row .ftext { flex: 1; min-width: 0; display: grid; }
.file-row .fname { font-size: 14px; line-height: 20px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-row .fsize { font-size: 12px; line-height: 16px; color: var(--kr-grey-80); }
.file-row .icon-btn { position: static; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Progress steps (building screen) */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.step { display: flex; align-items: center; gap: 12px; font-size: 15px; line-height: 20px; color: var(--kr-grey-80); transition: color var(--dur-base) var(--ease-standard); }
.step .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 1.5px solid var(--kr-grey-60); color: var(--kr-white); transition: background var(--dur-base), border-color var(--dur-base); }
.step .dot svg.i { width: 12px; height: 12px; stroke-width: 3; opacity: 0; transform: scale(.6); transition: opacity var(--dur-fast), transform var(--dur-base) var(--ease-standard); }
.step.is-active { color: var(--kr-grey-100); }
.step.is-active .dot { border-color: var(--kr-blue); border-top-color: transparent; animation: spin .8s linear infinite; }
.step.is-done { color: var(--kr-grey-100); }
.step.is-done .dot { background: var(--kr-mint); border-color: var(--kr-mint); }
.step.is-done .dot svg.i { opacity: 1; transform: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.btn .spin { width: 18px; height: 18px; animation: spin .8s linear infinite; }

/* ---------- Building screen ---------- */
.ld-stage { margin: 40px auto 0; width: 100%; max-width: var(--card-w); display: grid; gap: 28px; justify-items: center; }
.ld-paper {
  position: relative; width: 220px; max-width: 100%; aspect-ratio: 1 / 1.414; background: var(--kr-white); border-radius: 4px;
  box-shadow: var(--kr-shadow-cv); padding: 22px 20px; display: grid; align-content: start; gap: 16px; overflow: hidden;
}
.ld-paper::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .75) 50%, transparent 70%);
  transform: translateX(-100%); animation: shimmer 1.5s var(--ease-inout) infinite;
}
.ld-paper.is-done::after { animation: none; opacity: 0; }
@keyframes shimmer { to { transform: translateX(100%); } }
.ld-group { display: grid; gap: 6px; }
.ld-paper .ln { height: 5px; border-radius: 3px; background: var(--kr-grey-40); transition: background var(--dur-slow) var(--ease-standard); }
.ld-paper .ln.h { height: 10px; width: 64%; margin-bottom: 4px; }
.ld-paper .ln.t { height: 6px; width: 32%; margin-bottom: 2px; }
.ld-group.is-filled .ln { background: #d6d6d6; }
.ld-group.is-filled .ln.h, .ld-group.is-filled .ln.t { background: var(--kr-green-apple); }
.ld-icons { display: flex; gap: 12px; }
.ld-icons i { width: 16px; height: 16px; border-radius: 50%; background: var(--kr-grey-40); transition: background var(--dur-slow) var(--ease-standard), transform var(--dur-slow) var(--ease-standard); }
.ld-group.is-filled .ld-icons i { background: #cfe9cd; }
.ld-steps { width: 100%; background: var(--kr-white); border: 1px solid var(--kr-grey-60); border-radius: var(--radius-card); padding: 20px; }

/* ---------- Editor ---------- */
.editor {
  margin-inline: -16px; min-height: 100vh; background: var(--kr-background);
  display: grid; grid-template-columns: 232px minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "side main preview";
}
body.is-mobile .editor { min-height: 100%; }
.ed-side {
  grid-area: side; position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - 16px);
  margin: 8px 0 8px 8px; background: var(--kr-white); border-radius: var(--radius-card); padding: 20px 12px 16px;
  display: flex; flex-direction: column; gap: 24px; overflow-y: auto; scrollbar-width: none;
}
.ed-side .logo { align-self: flex-start; margin-left: 6px; }
.acct { display: flex; gap: 10px; align-items: center; padding: 6px; }
.av { width: 36px; height: 36px; border-radius: 8px; background: var(--kr-blue-dark); color: var(--kr-white); display: grid; place-items: center; font-weight: 500; flex: none; }
.acct-text { display: grid; min-width: 0; }
.acct-text b { font-size: 13px; line-height: 16px; font-weight: 500; }
.acct-text span { font-size: 12px; line-height: 16px; color: var(--kr-grey-80); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav-item {
  width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 10px; border: 0; background: none; border-radius: 10px;
  font-size: 15px; line-height: 20px; font-weight: 500; color: var(--kr-grey-100); cursor: pointer; text-align: left;
  transition: background var(--dur-fast) var(--ease-standard);
}
.nav-item:hover { background: var(--kr-grey-40); }
.nav-item:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.nav-doc { background: var(--kr-grey-40); border-radius: 12px; padding: 4px; display: grid; gap: 2px; margin-block: 6px; }
.nav-doc .nav-item:hover { background: var(--kr-grey-60); }
.nav-doc .doc-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-sub { padding: 8px 12px 8px 14px; font-weight: 400; font-size: 14px; }
.nav-sub.is-active, .nav-sub.is-active:hover { background: var(--kr-grey-100); color: var(--kr-white); }
.badge-new { font-size: 10px; line-height: 14px; font-weight: 700; font-style: italic; letter-spacing: .3px; color: var(--kr-white); background: var(--kr-primary); padding: 1px 6px; border-radius: 4px; }
.ed-plan { margin-top: auto; display: grid; gap: 10px; text-align: center; font-size: 13px; line-height: 18px; color: var(--kr-grey-80); }
.ed-plan b { font-weight: 700; font-style: italic; color: var(--kr-grey-100); }

.ed-mbar { display: none; grid-area: mbar; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--kr-white); border-bottom: 1px solid var(--kr-grey-60); }
.ed-mbar .logo svg { width: 116px; }
.ed-tabs { display: none; grid-area: tabs; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; justify-content: center; padding: 12px 16px; background: var(--kr-background); }
.seg-light { display: flex; padding: 3px; gap: 2px; background: var(--kr-grey-60); border-radius: 10px; }
.seg-light button { border: 0; background: none; padding: 7px 18px; border-radius: 8px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--kr-grey-100); cursor: pointer; transition: background var(--dur-fast), box-shadow var(--dur-fast); }
.seg-light button[aria-pressed="true"] { background: var(--kr-white); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
.seg-light button:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }

.ed-main { grid-area: main; min-width: 0; padding: 0 24px 140px; }
.ed-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; display: flex; justify-content: space-between; align-items: center; padding: 14px 0 12px; background: var(--kr-background); }
.saved { display: inline-flex; gap: 8px; align-items: center; color: var(--kr-grey-80); font-size: 14px; line-height: 20px; }
.hist { display: flex; gap: 8px; }
.icon-sq { width: 40px; height: 40px; border-radius: 10px; border: 0; background: var(--kr-grey-40); color: var(--kr-grey-100); display: grid; place-items: center; cursor: pointer; transition: background var(--dur-fast) var(--ease-standard); }
.icon-sq:hover:not(:disabled) { background: var(--kr-grey-60); }
.icon-sq:disabled { color: var(--kr-grey-80); opacity: .55; cursor: default; }
.icon-sq:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.ed-col { max-width: 760px; margin-inline: auto; display: grid; gap: 16px; }

.premium { border: 1.5px solid transparent; border-radius: var(--radius-card); background: linear-gradient(var(--kr-white), var(--kr-white)) padding-box, var(--kr-premium-gradient) border-box; box-shadow: var(--kr-shadow-premium-light); }
.premium-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 20px; border: 0; background: none; cursor: pointer; text-align: left; font-size: 15px; line-height: 22px; font-weight: 500; border-radius: var(--radius-card); }
.premium-head:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.premium-head .txt { flex: 1; min-width: 0; }
.kr-text-premium-gradient { background: var(--kr-premium-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
.premium-head .chev-d { color: #666cff; }
.chev-d { display: inline-flex; transition: transform var(--dur-slow) var(--ease-inout); }
.is-open > * > .chev-d, .premium.is-open .chev-d, .ecard.is-open > .ehead .chev-d { transform: rotate(180deg); }
.premium-list { list-style: none; margin: 0; padding: 0 20px 16px; display: grid; gap: 10px; font-size: 14px; line-height: 20px; }
.premium-list li { display: flex; gap: 10px; align-items: center; }
.pdot { width: 20px; height: 20px; border-radius: 50%; background: var(--kr-premium-gradient); color: var(--kr-white); display: grid; place-items: center; flex: none; }
.pdot svg.i { width: 12px; height: 12px; stroke-width: 3; }
.premium-list .btn { justify-self: start; margin-top: 4px; min-height: 38px; padding: 6px 20px; font-size: 14px; }
.doc-line { margin: 4px 0 0; font-size: 15px; line-height: 22px; }
.doc-line b { font-weight: 500; }

.ecard { background: var(--kr-white); border-radius: var(--radius-card); border: 1px solid var(--kr-grey-60); transition: box-shadow var(--dur-base) var(--ease-standard); scroll-margin-top: 76px; }
.ecard.is-flash { box-shadow: 0 0 0 1px var(--kr-blue), 0 0 0 4px var(--kr-blue-tint); }
.ehead { width: 100%; display: flex; align-items: center; gap: 12px; padding: 16px 20px; border: 0; background: none; cursor: pointer; text-align: left; border-radius: var(--radius-card); font-size: 18px; line-height: 24px; font-weight: 500; transition: background 60ms linear; }
.ehead:active { background: var(--kr-grey-20); }
.ehead:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.ehead .eicon { width: 36px; height: 36px; border-radius: 10px; background: var(--kr-grey-40); display: grid; place-items: center; flex: none; }
.ehead .eicon svg.i { width: 18px; height: 18px; }
.ehead .meta { margin-left: auto; font-size: 13px; line-height: 18px; font-weight: 400; color: var(--kr-grey-80); white-space: nowrap; }
.ehead.analysis { font-size: 16px; font-weight: 400; color: var(--kr-grey-80); }
.ehead.analysis .meta { color: var(--kr-grey-80); }
.ecard > .acc { transition: grid-template-rows var(--dur-slow) var(--ease-inout); }
.ecard.is-open > .acc { grid-template-rows: 1fr; }
.acc-inner > .ebody { opacity: 0; transform: translateY(-6px); transition: opacity var(--dur-fast) var(--ease-exit), transform var(--dur-fast) var(--ease-exit); }
.ecard.is-open .acc-inner > .ebody { opacity: 1; transform: none; transition: opacity var(--dur-base) var(--ease-standard) 80ms, transform var(--dur-slow) var(--ease-standard) 40ms; }
.ebody { padding: 4px 20px 20px; display: grid; gap: 16px; }
.ebody > p { margin: 0; font-size: 14px; line-height: 20px; color: var(--kr-grey-80); }
.hint-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 14px; line-height: 20px; }
.hint-list li { display: flex; gap: 10px; align-items: center; }
.hint-list .hd { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.pi { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 20px; align-items: start; }
.photo { display: grid; justify-items: center; gap: 12px; }
.photo-circle { width: 108px; height: 108px; border-radius: 50%; background: var(--kr-grey-20); border: 1px solid var(--kr-grey-60); display: grid; place-items: center; color: var(--kr-grey-100); }
.photo-circle svg.i { width: 26px; height: 26px; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; line-height: 20px; cursor: pointer; }
.check input { width: 16px; height: 16px; margin: 0; accent-color: var(--kr-blue); }
.btn-ol-sm { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 6px 14px; border: 1px solid var(--kr-grey-100); border-radius: var(--radius-btn); background: var(--kr-white); font-size: 14px; line-height: 20px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background var(--dur-fast); }
.btn-ol-sm:hover { background: var(--kr-grey-40); }
.btn-ol-sm:active { background: var(--kr-grey-60); }
.btn-ol-sm:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.btn-ol-sm svg.i { width: 16px; height: 16px; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fgrid .full { grid-column: 1 / -1; }
.f { display: grid; gap: 4px; min-width: 0; }
.f > label { font-size: 13px; line-height: 18px; color: var(--kr-grey-80); }
.input.sm { min-height: 42px; padding: 9px 12px; font-size: 15px; line-height: 22px; border-radius: 8px; }
.textarea.sm { min-height: 120px; padding: 10px 12px; font-size: 14px; border-radius: 8px; }
.more { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--dur-slow) var(--ease-inout); }
.more.is-hidden { grid-template-rows: 0fr; }
.more-inner { min-height: 0; overflow: hidden; display: grid; gap: 16px; margin-inline: -4px; padding-inline: 4px; }
.more-inner > .fgrid { padding-top: 2px; }
.add-fields { width: 100%; padding: 10px; border: 1px dashed var(--kr-primary); border-radius: 10px; background: var(--kr-white); color: var(--kr-primary); font-size: 15px; line-height: 20px; font-weight: 500; cursor: pointer; transition: background var(--dur-fast); }
.add-fields:hover { background: var(--kr-grey-20); }
.add-fields:focus-visible, .more-toggle:focus-visible, .add-row:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.more-toggle { justify-self: center; border: 0; background: none; color: var(--kr-primary); font-size: 15px; line-height: 20px; font-weight: 500; cursor: pointer; padding: 6px 8px; border-radius: 6px; }
.entry { display: flex; gap: 12px; align-items: flex-start; padding: 12px 6px 12px 14px; border: 1px solid var(--kr-grey-60); border-radius: 10px; }
.entry-text { flex: 1; min-width: 0; display: grid; gap: 2px; }
.entry-text b { font-size: 15px; line-height: 20px; font-weight: 500; }
.entry-text span { font-size: 13px; line-height: 18px; color: var(--kr-grey-80); }
.entry .icon-btn { position: static; width: 36px; height: 36px; }
.entry .icon-btn svg.i { width: 18px; height: 18px; }
.add-row { justify-self: start; border: 0; background: none; color: var(--kr-blue); font-size: 14px; line-height: 20px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
.add-row:hover { color: var(--kr-grey-100); }
.add-row svg.i { width: 16px; height: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; gap: 4px; align-items: center; padding: 4px 4px 4px 12px; border: 1px solid var(--kr-grey-60); border-radius: 999px; background: var(--kr-grey-20); font-size: 14px; line-height: 20px; }
.chip button { width: 24px; height: 24px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; cursor: pointer; color: var(--kr-grey-80); transition: background var(--dur-fast), color var(--dur-fast); }
.chip button:hover { background: var(--kr-grey-60); color: var(--kr-grey-100); }
.chip button svg.i { width: 14px; height: 14px; }

.ed-preview {
  grid-area: preview; position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto;
  background: var(--kr-white); border-left: 1px solid var(--kr-grey-60); padding: 16px 24px 120px; display: grid; align-content: start; gap: 20px;
}
.pv-tabs { justify-self: center; display: flex; border: 1px solid var(--kr-grey-60); border-radius: 10px; background: var(--kr-white); }
.pv-tab { display: inline-flex; gap: 8px; align-items: center; padding: 8px 14px; border: 0; border-right: 1px solid var(--kr-grey-60); background: none; font-size: 15px; line-height: 20px; color: var(--kr-grey-100); cursor: pointer; white-space: nowrap; transition: background var(--dur-fast); }
.pv-tab:first-child { border-radius: 10px 0 0 10px; } .pv-tab:last-child { border-right: 0; border-radius: 0 10px 10px 0; }
.pv-tab:hover { background: var(--kr-grey-40); }
.pv-tab.is-active, .pv-tab.is-active:hover { color: var(--kr-primary); background: var(--kr-white); box-shadow: inset 0 0 0 1px var(--kr-primary); }
.pv-tab:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.pv-tab svg.i { width: 18px; height: 18px; }
.pv-body { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 16px; }
.pv-tools { display: grid; gap: 12px; align-content: start; padding-top: 24px; }
.pv-paper-wrap { container-type: inline-size; min-width: 0; }

/* The resume page — sized in container units so it scales with the pane */
.rv {
  position: relative; width: 100%; aspect-ratio: 1 / 1.414; overflow: clip; background: var(--kr-white); box-shadow: var(--kr-shadow-cv);
  padding: 7cqw 6cqw; font-family: var(--font-sans); font-size: 1.62cqw; line-height: 1.5; color: var(--kr-grey-100); display: grid; align-content: start; gap: 1.2cqw;
}
.rv::before {
  content: ""; position: absolute; right: -10cqw; top: -10cqw; width: 42cqw; aspect-ratio: 1; border-radius: 50%; pointer-events: none;
  background: repeating-radial-gradient(circle, transparent 0 2.6cqw, rgba(0, 0, 0, .045) 2.6cqw calc(2.6cqw + 1px));
}
.rv-mark { position: absolute; left: 50%; top: 60%; transform: translate(-50%, -50%); font-weight: 700; font-size: 16cqw; line-height: 1; letter-spacing: .4cqw; color: rgba(0, 0, 0, .045); pointer-events: none; user-select: none; }
.rv-sec { position: relative; margin-inline: -1.6cqw; padding: 1cqw 1.6cqw; border-radius: .6cqw; outline: 2px solid transparent; outline-offset: -1px; cursor: pointer; transition: outline-color var(--dur-fast) var(--ease-standard); }
.rv-sec:hover, .rv-sec:focus-visible { outline-color: var(--kr-primary); }
.rv-sec::after {
  content: "Click to edit this section"; position: absolute; left: -1px; bottom: -1px; opacity: 0; transition: opacity var(--dur-fast);
  background: var(--kr-primary); color: var(--kr-white); font-size: max(10px, 1.5cqw); line-height: 1.5; padding: .2cqw 1cqw; border-radius: 0 .6cqw 0 .6cqw;
}
.rv-sec:hover::after, .rv-sec:focus-visible::after { opacity: 1; }
.rv-name { font-family: var(--font-display); font-weight: 400; color: var(--kr-green-apple); font-size: 5.4cqw; line-height: 1.12; letter-spacing: -.06cqw; margin: 0; }
.rv-role { margin: .2cqw 0 1.4cqw; font-size: 2cqw; color: var(--kr-grey-80); }
.rv-details { display: grid; gap: .25cqw; }
.rv-details b { font-weight: 500; }
.rv h3 { font-family: var(--font-display); font-weight: 400; font-size: 2.5cqw; line-height: 1.3; margin: 0 0 1cqw; display: flex; gap: 1.2cqw; align-items: baseline; }
.rv h3 span { color: var(--kr-green-apple); font-size: 2.1cqw; }
.rv h3::after { content: ""; flex: none; }
.rv-ul { display: block; width: 9cqw; height: .25cqw; background: var(--kr-green-apple); margin: -.6cqw 0 1.2cqw; }
.rv p { margin: 0; }
.rv-entry { display: grid; gap: .2cqw; }
.rv-entry + .rv-entry { margin-top: 1.6cqw; }
.rv-entry b { font-size: 1.85cqw; font-weight: 500; }
.rv-meta { color: var(--kr-grey-80); font-size: 1.4cqw; }
.rv-entry ul { margin: .4cqw 0 0; padding-left: 2.4cqw; }
.rv-skills { display: flex; flex-wrap: wrap; gap: .6cqw 1.4cqw; list-style: none; margin: 0; padding: 0; }
.rv-skills li { display: inline-flex; align-items: center; gap: 1.4cqw; }
.rv-skills li::after { content: ""; width: .8cqw; height: .8cqw; border-radius: 50%; background: var(--kr-green-apple); }
.rv-skills li:last-child::after { display: none; }
.rv-hobbies { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.2cqw 2cqw; text-align: center; }
.rv-hobbies div { display: grid; justify-items: center; gap: .8cqw; font-size: 1.5cqw; }
.rv-hobbies svg.i { width: 4.6cqw; height: 4.6cqw; stroke-width: 1.4; }

/* ---------- Dashboard ---------- */
.dash { margin-inline: -16px; min-height: 100vh; background: var(--kr-background); display: grid; grid-template-columns: 72px minmax(0, 1fr); }
body.is-mobile .dash { min-height: 100%; }
.dash-rail {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - 16px); margin: 8px 0 8px 8px;
  background: var(--kr-white); border-radius: var(--radius-card); padding: 16px 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.rail-logo { width: 40px; height: 40px; border: 0; background: none; border-radius: 10px; display: grid; place-items: center; cursor: pointer; overflow: hidden; }
.rail-logo svg { width: 28px; height: 28px; }
.rail-logo:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.rail-av { margin: 28px 0 40px; width: 36px; height: 36px; border-radius: 10px; background: var(--kr-blue-dark); color: var(--kr-white); display: grid; place-items: center; font-weight: 500; }
.rail-btn { position: relative; width: 40px; height: 40px; border-radius: 10px; border: 0; background: none; color: var(--kr-grey-100); display: grid; place-items: center; cursor: pointer; transition: background var(--dur-fast) var(--ease-standard); }
.rail-btn:hover { background: var(--kr-grey-40); }
.rail-btn:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.rail-btn.is-active, .rail-btn.is-active:hover { background: var(--kr-grey-100); color: var(--kr-white); }
.rail-btn.up { margin-top: auto; background: var(--kr-premium-gradient); color: var(--kr-white); box-shadow: var(--kr-shadow-premium-light); }

  let screenRun = null;

    if (screenRun) screenRun.finish();
    if (screen === current) return;

    await scrollToTop();
    if (current !== screen) return; // another change started while scrolling

    const fromOffset = from.offsetTop;
    if (screen === 'create') renderCreate();

    // Overlap: pin the outgoing screen where it is while the new one lays out in flow.
    Object.assign(from.style, { position: 'absolute', top: fromOffset + 'px', left: '0', right: '0', pointerEvents: 'none' });
    to.hidden = false;

    const anims = [];
    const outHead = from.querySelector(':scope > .page-head'), inHead = to.querySelector(':scope > .page-head');
    const outItems = [...from.querySelectorAll('.intent, .mcard, .ld-item, :scope > .center')].filter(shown);

    if (reduce) {
      anims.push(play(from, [{ opacity: 1 }, { opacity: 0 }], { duration: DUR.fast, easing: EASE.exit }));
      anims.push(play(to, [{ opacity: 0 }, { opacity: 1 }], { duration: DUR.base, delay: 60, easing: EASE.standard }));
    } else {
      // Headline: cross-fade in place
      [...outHead.children].forEach(el => anims.push(play(el, [{ opacity: 1 }, { opacity: 0 }], { duration: DUR.fast, easing: EASE.exit })));
      [...inHead.children].forEach(el => anims.push(play(el, [{ opacity: 0 }, { opacity: 1 }], { duration: DUR.base, delay: 100, easing: EASE.standard })));
      // Content: leave toward the side we came from, enter from the side we're heading to
      const order = picked ? outItems.filter(el => el !== picked).concat(picked) : outItems;
      order.forEach((el, i) => {
        anims.push(play(el, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${-24 * dir}px)` }],
          { duration: DUR.fast, delay: i * (STAGGER / 2), easing: EASE.exit }));
      });
      inItems.forEach((el, i) => {
        anims.push(play(el, [{ opacity: 0, transform: `translateX(${32 * dir}px)` }, { opacity: 1, transform: 'none' }],
          { duration: DUR.base, delay: 120 + i * STAGGER, easing: EASE.standard }));
      });
    }

    let finished = false;
    const cleanup = () => {
      if (finished) return; finished = true;
      from.hidden = true; from.removeAttribute('style');
      anims.forEach(a => a.cancel());
      if (screenRun === run) screenRun = null;
    };
    const run = { finish() { anims.forEach(a => { try { a.finish(); } catch (e) {} }); cleanup(); } };
    screenRun = run;
    await Promise.all(anims.map(a => a.finished.catch(() => {})));
    cleanup();
  }

  /* Keeps an element at a fixed spot on screen while layout above it changes
     (the browser's own scroll anchoring can't be relied on mid-transition). */
  let anchorRaf = 0;
  function holdInPlace(el, ms, then) {
    cancelAnimationFrame(anchorRaf);
    const top = el.getBoundingClientRect().top, t0 = performance.now(), sc = scroller();
    const step = () => {
      const d = el.getBoundingClientRect().top - top;
      if (Math.abs(d) > .5) sc.scrollBy(0, d);
      if (performance.now() - t0 < ms) anchorRaf = requestAnimationFrame(step); else then && then();
    };
    anchorRaf = requestAnimationFrame(step);
  }
  function revealBottom(card) {
    const r = card.getBoundingClientRect();
    const pad = framed() ? 16 : 24, vb = viewBottom();
    if (r.bottom > vb - pad) scroller().scrollBy({ top: Math.min(r.bottom - vb + pad, r.top - (framed() ? device.getBoundingClientRect().top + 52 : 16)), behavior: reduce ? 'auto' : 'smooth' });
  }
  let focusTimer = 0;
  function focusLater(el, ms) { clearTimeout(focusTimer); if (el) focusTimer = setTimeout(() => el.focus({ preventScroll: true }), ms); }

  function setOpen(card, open) {
    card.classList.toggle('is-open', open);
    card.querySelector('.mhead').setAttribute('aria-expanded', String(open));
    card.querySelector('.acc').inert = !open;
  }

  /* Variant A: one card open at a time; the card you clicked stays put under the cursor. */
  function toggleA(card) {
    const opening = !card.classList.contains('is-open');
    holdInPlace(card.querySelector('.mhead'), DUR.slow + 60, () => opening && revealBottom(card));
    methodsEl.querySelectorAll('.mcard.is-open').forEach(c => { if (c !== card) setOpen(c, false); });
    setOpen(card, opening);
    focusLater(opening ? card.querySelector('.input, .textarea, .dropzone') : null, DUR.slow);
  }

  /* Variant B: other options fold away and the picked one becomes the screen.
     Pure CSS state, so Back mid-way simply reverses it. */
  function openB(id) {
    const wrap = methodsEl.querySelector('.b-wrap');
    if (!wrap || wrap.classList.contains('has-focus')) return;
    wrap.classList.add('has-focus');
    wrap.querySelector('.b-back-inner').inert = false;
    wrap.querySelectorAll('.slot').forEach(slot => {
      const mine = slot.dataset.id === id, card = slot.querySelector('.mcard'), head = card.querySelector('.mhead');
      slot.classList.toggle('is-focus', mine);
      slot.inert = !mine;
      setOpen(card, mine);
      if (mine) { head.setAttribute('aria-disabled', 'true'); head.tabIndex = -1; }
    });
    const top = wrap.getBoundingClientRect().top, minTop = framed() ? device.getBoundingClientRect().top + 52 : 16;
    if (top < minTop) scroller().scrollBy({ top: top - minTop, behavior: reduce ? 'auto' : 'smooth' });
    focusLater(wrap.querySelector('.slot.is-focus .input, .slot.is-focus .textarea, .slot.is-focus .dropzone') || wrap.querySelector('.back'), DUR.slow);
  }
  function backB() {
    const wrap = methodsEl.querySelector('.b-wrap');
    if (!wrap || !wrap.classList.contains('has-focus')) return;
    const focus = wrap.querySelector('.slot.is-focus');
    wrap.classList.remove('has-focus');
    wrap.querySelector('.b-back-inner').inert = true;
    wrap.querySelectorAll('.slot').forEach(slot => {
      const card = slot.querySelector('.mcard'), head = card.querySelector('.mhead');
      slot.classList.remove('is-focus'); slot.inert = false;
      setOpen(card, false);
      head.removeAttribute('aria-disabled'); head.removeAttribute('tabindex');
    });
    focusLater(focus && focus.querySelector('.mhead'), 0);
  }

  /* ---------- Creating the resume ---------- */
  const STEPS = {
    linkedin: ['Reading your public profile', 'Pulling work history and education', 'Laying it out on a template'],
    ai: ['Writing your profile summary', 'Drafting your work experience', 'Picking skills for the role'],
    upload: ['Reading your file', 'Finding sections and dates', 'Moving it onto a template'],

    ai: 'The AI is drafting a resume around your job title.',

  };
  const BASE_PERSON = {
    titleBefore: '', titleAfter: '', first: 'Jana', last: 'Novák', jobTitle: 'Product Designer',
    phone: '+421 905 123 456', email: 'jana.novak@email.com', dob: '14.03.1993', nationality: 'Slovak',
    street: 'Obchodná 12', city: 'Bratislava', zip: '811 06', country: 'Slovakia', web: 'jananovak.design',
    profile: 'Product designer with 7 years of experience in health and finance apps. I turn research into clear decisions, prototype early, and work side by side with engineers to ship.',
    work: [
      { title: 'Senior Product Designer', org: 'Lumen Health', place: 'Bratislava', from: '03/2021', to: 'Present',
        bullets: ['Redesigned the patient booking flow and cut drop-off by 23%.', 'Built the first shared component library with two engineers.'] },
      { title: 'UX Designer', org: 'Pixelfield', place: 'Bratislava', from: '09/2018', to: '02/2021',
        bullets: ['Designed mobile banking features used by 400,000 people.'] }
    ],
    education: [{ title: 'MA Visual Communication', org: 'Academy of Fine Arts and Design', place: 'Bratislava', from: '2013', to: '2018' }],
    skills: ['Figma', 'User research', 'Prototyping', 'Design systems', 'Accessibility', 'Workshop facilitation'],
    hobbies: [['plane', 'Exploring distant lands'], ['book', 'Getting lost in a good book'], ['camera', 'Capturing moments'], ['music', 'Feeling the music'], ['bike', 'Weekend cycling']]
  };
  const cap = w => w ? w[0].toUpperCase() + w.slice(1) : '';
  function buildPerson(id, opts) {
    const p = JSON.parse(JSON.stringify(BASE_PERSON));
    if (id === 'ai' && opts) {
      const parts = opts.name.trim().split(/\s+/);
      p.first = parts[0]; p.last = parts.slice(1).join(' ');
      p.jobTitle = opts.title.trim();
      const ascii = w => w.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z]/g, '');
      p.email = [ascii(p.first), ascii(p.last)].filter(Boolean).join('.') + '@email.com';
      p.work[0].title = p.jobTitle;
      p.profile = `${p.jobTitle} with 7 years of experience delivering work people rely on every day. Known for turning messy problems into clear plans and for working closely with the people around me.`;
    }
    if (id === 'linkedin' && opts) {
      const slug = (opts.url.match(/linkedin\.com\/in\/([^/?#]+)/i) || [])[1] || '';
      const parts = slug.split('-').filter(w => /^[a-z]+$/i.test(w));
      if (parts.length >= 2) { p.first = cap(parts[0].toLowerCase()); p.last = cap(parts[1].toLowerCase()); p.email = `${parts[0]}.${parts[1]}@email.com`.toLowerCase(); }
    }
    const slugOf = w => w.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z]/g, '');
    if (id === 'ai' || id === 'linkedin') p.web = slugOf(p.first) + slugOf(p.last) + '.com';
    return p;
  }

  function startCreation(form, id, opts) {

  /* Each finished step visibly fills part of the page, so progress reads as "your resume taking shape" */
  function runBuilding() {
    const steps = [...screens.loading.querySelectorAll('.step')];
    const paper = screens.loading.querySelector('.ld-paper');
    const groups = [...paper.querySelectorAll('.ld-group')];
    const fills = [[0], [1, 2], [3]];
    const T = 900, start = 420;
    steps.forEach((st, i) => later(() => {
      if (i) { steps[i - 1].classList.replace('is-active', 'is-done'); fills[i - 1].forEach(g => groups[g].classList.add('is-filled')); }
      st.classList.add('is-active');
    }, start + i * T));
    later(() => {
      const last = steps.length - 1;
      steps[last].classList.replace('is-active', 'is-done');
      fills[last].forEach(g => groups[g].classList.add('is-filled'));
      paper.classList.add('is-done');
      later(openEditor, 520);
    }, start + steps.length * T);
  }

  /* Building screen → editor. The page you watched being built travels into the
     preview pane and becomes the real resume; the editor chrome settles in around it. */
  async function openEditor() {
    if (screenRun) screenRun.finish();
    const ldPaper = screens.loading.querySelector('.ld-paper');
    const r0 = ldPaper.getBoundingClientRect();
    editorEl.innerHTML = editorHTML();
    setPane('preview');
    topbarEl.hidden = true; pageEl.hidden = true; editorEl.hidden = false;
    Object.values(screens).forEach(sc => { sc.hidden = true; });
    current = 'editor';
    scroller().scrollTo({ top: 0 });
    if (reduce) { editorEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: DUR.base, easing: EASE.standard }); return; }
    const paper = editorEl.querySelector('#rv'), pv = editorEl.querySelector('.ed-preview');
    const r1 = paper.getBoundingClientRect();
    pv.style.overflow = 'visible'; pv.style.zIndex = '7';
    const anims = [play(paper, [
      { transformOrigin: '0 0', transform: `translate(${r0.left - r1.left}px, ${r0.top - r1.top}px) scale(${r0.width / r1.width})` },
      { transformOrigin: '0 0', transform: 'none' }], { duration: DUR.travel, easing: EASE.standard })];
    const chrome = [...editorEl.querySelectorAll('.ed-mbar, .ed-side, .ed-tabs, .pv-tabs, .pv-tools, .ed-top, .ed-col > *')].filter(shown);
    chrome.forEach((el, i) => anims.push(play(el, [
      { opacity: 0, transform: el.classList.contains('ed-side') ? 'translateX(-16px)' : 'translateY(10px)' }, { opacity: 1, transform: 'none' }],
      { duration: DUR.base, delay: 200 + Math.min(i, 8) * STAGGER, easing: EASE.standard })));
    await Promise.all(anims.map(a => a.finished.catch(() => {})));
    anims.forEach(a => a.cancel());
    pv.style.overflow = ''; pv.style.zIndex = '';
  }

  async function leaveApp(screen) {

  }

  /* Open a full-screen app view (dashboard) from any screen */
  async function openDashboard() {
    if (screenRun) screenRun.finish();
    clearTimers();
    const fromEl = APPS[current] || screens[current];
    if (fromEl && !reduce) {
      await fromEl.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: APPS[current] ? 'none' : 'translateY(-8px)' }],
        { duration: DUR.fast, easing: EASE.exit, fill: 'forwards' }).finished.catch(() => {});
    }
    if (fromEl) fromEl.getAnimations().forEach(a => a.cancel());
    Object.values(APPS).forEach(el => { if (el !== dashEl) { el.hidden = true; el.innerHTML = ''; } });
    topbarEl.hidden = true; pageEl.hidden = true;
    Object.values(screens).forEach(sc => { sc.hidden = true; });
    dashEl.innerHTML = dashHTML(); dashEl.hidden = false;
    current = 'dashboard';
    window.scrollTo(0, 0); device.scrollTop = 0;
    const items = [...dashEl.querySelectorAll('.dash-mbar, .dash-rail, .dash-head, .dash-main > .panel, .dash-mid > .panel, .dash-pair > .panel')].filter(shown);
    const anims = items.map((el, i) => play(el,
      reduce ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, transform: el.classList.contains('dash-rail') ? 'translateX(-12px)' : 'translateY(16px)' }, { opacity: 1, transform: 'none' }],
      { duration: DUR.base + 60, delay: i * (STAGGER + 15), easing: EASE.standard }));
    await Promise.all(anims.map(a => a.finished.catch(() => {})));
    anims.forEach(a => a.cancel());
  }

  /* From the dashboard into creation, with the chosen method already open */
  async function startFromDashboard(method) {
    await go('create');
    if (!method) return;
    if (variant === 'A') { const card = methodsEl.querySelector(`.mcard[data-id="${method}"]`); if (card) toggleA(card); }
    else openB(method);
  }

  function handleSubmit(form) {
    const id = form.dataset.method;
    if (id === 'linkedin') {
      const input = form.querySelector('input');
      const ok = /linkedin\.com\/in\/[\w\-%.]{2,}/i.test(input.value.trim());
      setError(input.closest('.field'), !ok);
      if (!ok) return input.focus();
      startCreation(form, id, { url: input.value.trim() });
    } else if (id === 'ai') {
      let firstBad = null;
      form.querySelectorAll('.field').forEach(fl => {
        const inp = fl.querySelector('input'); const bad = !inp.value.trim();
        setError(fl, bad); if (bad && !firstBad) firstBad = inp;
      });
      if (firstBad) return firstBad.focus();
      startCreation(form, id, { name: form.querySelector('[name="name"]').value.trim(), title: form.querySelector('[name="title"]').value.trim() });
    } else if (id === 'upload') {
      if (form._file) startCreation(form, id);
    } else if (id === 'paste') {
      const ta = form.querySelector('textarea');
      const bad = ta.value.trim().length < 80;
      setError(ta.closest('.field'), bad);
      if (bad) return ta.focus();
      startCreation(form, id);
    }
  }

  function setFile(form, file) {
    const slot = form.querySelector('.file-slot');
    const okType = file && /\.(pdf|docx?)$/i.test(file.name);
    slot.querySelector('.file-row')?.remove();
    form._file = okType ? file : null;
    setError(slot, !!file && !okType);
    form.querySelector('[type="submit"]').disabled = !okType;
    if (!okType) return;
    const kb = file.size / 1024;
    const size = kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.max(1, Math.round(kb)) + ' KB';
    slot.insertAdjacentHTML('afterbegin', `
      <div class="file-row">${icon('file')}
        <span class="ftext"><span class="fname">${file.name.replace(/[<>&"]/g, '')}</span><span class="fsize">${size}</span></span>
        <button class="icon-btn" type="button" data-action="remove-file" aria-label="Remove file">${icon('x')}</button>
      </div>`);
  }

  /* ---------- Events ---------- */
  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  function setVariant(v) {
    if (v !== 'A' && v !== 'B') return;
    variant = v;
    document.querySelectorAll('[data-variant]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.variant === v)));
    try { localStorage.setItem('kr-start-variant', v); } catch (e) {}
    if (current === 'create') renderCreate();
  }

  function setView(v) {
    if (v !== 'desktop' && v !== 'mobile') return;
    document.body.classList.toggle('is-mobile', v === 'mobile');
    document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
    try { localStorage.setItem('kr-start-view', v); } catch (e) {}
    window.scrollTo(0, 0); device.scrollTop = 0;
  }

  document.addEventListener('click', e => {
    const vb = e.target.closest('[data-variant]');
    if (vb) return setVariant(vb.dataset.variant);
    const vw = e.target.closest('[data-view]');
    if (vw) return setView(vw.dataset.view);
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;
    const form = el.closest('form');
    if (a === 'pick-intent') go('create', el);
    else if (a === 'restart') { clearTimers(); go('intent'); }
    else if (a === 'toggle') toggleA(el.closest('.mcard'));
    else if (a === 'open') { if (el.getAttribute('aria-disabled') !== 'true') openB(el.closest('.mcard').dataset.id); }
    else if (a === 'back') backB();
    else if (a === 'toast') toast(el.dataset.msg);
    else if (a === 'paste-example') {
      const inp = form.querySelector('input');
      inp.value = 'linkedin.com/in/jana-novak-design';
      setError(inp.closest('.field'), false); inp.focus();
    }
    else if (a === 'browse') form.querySelector('input[type="file"]').click();
    else if (a === 'remove-file') { setFile(form, null); form.querySelector('input[type="file"]').value = ''; }
    else if (a === 'paste-sample') {
      const ta = form.querySelector('textarea'); ta.value = SAMPLE_TEXT;
      ta.dispatchEvent(new Event('input', { bubbles: true })); ta.focus();
    }
    else if (a === 'proto-toggle') { const bar = el.closest('.proto'), open = !bar.classList.contains('is-open'); bar.classList.toggle('is-open', open); el.setAttribute('aria-expanded', String(open)); }
    else if (a === 'dashboard') openDashboard();
    else if (a === 'dash-start') startFromDashboard(el.dataset.method);
    else if (a === 'pane') setPane(el.dataset.pane);
    else if (a === 'ecard') toggleEcard(el.closest('.ecard'));
    else if (a === 'premium') {
      const box = el.closest('.premium'), open = !box.classList.contains('is-open');
      box.classList.toggle('is-open', open); el.setAttribute('aria-expanded', String(open));
      box.querySelector('.acc').inert = !open;
      box.querySelector('.acc').style.gridTemplateRows = open ? '1fr' : '';
    }
    else if (a === 'more-toggle') {
      const more = el.previousElementSibling, hide = !more.classList.contains('is-hidden');
      more.classList.toggle('is-hidden', hide); more.inert = hide;
      el.textContent = hide ? 'Show Additional Fields' : 'Hide Additional Fields';
      el.setAttribute('aria-expanded', String(!hide));
    }
    else if (a === 'chip-remove') { person[el.dataset.list].splice(+el.dataset.i, 1); refreshChips(el.dataset.list); }
    else if (a === 'rv-sec') editSection(el.dataset.sec);
  });

  document.addEventListener('submit', e => {
    if (!e.target.matches('form[data-method]')) return;
    e.preventDefault();
    handleSubmit(e.target);
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('[data-add]')) {
      e.preventDefault();
      const v = e.target.value.trim();
      if (v) { person[e.target.dataset.add].push(v); e.target.value = ''; refreshChips(e.target.dataset.add); }
    }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.rv-sec')) { e.preventDefault(); editSection(e.target.dataset.sec); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.dropzone')) { e.preventDefault(); e.target.closest('form').querySelector('input[type="file"]').click(); }
  });

  document.addEventListener('input', e => {
    if (e.target.matches('#screen-editor [data-k]')) { person[e.target.dataset.k] = e.target.value; syncEditor(); return; }
    const fl = e.target.closest('.field');
    if (fl && fl.classList.contains('has-error') && e.target.value.trim()) setError(fl, false);
    if (e.target.matches('.textarea')) {
      fl.querySelector('.count').textContent = `${e.target.value.length.toLocaleString('en-US')} / 5,000`;
    }
  });

  document.addEventListener('change', e => {
    if (e.target.matches('input[type="file"]')) setFile(e.target.closest('form'), e.target.files[0] || null);
  });

  ['dragenter', 'dragover'].forEach(t => document.addEventListener(t, e => {
    const dz = e.target.closest && e.target.closest('.dropzone');
    if (!dz) return;
    e.preventDefault(); dz.classList.add('is-over');
  }));
  document.addEventListener('dragleave', e => {
    const dz = e.target.closest && e.target.closest('.dropzone');
    if (dz && !dz.contains(e.relatedTarget)) dz.classList.remove('is-over');
  });
  document.addEventListener('drop', e => {
    const dz = e.target.closest && e.target.closest('.dropzone');
    if (!dz) return;
    e.preventDefault(); dz.classList.remove('is-over');
    if (e.dataTransfer.files[0]) setFile(dz.closest('form'), e.dataTransfer.files[0]);
  });

  /* Start: #a, #b, #a-mobile, #b-mobile deep-link a state; otherwise remember the last one */
  const hash = (location.hash || '').replace('#', '').toLowerCase();
  const hv = hash.match(/^(a|b)\b/), hm = hash.match(/mobile|desktop/);
  let savedV = null, savedView = null;
  try { savedV = localStorage.getItem('kr-start-variant'); savedView = localStorage.getItem('kr-start-view'); } catch (e) {}
  setVariant(hv ? hv[1].toUpperCase() : (savedV || 'A'));
  setView(hm ? hm[0] : (savedView || 'desktop'));
  if (/dashboard/.test(hash)) openDashboard();
  if (/editor/.test(hash)) {
    screens.intent.hidden = true; screens.loading.hidden = false; current = 'loading';
    openEditor();
  }
})();
</script>
