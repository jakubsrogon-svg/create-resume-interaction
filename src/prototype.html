<meta charset="utf-8">
<title>Resume Start Flow</title>
<style>
__STYLES__
</style>

<div class="stage">
<div class="device" id="device">
<div class="statusbar" aria-hidden="true"><span>9:41</span><span class="notch"></span><span class="sys"><span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span><span class="batt"><i></i></span></span></div>
<header class="topbar" id="topbar">
  <button class="logo" type="button" data-action="restart" aria-label="Kickresume, back to start">__LOGO_SVG__</button>
  <button class="top-x" id="top-x" type="button" data-action="route-close" aria-label="Close" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.71 5.29a1 1 0 0 1 0 1.42l-12 12a1 1 0 0 1-1.42-1.42l12-12a1 1 0 0 1 1.42 0Z"/><path fill="currentColor" d="M5.29 5.29a1 1 0 0 1 1.42 0l12 12a1 1 0 0 1-1.42 1.42l-12-12a1 1 0 0 1 0-1.42Z"/></svg></button>
</header>

<main class="page" id="page">
  <!-- Screen 1: intent -->
  <section class="screen" id="screen-intent" aria-labelledby="intent-h">
    <div class="page-head">
      <h1 id="intent-h">What do you want to get done first?</h1>
      <p>Pick one to start. You can use the others anytime.</p>
    </div>
    <div class="intent-grid" id="intent-grid"></div>
    <div class="center"><button class="text-link" type="button" data-action="dashboard">Skip personalization</button></div>
  </section>

  <!-- Screen 2: resume creation -->
  <section class="screen" id="screen-create" aria-labelledby="create-h" hidden>
    <div class="page-head">
      <h1 id="create-h" tabindex="-1">How do you want to create your resume?</h1>
      <p>We’ll fill in your details — you review and edit.</p>
    </div>
    <div class="methods" id="methods"></div>
    <div class="upm-slot" id="create-upm" hidden></div>
    <div class="center"><button class="text-link" type="button" data-action="create-back">Back</button></div>
  </section>

  <!-- Screen 3: building the resume -->
  <section class="screen" id="screen-loading" aria-labelledby="loading-h" hidden>
    <div class="page-head">
      <h1 id="loading-h">Building your resume</h1>
      <p id="loading-sub">This takes a few seconds.</p>
    </div>
    <div class="ld-stage ld-item">
      <div class="ld-paper-wrap">
      <span class="ld-badge" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>
      <div class="ld-paper" aria-hidden="true">
        <div class="ld-group"><i class="ln h"></i><i class="ln" style="width:44%"></i><i class="ln" style="width:58%"></i><i class="ln" style="width:50%"></i></div>
        <div class="ld-group"><i class="ln t"></i><i class="ln"></i><i class="ln" style="width:86%"></i><i class="ln t" style="margin-top:6px"></i><i class="ln" style="width:72%"></i><i class="ln" style="width:90%"></i><i class="ln" style="width:64%"></i></div>
        <div class="ld-group"><i class="ln t"></i><i class="ln" style="width:66%"></i><i class="ln" style="width:48%"></i></div>
        <div class="ld-group"><i class="ln t"></i><div class="ld-icons"><i></i><i></i><i></i><i></i></div></div>
      </div>
      </div>
      <div class="ld-steps"><ol class="steps" id="loading-steps" role="status" aria-live="polite"></ol></div>
    </div>
  </section>

  <!-- Route screens: product screens recreated from screenshots, filled in from ROUTES -->
  <section class="screen rt-screen" id="screen-route" hidden></section>
</main>

<!-- Screen 4: the editor -->
<div class="editor" id="screen-editor" data-pane="preview" hidden></div>

<!-- Screen 5: dashboard (where people land when they skip onboarding) -->
<div class="dash" id="screen-dash" hidden></div>
<div class="auth" id="screen-auth" hidden></div>
<div class="upg" id="screen-upgrade" hidden></div>
<div class="mdoc" id="screen-docs" hidden></div>
<div class="tl" id="screen-tool" hidden></div>
<div class="tps" id="screen-tpl" hidden></div>
<div class="jobs" id="screen-jobs" hidden></div>
<div class="cmp" id="screen-cm" hidden></div>
</div>
</div>

<template id="logo-symbol">__LOGO_SYMBOL__</template>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!-- The running flow (see FLOW_T and FEATURES) -->
<div class="flow-bar" id="flow-bar" role="group" aria-label="Flow steps" hidden></div>
<p class="sr-only" id="flow-live" aria-live="polite"></p>
<aside class="proto-note" id="proto-note" aria-label="Wireframe note" hidden><b>Note</b><span class="pn-text"></span></aside>
<!-- Prototype version: bumped with every update, patch or minor by its size, the major only when asked (see CLAUDE.md) -->
<div class="proto-ver" aria-label="Prototype version 2.38.1">v2.38.1</div>

<div class="proto" role="group" aria-label="Prototype controls">
  <button class="proto-reset proto-toggle" type="button" data-action="proto-toggle" aria-expanded="false" aria-label="Prototype controls">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
  </button>
  <div class="seg" data-screen-for="intent">
    <button type="button" data-layout="grid" aria-pressed="true" aria-label="Goal screen: grid" data-tip="Goal screen · Grid"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></button>
    <button type="button" data-layout="list" aria-pressed="false" aria-label="Goal screen: list" data-tip="Goal screen · List"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="5" x="3" y="3" rx="1.5"/><rect width="18" height="5" x="3" y="10" rx="1.5"/><rect width="18" height="5" x="3" y="17" rx="1.5"/></svg></button>
  </div>
  <span class="proto-sep" aria-hidden="true"></span>
  <div class="seg" data-screen-for="create">
    <button type="button" data-variant="A" aria-pressed="true" aria-label="Method screen: variant A, expand in place" data-tip="Method screen · A, expand in place">A</button>
    <button type="button" data-variant="B" aria-pressed="false" aria-label="Method screen: variant B, separate screens" data-tip="Method screen · B, separate screens">B</button>
  </div>
  <span class="proto-sep" aria-hidden="true"></span>
  <div class="seg">
    <button type="button" data-view="desktop" aria-pressed="true" aria-label="Desktop view" data-tip="Desktop view"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg></button>
    <button type="button" data-view="mobile" aria-pressed="false" aria-label="Mobile view" data-tip="Mobile view"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg></button>
  </div>
  <span class="proto-sep" aria-hidden="true"></span>
  <button class="proto-reset" type="button" data-action="restart" aria-label="Restart prototype" data-tip="Restart">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
  </button>
</div>

<!-- The run dock, beside More options: the flow to try (Open · From · CV · Ends) and Run -->
<div class="proto-dock" id="proto-dock" role="group" aria-label="Run a flow"></div>

<!-- More options: a quiet corner button that opens the less-used settings -->
<div class="proto-more" id="proto-more">
  <div class="proto-more-panel" id="proto-more-panel" role="group" aria-label="More prototype options" inert>
    <div class="pm-tabs" role="tablist" aria-label="Prototype options">
      <button class="pm-tab" type="button" role="tab" id="pm-tab-flows" aria-controls="pm-view-flows" aria-selected="true" data-pm-tab="flows">Flows</button>
      <button class="pm-tab" type="button" role="tab" id="pm-tab-urls" aria-controls="pm-view-urls" aria-selected="false" tabindex="-1" data-pm-tab="urls">URLs <span class="pm-count" id="pm-count"></span></button>
    </div>
    <div class="pm-view" id="pm-view-flows" role="tabpanel" aria-labelledby="pm-tab-flows">
      <div id="pm-flows"></div>
      <div class="pm-sec pm-opts">
        <div class="pm-row"><span class="pm-key">Look</span>
          <div class="seg pm-seg" data-screen-for="intent create">
            <button type="button" data-look="flat" aria-pressed="true" aria-label="Goal and method screens: flat look">Flat</button>
            <button type="button" data-look="3d" aria-pressed="false" aria-label="Goal and method screens: 3D look">3D</button>
          </div>
        </div>
        <div class="pm-row"><span class="pm-key">Method screen</span>
          <div class="seg pm-seg" data-screen-for="create">
            <button type="button" data-variant="C" aria-pressed="false" aria-label="Method screen: variant C, picture on top">Variant C · picture on top</button>
          </div>
        </div>
      </div>
    </div>
    <div class="pm-view" id="pm-view-urls" role="tabpanel" aria-labelledby="pm-tab-urls" hidden>
      <div id="pm-routes"></div>
    </div>
  </div>
  <button class="pm-btn" type="button" data-action="proto-more" aria-expanded="false" aria-controls="proto-more-panel" aria-label="More options"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></svg><span class="pm-dot" aria-hidden="true"></span></button>
</div>
