.panel { background: var(--kr-white); border-radius: 24px; padding: 28px 32px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.panel-head h2 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 500; }
.sq-arrow { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--kr-grey-60); background: var(--kr-white); display: grid; place-items: center; cursor: pointer; color: var(--kr-grey-100); box-shadow: 0 1px 3px rgba(0,0,0,.05); transition: background var(--dur-fast); }
.sq-arrow:hover { background: var(--kr-grey-40); }
.sq-arrow:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.sq-arrow svg.i { transform: rotate(180deg); }
.sq-arrow.grid svg.i { transform: none; }

/* Documents: horizontal row of "start a new…" tiles */
.doc-row { display: grid; grid-auto-flow: column; grid-auto-columns: 232px; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; margin: -4px; padding: 4px 4px 8px; scrollbar-width: thin; }  /* room for the tiles' focus ring and shadow */
.doc-tile {
  position: relative; scroll-snap-align: start; height: 188px; border: 0; border-radius: 16px; padding: 0; cursor: pointer; overflow: hidden;
  display: grid; grid-template-rows: 1fr auto; text-align: center; transition: box-shadow var(--dur-base) var(--ease-standard);
  container-type: inline-size;
}
.doc-tile:hover { box-shadow: var(--kr-shadow-dropdown); }
.doc-tile:active { box-shadow: none; filter: brightness(.98); }
.doc-tile:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.doc-tile.t-blue { background: #e4effa; }
.doc-tile.t-beige { background: var(--kr-beige); }
.doc-tile .art { position: relative; }
.doc-label { margin: 0 8px 8px; padding: 9px 12px; border-radius: 10px; background: rgba(255,255,255,.85); font-size: 15px; line-height: 20px; font-weight: 500; color: var(--kr-grey-100); }
.t-blue .doc-label { color: var(--kr-blue); }
.qs { position: absolute; top: 10px; right: 10px; z-index: 1; background: #1f7ae0; color: var(--kr-white); font-size: 12px; line-height: 16px; font-weight: 500; padding: 3px 8px; border-radius: 6px; }
/* tile art, sized in cqw so it scales with the tile */
.a-paper { position: absolute; background: var(--kr-white); border-radius: 1.4cqw; box-shadow: 0 1.4cqw 4cqw rgba(140,140,140,.2); padding: 3.4cqw; display: grid; align-content: start; gap: 2cqw; }
.a-paper .ln { height: 1.4cqw; }
.a-li { position: absolute; left: 12cqw; top: 9cqw; width: 30cqw; background: var(--kr-white); border-radius: 2cqw; box-shadow: 0 1.4cqw 4cqw rgba(0,0,0,.08); padding: 3cqw; display: grid; justify-items: center; gap: 2cqw; }
.a-li .in { justify-self: start; font-size: 4.4cqw; font-weight: 700; color: #0a66c2; }
.a-li .face { width: 9cqw; height: 9cqw; border-radius: 50%; background: linear-gradient(135deg, #c9b8a6, #7d6b5d); }
.a-arrow { position: absolute; left: 30cqw; top: 43cqw; width: 18cqw; height: 12cqw; color: var(--kr-grey-100); }
.a-bubble { position: absolute; background: var(--kr-white); border-radius: 2cqw; box-shadow: 0 1cqw 3cqw rgba(0,0,0,.08); padding: 2cqw 3cqw; font-size: 4.4cqw; line-height: 1; color: var(--kr-grey-100); font-family: var(--font-display); }
.a-dots { position: absolute; display: flex; gap: 1.6cqw; }
.a-dots i { width: 4cqw; height: 4cqw; border-radius: 50%; }
.a-letter { position: absolute; background: var(--kr-white); border: .5cqw solid #666cff; border-radius: 1.4cqw; padding: 3cqw; display: grid; gap: 1.8cqw; box-shadow: 0 1.4cqw 4cqw rgba(102,108,255,.15); }
.a-letter .ln { height: 1.2cqw; }
.a-chip { width: 14cqw; height: 3.6cqw; border-radius: 1cqw; background: var(--kr-premium-gradient); }
.a-laptop { position: absolute; left: 14cqw; top: 9cqw; width: 72cqw; height: 46cqw; border-radius: 2.4cqw 2.4cqw 0 0; background: #1d2433; padding: 2.4cqw; }
.a-laptop::after { content: ""; position: absolute; left: -6cqw; right: -6cqw; bottom: -3cqw; height: 3cqw; border-radius: 0 0 2cqw 2cqw; background: #2e3546; }
.a-screen { height: 100%; border-radius: 1cqw; background: linear-gradient(160deg, #5b6a9a 0%, #9a7f8f 55%, #d8a98f 100%); display: grid; place-items: center; }
.a-screen span { width: 9cqw; height: 9cqw; border-radius: 50%; background: rgba(255,255,255,.35); }

/* Middle grid: jobs (left) + map, interviews, tips (right) */
.dash-mid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 24px; }
.dash-mid > .jobs-panel { grid-row: span 2; }
.dash-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.job-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.job { width: 100%; display: flex; gap: 16px; align-items: center; padding: 10px 8px; border: 0; background: none; border-radius: 12px; cursor: pointer; text-align: left; transition: background var(--dur-fast); }
.job:hover { background: var(--kr-grey-20); }
.job:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.co { display: block; width: 40px; height: 40px; border-radius: 5px; flex: none; object-fit: cover; }
.job-text { display: grid; min-width: 0; }
.job-text span { font-size: 13px; line-height: 18px; color: var(--kr-grey-80); }
.job-text b { font-size: 15px; line-height: 20px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feat { display: grid; grid-template-rows: auto 1fr auto; }
.feat .art { position: relative; height: 150px; margin-bottom: 20px; container-type: inline-size; }
.btn-soft { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--kr-grey-60); background: var(--kr-white); color: var(--kr-blue); font-size: 15px; font-weight: 500; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.05); transition: background var(--dur-fast); }
.btn-soft:hover { background: var(--kr-grey-20); }
.btn-soft:active { background: var(--kr-grey-40); }
.btn-soft:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.node { position: absolute; background: var(--kr-white); border: 1px solid var(--kr-grey-60); border-radius: 8px; padding: 6px 8px; display: grid; gap: 3px; min-width: 88px; box-shadow: 0 2px 6px rgba(0,0,0,.05); font-size: 10px; line-height: 12px; font-style: italic; color: var(--kr-grey-100); }
.node small { font-size: 8px; color: var(--kr-grey-80); font-style: normal; }
.node i { display: block; height: 3px; border-radius: 2px; background: var(--kr-grey-60); }
.node i b { display: block; height: 100%; border-radius: 2px; background: var(--kr-grey-100); }
.node.faint { opacity: .45; }
.map-lines { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: var(--kr-grey-60); stroke-width: 1.5; }
.q { position: absolute; background: var(--kr-white); border: 1px solid var(--kr-grey-60); border-radius: 8px; padding: 6px 10px; font-size: 10px; line-height: 12px; font-style: italic; color: var(--kr-grey-80); box-shadow: 0 2px 6px rgba(0,0,0,.05); white-space: nowrap; }
.q.q-input { width: 120px; height: 30px; border-color: #9fc3f5; box-shadow: 0 0 0 3px #e4effa; }
.q.q-input::after { content: ""; position: absolute; left: 14px; right: 30px; top: 13px; height: 2px; border-radius: 1px; background: #cfe1f8; }
.tips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tips-sub { margin: -8px 0 16px; font-size: 13px; color: var(--kr-grey-80); }
.tip { border: 0; background: none; padding: 6px; border-radius: 10px; text-align: left; cursor: pointer; display: grid; gap: 8px; align-content: start; transition: background var(--dur-fast); }
.tip:hover { background: var(--kr-grey-40); }
.tip:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.thumb { aspect-ratio: 16 / 7; border-radius: 6px; display: grid; place-items: center; color: var(--kr-white); }
.thumb svg.i { width: 22%; height: auto; aspect-ratio: 1; stroke-width: 1.5; }
.tip > span:last-child { font-size: 13px; line-height: 18px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* All tools */
.tools { display: grid; grid-template-columns: repeat(6, minmax(150px, 1fr)); gap: 16px; overflow-x: auto; margin-inline: -4px; padding: 4px; }
.tool { border: 1px solid var(--kr-grey-60); background: var(--kr-white); border-radius: 16px; padding: 18px 16px; text-align: left; cursor: pointer; display: grid; gap: 8px; align-content: start; transition: box-shadow var(--dur-base) var(--ease-standard); }
.tool:hover { box-shadow: var(--kr-shadow-dropdown); }
.tool:active { background: var(--kr-grey-20); }
.tool:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.tool-ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 6px; }
.tool-ic svg.i { width: 22px; height: 22px; }
.tool b { font-size: 14px; line-height: 20px; font-weight: 500; }
.tool span { font-size: 13px; line-height: 18px; color: var(--kr-grey-80); }

@container (max-width: 1100px) {
  .dash-main { padding: 28px 24px 56px; }
  .dash-mid { grid-template-columns: minmax(0, 1fr); }
  .dash-mid > .jobs-panel { grid-row: auto; }
  .job-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@container (max-width: 760px) {
  .dash { grid-template-columns: minmax(0, 1fr); }
  .dash-main { padding: 20px 16px 48px; gap: 16px; }
  .dash-head .btn-up .lbl { display: none; }
  .dash-head .btn-up { padding: 8px 10px; }
  .panel { padding: 20px 16px; border-radius: 20px; }
  .doc-row { grid-auto-columns: 200px; }
  .doc-tile { height: 164px; }
  .dash-pair { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .job-list { grid-template-columns: minmax(0, 1fr); }
  .tips { grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: 56%; overflow-x: auto; scroll-snap-type: x mandatory; }
  .tip { scroll-snap-align: start; }
  .tools { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 62%; scroll-snap-type: x mandatory; }
  .tool { scroll-snap-align: start; }
}

/* Editor: tablet (sidebar + one pane with tabs), phone (top bar + tabs) */
@container (max-width: 1100px) {
  .editor { grid-template-columns: 232px minmax(0, 1fr); grid-template-areas: "side tabs" "side pane"; grid-template-rows: auto 1fr; }
  .ed-side { grid-row: 1 / 3; }
  .ed-tabs { display: flex; }
  .ed-main, .ed-preview { grid-area: pane; }
  .ed-preview { position: static; height: auto; overflow: visible; border-left: 0; background: var(--kr-background); padding: 4px 24px 140px; }
  .ed-top { top: calc(env(safe-area-inset-top, 0px) + 64px); }
  .editor[data-pane="edit"] .ed-preview, .editor[data-pane="preview"] .ed-main { display: none; }
}
@container (max-width: 760px) {
  .editor { grid-template-columns: minmax(0, 1fr); grid-template-areas: "mbar" "tabs" "pane"; grid-template-rows: auto auto 1fr; }
  .ed-side { display: none; }
  .ed-mbar { display: flex; }
  .ed-main { padding: 0 16px 120px; }
  .ed-preview { padding: 4px 16px 120px; }
  .ed-top { position: static; }
  .pv-tabs:not(.has-trt), .pv-tab[data-pv-tab="help"] { display: none; }  /* phones: only Edit Preview ⇄ Resume Tailoring, once tailored */
  .pv-tab[data-pv-tab="tailoring"] { border-right: 0; border-radius: 0 10px 10px 0; }
  .trt { margin-top: 12px; }
  .pv-body { grid-template-columns: minmax(0, 1fr); }
  .pv-tools { display: none; }
  .premium-head { padding: 12px 16px; font-size: 14px; line-height: 20px; }
  .pi { grid-template-columns: minmax(0, 1fr); }
  .photo { grid-template-columns: auto 1fr; justify-items: start; align-items: center; column-gap: 16px; }
  .photo-circle { width: 72px; height: 72px; grid-row: 1 / 3; }
  .ehead { padding: 14px 16px; font-size: 16px; }
  .ebody { padding: 4px 16px 16px; }
}

/* ---------- Prototype controls (not part of the product UI) ----------
   A slim vertical rail on the right edge; labels show as tooltips. */
.proto {
  position: fixed; right: 12px; top: 50%; transform: translateY(-50%); z-index: 20;
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px;
  background: var(--kr-blue-dark); color: var(--kr-white); border-radius: 14px; box-shadow: var(--kr-shadow-modal);
}
.seg { display: flex; flex-direction: column; background: #1b2747; border-radius: 10px; padding: 3px; gap: 2px; }
.seg button, .proto-reset {
  position: relative; width: 34px; height: 34px; border: 0; background: none; color: #d6dae4; border-radius: 8px; cursor: pointer;
  display: grid; place-items: center; font-size: 13px; line-height: 1; font-weight: 600; transition: background .2s, color .2s;
}
.seg button:hover, .proto-reset:hover { color: var(--kr-white); background: #24325a; }
.seg button[aria-pressed="true"] { background: var(--kr-blue); color: var(--kr-white); }
.seg button:focus-visible, .proto-reset:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(255,255,255,.45); }
.seg svg.i, .proto-reset svg.i { width: 16px; height: 16px; }
.proto-sep { width: 20px; height: 1px; background: #2c3a5c; margin-block: 2px; }
/* A setting that doesn't affect the current screen fades back; clicking it takes you to the screen it changes */
.seg[data-screen-for] { transition: opacity var(--dur-base) var(--ease-standard); }
body:not([data-screen="intent"]) .seg[data-screen-for="intent"],
body:not([data-screen="create"]) .seg[data-screen-for="create"],
body:not([data-screen="intent"]):not([data-screen="create"]) .seg[data-screen-for="intent create"] { opacity: .4; }
body .seg[data-screen-for]:hover, body .seg[data-screen-for]:focus-within { opacity: 1; }
[data-tip]::after {
  content: attr(data-tip); position: absolute; right: calc(100% + 12px); top: 50%; transform: translate(4px, -50%);
  white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard);
  background: var(--kr-blue-dark); color: var(--kr-white); font-size: 12px; line-height: 16px; font-weight: 500; padding: 6px 10px; border-radius: 8px; box-shadow: var(--kr-shadow-dropdown);
}
[data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; transform: translate(0, -50%); }
/* More options, bottom right: an almost invisible button (just a very light grey icon, no background)
   that opens a small panel with the less-used settings, variant C and the Flat / 3D look. A faint dot
   shows when one of them is on. */
.proto-more { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: grid; justify-items: end; gap: 8px; pointer-events: none; }
.proto-more > .pm-btn, .proto-more.is-open > .proto-more-panel { pointer-events: auto; }  /* the closed panel still takes room; it must not block the page */
.pm-btn {
  position: relative; width: 36px; height: 36px; border: 0; border-radius: 12px; cursor: pointer; display: grid; place-items: center;
  background: none; color: color-mix(in srgb, var(--kr-grey-80) 35%, var(--kr-white)); transition: color var(--dur-fast) var(--ease-standard);
}
.pm-btn:hover, .pm-btn:focus-visible, .pm-btn[aria-expanded="true"] { color: var(--kr-grey-80); }
.pm-btn:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.pm-btn svg.i { width: 16px; height: 16px; }
.pm-dot { position: absolute; top: 8px; right: 8px; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0; transition: opacity var(--dur-fast); }
.pm-btn.has-active .pm-dot { opacity: 1; }
.proto-more-panel {
  display: grid; gap: 8px; padding: 10px 10px 10px 12px; background: var(--kr-blue-dark); color: var(--kr-white); border-radius: 14px; box-shadow: var(--kr-shadow-modal);
  opacity: 0; transform: translateY(6px); visibility: hidden;
  transition: opacity var(--dur-fast) var(--ease-exit), transform var(--dur-fast) var(--ease-exit), visibility 0s var(--dur-fast);
}
.proto-more.is-open .proto-more-panel { opacity: 1; transform: none; visibility: visible; transition: opacity var(--dur-base) var(--ease-standard), transform var(--dur-base) var(--ease-standard), visibility 0s; }
.pm-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.proto-more .seg { flex-direction: row; }
/* tooltips open above, right-aligned, so they stay on screen */
.proto-more [data-tip]::after { right: 0; top: auto; bottom: calc(100% + 10px); transform: translate(0, 4px); }
.proto-more [data-tip]:hover::after, .proto-more [data-tip]:focus-visible::after { transform: none; }
/* in the panel (it scrolls, so it clips): wrapped, set off from the dark panel, and the CV and Result rows' open below */
.proto-more [data-tip]::after { white-space: normal; width: max-content; max-width: 220px; z-index: 3; box-shadow: 0 0 0 1px rgba(255, 255, 255, .18), var(--kr-shadow-dropdown); }
.proto-more [data-pm-check][data-tip]::after { top: calc(100% + 10px); bottom: auto; transform: translate(0, -4px); }
.proto-more [data-pm-check][data-tip]:is(:hover, :focus-visible)::after { transform: none; }
/* Version tag, bottom left: same dark chrome as the rail so it reads as part of the prototype, not the product */
.proto-ver {
  position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20; pointer-events: none;
  padding: 4px 8px; border-radius: 8px; background: var(--kr-blue-dark); color: #d6dae4; box-shadow: var(--kr-shadow-dropdown);
  font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.2px; font-variant-numeric: tabular-nums;
}
/* Keep the rail clear of content on wide screens */
@media (min-width: 481px) { body:not(.is-mobile) .stage { padding-right: 52px; } }
/* On a real phone: tuck it into the bottom-right corner */
.proto-toggle { display: none; }
@media (max-width: 480px) {
  .proto { top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: none; right: 8px; }
  .proto-toggle { display: grid; }
  .proto:not(.is-open) > :not(.proto-toggle) { display: none; }
  .proto:not(.is-open) { padding: 4px; border-radius: 12px; }
  [data-tip]::after { display: none; }
  .proto-more { right: 60px; }  /* left of the folded rail */
}

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 21;
  transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
  background: var(--kr-white); color: var(--kr-grey-100); border: 1px solid var(--kr-grey-60); box-shadow: var(--kr-shadow-modal);
  padding: 10px 16px; border-radius: 10px; font-size: 14px; line-height: 20px; max-width: calc(100% - 32px); text-align: center;
  transition: opacity .25s ease-in-out, transform .25s ease-in-out;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Career Map (Figma concepting-KR › Career Map, 294:22071): its own page, then the map (an app page) ---------- */
.cmp { position: relative; margin-inline: -16px; min-height: calc(var(--vh) * 100); overflow: clip; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 120px 24px 96px; background: var(--kr-grey-20); color: var(--kr-grey-100); }
body.has-note .cmp, body:has(.flow-bar:not([hidden])) .cmp { padding-bottom: 164px; }
.cmp button { font-family: var(--font-sans); }
.cmp button:focus-visible, .cmp input:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.cm-bg { position: absolute; left: calc(50% - 497px); top: 0; pointer-events: none; }
.cm-logo { position: absolute; left: 39px; top: 35px; display: flex; }
.cm-logo svg, .cm-logo2 svg { width: 152px; height: 24px; display: block; }
.cm-card { position: relative; display: flex; width: min(885px, 100%); height: 613px; border-radius: 24px; filter: drop-shadow(0 326px 65px rgba(0, 0, 0, .01)) drop-shadow(0 183px 55px rgba(0, 0, 0, .05)) drop-shadow(0 81px 40.5px rgba(0, 0, 0, .09)) drop-shadow(0 20px 22.5px rgba(0, 0, 0, .1)); }
.cm-left { flex: none; width: 340px; display: flex; flex-direction: column; padding: 40px 24px 40px 40px; background: var(--kr-background); border-radius: 24px 0 0 24px; }
.cm-logo2 { display: flex; margin-bottom: 40px; }
.cm-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.cm-step { display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 10px; }
.cm-step:has(.cm-subs) { align-items: flex-start; }
.cm-step.is-on { background: var(--kr-white); filter: drop-shadow(1px 2px 5px rgba(0, 0, 0, .1)); }
.cm-step > div { display: flex; flex-direction: column; min-width: 0; }
.cm-step b { font: 500 14px/20px var(--font-sans); }
.cm-step > div > span { font: 400 12px/18px var(--font-sans); color: var(--kr-grey-80); }
.cm-num { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border: 2px solid var(--kr-grey-100); border-radius: 99px; font: 500 12px/20px var(--font-sans); }
.cm-num.is-done { border-color: #05af49; color: #05af49; }
.cm-subs { list-style: none; margin: 0; padding: 0; }
.cm-subs li { display: flex; gap: 4px; align-items: center; font: 400 12px/18px var(--font-sans); color: var(--kr-grey-80); }
.cm-subs li > i { width: 16px; height: 16px; flex: none; }
.cm-back { margin-top: auto; align-self: flex-start; display: inline-flex; gap: 10px; align-items: center; padding: 9px 24px; border: 1px solid var(--kr-grey-100); border-radius: 10px; background: none; color: var(--kr-grey-100); font: 500 14px/20px var(--font-sans); cursor: pointer; }
.cm-back:hover { background: rgba(0, 0, 0, .04); }

/* ---------- Route screens ----------
   Product screens recreated from screenshots. Each has its own URL (#/dashboard/create-ai-resume/)
   and a link under More options › URLs. They are full screens like the rest of the flow (logo bar,
   page background, content from the same top line), never pop-ups over another screen.
   Sizes and colours inside them are measured from the 2x screenshots, so they don't follow the
   onboarding's height-aware spacing. */
.rt-item { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; }
/* A route screen in a flow (setup, tailoring, upload) has the onboarding screens' headline and subheadline
   (route.head), so its card starts where their content does and nothing jumps between the screens */
#screen-route > .rt-head:not([hidden]) + .rt-item { margin-top: var(--sp-section); }

/* Create Resume with AI (/dashboard/create-ai-resume/) */
.aim {
  --aim-grad: var(--kr-ai-grad);
  /* same surface as the goal and method cards (thin grey outline, 16px corners, no resting shadow);
     the padding takes the 1px outline into account, so everything inside sits where the screenshot has it */
  width: 454px; max-width: 100%; padding: 31px 47px; border: 1px solid var(--kr-grey-60); border-radius: var(--radius-card);
  background: var(--kr-white); color: var(--kr-grey-100);
  font-size: 14px; line-height: 20px; letter-spacing: 0; outline: none;
}
.aim h1 { margin: 0 0 16px; font-size: 24px; line-height: 28px; font-weight: 500; letter-spacing: 0; }
.aim-ic { flex: none; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
/* Basic / Personalized: one grey outline; the chosen half gets a gradient outline on top of it */
.aim-tabs { display: grid; grid-template-columns: 1fr 1fr; height: 34px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--kr-grey-60); }
.aim-tab {
  display: flex; align-items: center; justify-content: center; gap: 4px; min-width: 0; padding: 0 8px;
  border: 1px solid transparent; border-radius: 8px; background: none; color: var(--kr-grey-100); cursor: pointer;
  font-size: 14px; line-height: 20px; white-space: nowrap;
}
.aim-tab[aria-pressed="true"] { background: linear-gradient(var(--kr-white), var(--kr-white)) padding-box, var(--aim-grad) border-box; cursor: default; }
.aim-tab[aria-pressed="true"] .aim-ic { color: #5345ff; }
.aim-tab[aria-pressed="true"] span { background: var(--aim-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.aim-tab[aria-pressed="false"]:hover { color: var(--kr-grey-80); }
.aim-tab:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.aim-desc { margin: 16px 0; font-size: 16px; line-height: 24px; color: var(--kr-grey-80); }
.aim-field { display: grid; gap: 6px; }
.aim-field + .aim-field { margin-top: 16px; }
.aim-field label { font-size: 12px; line-height: 18px; }
.aim-input {
  width: 100%; height: 40px; padding: 0 8px; border: 1px solid var(--kr-grey-60); border-radius: 6px; outline: none;
  background: var(--kr-white); color: var(--kr-grey-100); font-size: 14px; letter-spacing: 0; transition: border-color .15s;
}
.aim-input:hover { border-color: var(--kr-grey-80); }
.aim-input:focus { border-color: var(--kr-blue); }
.aim-ta { display: block; height: 164px; padding: 8px; line-height: 20px; resize: none; }
.aim-count { text-align: right; color: var(--kr-grey-80); }
.aim-foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 24px; }
.aim-lang-wrap { position: relative; }
.aim-lang, .aim-go { height: 40px; border-radius: 8px; font-size: 14px; line-height: 20px; letter-spacing: 0; cursor: pointer; }
.aim-lang {
  width: 160px; display: flex; align-items: center; gap: 8px; padding: 0 13px; text-align: left;
  border: 1px solid var(--kr-grey-60); background: var(--kr-white); color: var(--kr-grey-100); transition: border-color .15s;
}
.aim-lang:hover, .aim-lang[aria-expanded="true"] { border-color: var(--kr-grey-80); }
.aim-lang .val { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aim-lang .aim-ic:last-child { transition: transform var(--dur-fast) var(--ease-standard); }
.aim-lang[aria-expanded="true"] .aim-ic:last-child { transform: rotate(180deg); }
.aim-menu {
  position: absolute; left: 0; bottom: calc(100% + 4px); z-index: 1; min-width: 100%; max-height: 244px; overflow-y: auto;
  margin: 0; padding: 4px; list-style: none; background: var(--kr-white); border-radius: 8px; box-shadow: var(--kr-shadow-dropdown);
  scrollbar-width: thin; scrollbar-color: var(--kr-grey-60) transparent;
}
.aim-opt {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 6px 8px; border: 0; border-radius: 6px;
  background: none; color: var(--kr-grey-100); font-size: 14px; line-height: 20px; letter-spacing: 0; text-align: left; white-space: nowrap; cursor: pointer;
}
.aim-opt:hover, .aim-opt:focus-visible { background: var(--kr-grey-40); outline: none; }
.aim-opt .aim-ic { visibility: hidden; color: var(--kr-blue); }
.aim-opt[aria-selected="true"] .aim-ic { visibility: visible; }
.aim-go {
  width: 150px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px;
  border: 0; background: var(--kr-ai-grad); color: var(--kr-white); font-weight: 500; white-space: nowrap; transition: filter .2s;
}
.aim-go:hover:not(:disabled) { filter: brightness(1.07); }
.aim-go:active:not(:disabled) { filter: brightness(.93); }
.aim-go:disabled { background: var(--kr-ai-disabled); cursor: not-allowed; }
.aim-go .spin { width: 18px; height: 18px; animation: spin .8s linear infinite; }
.aim-go:focus-visible, .aim-lang:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
/* Narrow screens (phone): tighter padding; language and button share the full width */
@container (max-width: 520px) {
  .aim { padding: 27px 19px 23px; }
  .aim-foot { flex-direction: column; align-items: stretch; gap: 12px; }
  .aim-lang, .aim-go { width: 100%; }
}

/* Shared pieces of the recreated screens. The AI purple is measured from the screenshots and
   converted from the Mac's display colours to sRGB (the screenshots carry a display-P3 profile). */
:root { --kr-ai-grad: linear-gradient(to bottom right, #5345ff, #9b3eff); --kr-ai-disabled: #c1bff7; --kr-ai-badge: #4e4ee3; --aim-grad: var(--kr-ai-grad); }

  border-radius: var(--radius-card); color: var(--kr-grey-100); font-size: 14px; line-height: 20px; letter-spacing: 0;
}
.rt-card h1 { margin: 0; font-weight: 500; letter-spacing: 0; }

.rt-btn {

}
.rt-ai { background: var(--kr-ai-grad); color: var(--kr-white); }
.rt-ai:hover:not(:disabled) { filter: brightness(1.07); }

.rt-coral:disabled { background: var(--kr-primary-light); cursor: not-allowed; }
.rt-ghost { background: none; color: var(--kr-grey-100); }
.rt-ghost:hover { background: var(--kr-grey-40); }
.rt-btn:focus-visible, .rt-x:focus-visible, .aig-chip:focus-visible, .seg3 button:focus-visible, .sel-item:focus-visible, .upl-drop:focus-visible, .aiw-paste:focus-visible, .lki-paste:focus-visible, .trl-opt:focus-visible, .trl-switch:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.rt-btn .spin { width: 18px; height: 18px; animation: spin .8s linear infinite; }
.rt-step { margin: 16px 0 0; text-align: center; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--kr-grey-80); }
.rt-info { display: flex; align-items: center; gap: 8px; border-radius: 8px; background: var(--kr-background); font-size: 14px; line-height: 20px; }
.rt-info .rt-ic { width: 24px; height: 24px; }
.is-error { border-color: var(--kr-primary) !important; }

/* Generate work experience / resume objective (/ai/resume/…): measured from 2x-ish screenshots at 1.3x */
.aig { --w: 820px; padding: 55px 46px 45px; }
/* the section writers pop up over Fill In (the user's rule for them): the same card, on a dimmed editor */
.wr-pop { position: fixed; inset: 0; z-index: 18; display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.wr-back { position: fixed; inset: 0; background: rgba(13, 18, 38, .45); }
.wr-box { position: relative; width: min(820px, 100%); }
.wr-box .aig { width: 100%; border-color: transparent; box-shadow: var(--kr-shadow-modal); }
.wr-box .aig-head { padding-right: 40px; }
.su-box { width: min(440px, 100%); padding: 32px; border-radius: var(--radius-card); background: #fff; box-shadow: var(--kr-shadow-modal); }
.su-box h2 { margin: 0 40px 8px 0; font: 600 24px/32px var(--font-display); color: var(--kr-grey-100); }
.su-box p { margin: 0 0 24px; font-size: 16px; line-height: 24px; color: var(--kr-grey-100); }
.su-foot { display: flex; justify-content: flex-end; gap: 12px; }
.wr-x { position: absolute; top: 16px; right: 16px; display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 10px; background: none; color: var(--kr-grey-100); cursor: pointer; }
.wr-x:hover { background: var(--kr-grey-20); }
.wr-x:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.wr-x svg { width: 20px; height: 20px; }
.aig-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.aig h1 { font-size: 28px; line-height: 40px; }
.aig .aim-lang { width: 185px; padding: 0 16px; gap: 9px; border-radius: 10px; font-size: 16px; }
.aig .aim-lang .aim-ic:first-child { width: 24px; height: 24px; }
.aig .aim-menu { top: calc(100% + 4px); bottom: auto; }
.aig-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 19px; margin-top: 28px; }
.aig-fields.is-one { grid-template-columns: minmax(0, 1fr); }
.aig-field label, .aig-l { display: block; margin-bottom: 8px; font-size: 14px; line-height: 20px; }
.aig-input {
  display: block; width: 100%; height: 40px; padding: 0 10px; border: 1px solid var(--kr-grey-60); border-radius: 4px; outline: none;
  background: var(--kr-white); color: var(--kr-grey-100); font-size: 16px; letter-spacing: 0; transition: border-color .15s;
}
.aig-input::placeholder { color: var(--kr-grey-80); }
.aig-input:hover { border-color: var(--kr-grey-80); }
.aig-input:focus { border-color: var(--kr-blue); }
.aig-opts { display: grid; grid-template-columns: minmax(0, 374fr) minmax(0, 335fr); gap: 17px; margin-top: 28px; }
.aig-chips { display: flex; gap: 8px; }
.aig-chip {
  position: relative; flex: 0 0 48px; min-width: 48px; height: 48px; padding: 0; border: 1px solid var(--kr-grey-60); border-radius: 12px;
  background: var(--kr-white); color: var(--kr-grey-100); cursor: pointer;
  transition: flex-grow var(--dur-base) var(--ease-standard), background-color var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast);
}
.aig-chip:hover:not([aria-checked="true"]) { border-color: var(--kr-grey-80); }
.aig-in { display: flex; align-items: center; justify-content: center; gap: 8px; height: 100%; overflow: hidden; border-radius: inherit; font-size: 16px; line-height: 20px; font-weight: 500; white-space: nowrap; }
.aig-chip .rt-ic { width: 28px; height: 28px; }
.aig-chip .lbl { display: none; }
.aig-chip[aria-checked="true"] { flex-grow: 1; background: var(--kr-grey-100); border-color: var(--kr-grey-100); color: var(--kr-white); cursor: default; }
.aig-chip[aria-checked="true"] .lbl { display: inline; }
.aig-rec {
  position: absolute; left: 0; top: 34px; display: none; height: 20px; padding: 0 10px; border-radius: 10px;
  background: var(--kr-ai-badge); color: var(--kr-white); font-size: 14px; line-height: 20px; font-weight: 400; white-space: nowrap; pointer-events: none;
}
.aig-chip[aria-checked="true"] .aig-rec { display: block; }
.aig-foot { display: flex; justify-content: flex-end; margin-top: 27px; }
.aig-go { height: 48px; padding: 0 34px; border-radius: 12px; font-size: 16px; }

/* AI writers with Basic / Personalized tabs: cover letter (454) and interview questions (424) */
.aiw { --w: 454px; padding: 27px 47px 31px; }
.aiw h1 { margin-bottom: 16px; font-size: 24px; line-height: 32px; }
.aiw .aim-field label, .aiw-l { display: block; font-size: 14px; line-height: 18px; }
.aiw .aim-input { height: 38px; }
.aiw .aim-ta { height: 164px; }
.aiw .aim-count { font-size: 12px; line-height: 14px; }
.aiw .aim-foot { margin-top: 26px; }
.aiw .aim-lang { width: 121px; }
.aiw[data-mode="personalized"] .aim-lang { width: 150px; }
.aiw-go { width: 144px; }
.aiw-next { width: 96px; }
.ivw { --w: 424px; }
.ivw .aim-foot { justify-content: flex-end; margin-top: 21px; }
.ivw[data-mode="personalized"] .aim-foot { margin-top: 26px; }
.ivw-go { width: 176px; }
.aiw-ta { position: relative; }
.aiw-ta .aim-ta { padding-bottom: 46px; }
.aiw-paste {
  position: absolute; left: 8px; bottom: 8px; display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 16px 0 12px;
  border: 1px solid var(--kr-grey-100); border-radius: 10px; background: var(--kr-white); color: var(--kr-grey-100);
  font-size: 14px; line-height: 20px; font-weight: 500; cursor: pointer;
}
.aiw-paste .rt-ic { width: 20px; height: 20px; }
.aiw-paste:hover { background: var(--kr-grey-40); }
.seg3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 40px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--kr-grey-60); }
.seg3 button { border: 2px solid transparent; background: none; color: var(--kr-grey-80); font-size: 14px; line-height: 20px; letter-spacing: 0; cursor: pointer; }
.seg3 button:first-child { border-radius: 8px 0 0 8px; }
.seg3 button:last-child { border-radius: 0 8px 8px 0; }
.seg3 button:hover { color: var(--kr-grey-100); }
.seg3 button[aria-checked="true"] { border-color: var(--kr-grey-100); color: var(--kr-grey-100); }

/* Select your resume (step 2 of the personalized writers) */
.sel { padding: 31px 0 31px 47px; overflow: hidden; }
.sel h1, .sel .rt-step, .sel-foot { padding-right: 48px; }
.sel h1 { font-size: 24px; line-height: 28px; }
.sel-sub { margin: 16px 0 0; max-width: 331px; font-size: 16px; line-height: 24px; color: var(--kr-grey-80); }
.sel-row {
  display: flex; gap: 16px; margin-top: 10px; padding: 6px 48px 10px 0; overflow-x: auto; scroll-snap-type: x proximity;
  scrollbar-width: thin; scrollbar-color: #8f8f8f transparent;
}
.sel-row::-webkit-scrollbar { height: 6px; }
.sel-row::-webkit-scrollbar-thumb { background: #8f8f8f; border-radius: 3px; }
.sel-row::-webkit-scrollbar-track { background: transparent; margin: 0 48px 0 2px; }
.sel-item {
  flex: none; width: 180px; height: 258px; display: grid; grid-template-rows: minmax(0, 1fr) auto; padding: 0; border: 2px solid transparent;
  border-radius: 14px; background: var(--kr-white); box-shadow: 0 2px 10px rgba(0, 0, 0, .1); overflow: hidden; cursor: pointer; text-align: left;
  color: var(--kr-grey-100); scroll-snap-align: start; transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
}
.sel-item[aria-checked="true"] { border-color: var(--kr-primary); box-shadow: none; }
.sel-name { padding: 6px 8px 10px; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sel .rt-step { margin-top: 16px; }
.sel-foot { display: flex; justify-content: flex-end; gap: 16px; margin-top: 26px; }
.sel-back { width: 88px; }
.sel-go { width: 144px; }
/* the two resume previews are drawn with boxes and lines (not pictures), sized to the thumbnail */
.rsm { position: relative; display: block; overflow: hidden; background: var(--kr-white); container-type: inline-size; }
.rsm i, .rsm b { position: absolute; display: block; }
.rsm i { border-radius: 99px; }
.rsm b { font-weight: 600; color: #1f1f1f; white-space: nowrap; line-height: 1; }

/* Upload your resume (start, error, uploading) */
.upl { padding: 27px 35px 27px; }
.upl h1 { display: flex; align-items: center; gap: 12px; font-size: 20px; line-height: 28px; }
.upl-drop {
  margin-top: 28px; height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px;
  border: 2px dashed var(--kr-primary); border-radius: 8px; color: var(--kr-primary); cursor: pointer; transition: background-color var(--dur-fast);
}
.upl-drop:hover, .upl-drop.is-over { background: var(--kr-primary-tint); }
.upl-drop .rt-ic { width: 76px; height: 76px; stroke-width: 1.2; }
.upl-hint { margin: 28px 0 0; text-align: center; font-size: 16px; line-height: 24px; color: var(--kr-grey-80); }
.upl-drop .upl-hint { margin: 0; }
.upl-alert { margin-top: 28px; min-height: 60px; padding: 10px 12px 10px 10px; background: var(--kr-primary-light); }
.upl-foot { display: flex; justify-content: flex-end; gap: 16px; margin-top: 28px; }
.upl-foot .rt-btn { width: 129px; height: 38px; border-radius: 4px; font-size: 16px; }

/* The upload modal (Figma Kickresume 3.0 › 62245:57072): 393px wide with 24/32 padding (1px less for the outline);
   its loader is Figma's icon, turned in eight steps */
.upm-slot { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; margin-top: var(--sp-section); }
.upm { --w: 393px; display: flex; flex-direction: column; align-items: flex-end; gap: 24px; padding: 23px 31px; }
.upm-head { display: flex; flex-direction: column; gap: 16px; align-self: stretch; }
.upm[data-state="run"] .upm-foot { display: none; }  /* loading shows no Continue: only the final state does (the user's rule) */
.upm[data-state="fail"] .upm-head { gap: 24px; }
.upm-h { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 18px; line-height: 24px; font-weight: 500; letter-spacing: 0; }
.upm-spin { flex: none; width: 24px; height: 24px; animation: upm-turn 1s steps(8) infinite; }
.upm:not([data-state="run"]) .upm-spin { display: none; }
@keyframes upm-turn { to { transform: rotate(360deg); } }
.upm-info { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 10px; background: var(--kr-background); font-size: 12px; line-height: 18px; }
.upm-info svg { flex: none; width: 20px; height: 20px; }
.upm-info.is-err { background: var(--kr-primary-light); }
.upm-pic { display: block; align-self: stretch; width: 100%; height: auto; aspect-ratio: 329 / 175; border-radius: 10px; }
.upm-line { margin: 0; align-self: stretch; }
.upm[data-state="fail"] .upm-line { display: none; }
.upm-foot { display: flex; gap: 16px; }
.upm-foot .rt-btn { height: 34px; padding: 0 32px; border-radius: 10px; }
.upm-foot .rt-ghost { border-radius: 4px; }

/* LinkedIn import (/dashboard/linkedin-import/) */
.lki { padding: 25px 35px 25px; }
.lki h1 { font-size: 20px; line-height: 28px; }
.lki .rt-info { margin-top: 27px; min-height: 58px; padding: 9px 8px 9px 9px; }
.lki-field {
  position: relative; display: flex; align-items: center; height: 42px; margin-top: 69px; padding: 0 5px 0 9px;
  border: 1px solid var(--kr-grey-60); border-radius: 6px; font-size: 16px; transition: border-color .15s;
}
.lki-field:hover { border-color: var(--kr-grey-80); }
.lki-field:focus-within { border-color: var(--kr-blue); }
.lki-pre { color: var(--kr-grey-80); white-space: nowrap; }
.lki-field input { flex: 1; min-width: 0; height: 100%; margin-left: 8px; border: 0; outline: none; background: none; color: var(--kr-grey-100); font-size: 16px; letter-spacing: 0; }
.lki-paste { display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 6px; background: none; color: var(--kr-grey-100); cursor: pointer; }
.lki-paste:hover { background: var(--kr-grey-40); }
.lki-paste .rt-ic { width: 24px; height: 24px; stroke-width: 1.75; }
.lki-err { position: absolute; left: 0; top: calc(100% + 6px); margin: 0; font-size: 12px; line-height: 16px; color: var(--kr-primary); }
.lki-foot { display: flex; justify-content: flex-end; gap: 16px; margin-top: 28px; }
.lki-foot .rt-btn { width: 136px; height: 38px; border-radius: 10px; font-size: 16px; }

/* Resignation letter (/ai/resignation/) */
.rsg { --w: 500px; padding: 31px 47px 31px; }
.rsg h1 { font-size: 24px; line-height: 28px; }
.rsg-sub { margin: 16px 0 0; font-size: 16px; line-height: 24px; color: var(--kr-grey-80); }
.rsg .aim-field { margin-top: 16px; }
.rsg .aim-foot { margin-top: 48px; }
.rsg-go { width: 140px; }


/* Narrow screens (phone) */
@container (max-width: 860px) {
  .aig { padding: 27px 19px 23px; }
  .aig-head { flex-wrap: wrap; padding-right: 36px; }
  .aig h1 { font-size: 24px; line-height: 32px; }
  .aig-fields, .aig-opts { grid-template-columns: minmax(0, 1fr); }
  .aig-opts { gap: 20px; }
}
@container (max-width: 520px) {
  .aiw, .rsg { padding: 27px 19px 23px; }
  .upl, .lki { padding: 23px 19px; }
  .sel { padding: 27px 0 23px 19px; }
  .sel h1, .sel .rt-step, .sel-foot { padding-right: 20px; }
  .sel-row { padding-right: 20px; }
  .aiw .aim-lang, .rsg .aim-lang { width: 100%; }
  .aiw .rt-btn, .rsg .rt-btn { width: 100%; }
  .lki-foot .rt-btn, .upl-foot .rt-btn { width: auto; flex: 1; }
  .lki-field { margin-top: 40px; }
}

/* ---------- Tailor your resume to a job (/dashboard/tailor-resume/, /jobs/job/{id}/tailor/) ----------
   From Figma (Kickresume 3.0 › 61899:29481): the job post as a URL, typed in by hand, or the job a job page
   passed on; then the tailoring level. The card keeps one height on wider screens, so switching between the URL
   and the manual view doesn't move it. Phones stack the fields and name only the picked level. */
.trl { --w: 600px; display: flex; flex-direction: column; gap: 16px; min-height: 520px; padding: 23px 31px; }
.trl h1 { font-size: 18px; line-height: 24px; }
.trl-main { flex: 1; display: flex; flex-direction: column; }
.trl[data-mode="manual"] .trl-main { gap: 16px; }
.trl-body { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; }
.trl-top, .trl-fields { display: flex; flex-direction: column; gap: 16px; }
.trl-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.trl-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.trl-field label, .trl-l { font-size: 12px; line-height: 18px; }
.trl-input {
  display: block; width: 100%; height: 36px; padding: 0 9px; border: 1px solid var(--kr-grey-60); border-radius: 4px; outline: none;
  background: var(--kr-white); color: var(--kr-grey-100); font-size: 14px; line-height: 20px; transition: border-color .15s;
}
.trl-input:hover { border-color: var(--kr-grey-80); }
.trl-input:focus { border-color: var(--kr-blue); }
.trl-ta { height: 112px; padding: 7px 9px; resize: none; }
.trl-count { font-size: 12px; line-height: 18px; color: var(--kr-grey-80); text-align: right; }
/* the job from a job page */
.trl-job {
  display: grid; grid-template-columns: 40px minmax(0, 1fr); grid-template-areas: "logo title" "logo company" "logo meta"; align-items: start;
  gap: 4px 16px; padding: 15px; border: 1px solid var(--kr-grey-40); border-radius: 16px; background: var(--kr-white);
}
.trl-job img { grid-area: logo; display: block; width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
.trl-job b { grid-area: title; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; line-height: 24px; font-weight: 500; }
.trl-job-co { grid-area: company; font-size: 14px; line-height: 20px; }
.trl-meta { grid-area: meta; display: flex; flex-wrap: wrap; gap: 4px 8px; }
.trl-meta span { display: inline-flex; align-items: center; gap: 4px; padding: 2px; font-size: 12px; line-height: 18px; color: var(--kr-grey-80); white-space: nowrap; }
.trl-meta svg { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.33333; stroke-linecap: round; stroke-linejoin: round; }
/* Tailoring level: three choices, the picked one filled dark; its description underneath */
.trl-level { display: flex; flex-direction: column; gap: 4px; }
.trl-seg { display: flex; gap: 8px; }
.trl-opt {
  flex: 1 1 0; min-width: 0; height: 40px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 7px; overflow: hidden;
  border: 1px solid var(--kr-grey-60); border-radius: 10px; background: var(--kr-white); color: var(--kr-grey-100);
  font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; cursor: pointer;
  transition: background-color var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast), flex-grow var(--dur-base) var(--ease-standard);
}
.trl-opt[data-level="conservative"] { gap: 4px; }
.trl-opt .rt-ic { width: 24px; height: 24px; }
.trl-opt:hover:not([aria-checked="true"]) { border-color: var(--kr-grey-80); }
.trl-opt[aria-checked="true"] { background: var(--kr-grey-100); border-color: var(--kr-grey-100); color: var(--kr-white); cursor: default; }
.trl-desc { margin: 0; font-size: 14px; line-height: 20px; color: var(--kr-grey-80); }
.trl-switch {
  align-self: flex-start; padding: 0; border: 0; border-radius: 2px; background: none; color: var(--kr-grey-100);
  font-size: 14px; line-height: 20px; text-decoration: underline; text-underline-position: from-font; cursor: pointer;
}
.trl-switch:hover { color: var(--kr-grey-80); }
.trl[data-mode="job"] { min-height: 0; }  /* the product's job modal is compact: its buttons sit under the levels */
.trl[data-mode="job"] .trl-switch { display: none; }
.trl[data-mode="job"] .trl-foot { margin-top: 12px; }
.trl-foot { display: flex; justify-content: flex-end; gap: 8px; }
.trl-cancel { padding: 0 32px; border-radius: 10px; }  /* the job version, as in the product: Cancel back to the job page */
.trl-go, .trl-go:disabled { padding: 0 32px; border-radius: 10px; background: linear-gradient(163.5deg, #5345ff, #9c3eff); }
.trl-go:disabled { opacity: .5; }
@container (max-width: 520px) {
  .trl { min-height: 0; padding: 23px 15px; }
  .trl[data-mode="url"] { min-height: 420px; }
  .trl-main, .trl[data-mode="manual"] .trl-main, .trl-body, .trl-top { gap: 8px; }
  .trl[data-mode="job"] .trl-top { gap: 16px; }
  .trl[data-mode="job"] .trl-switch { display: none; }
  .trl-row { grid-template-columns: minmax(0, 1fr); }
  .trl-ta { height: 143px; }
  /* only the picked level shows its name; the others shrink to their icon */
  .trl-opt { flex: 0 0 40px; padding: 0; }
  .trl-opt[aria-checked="true"] { flex: 1 1 0; padding: 0 7px; }
  .trl-opt:not([aria-checked="true"]) span { display: none; }
  .trl-job { grid-template-areas: "logo title" "logo company" "meta meta"; row-gap: 0; }
  .trl-meta { flex-wrap: nowrap; overflow: hidden; gap: 8px; margin-top: 8px; }
}

/* ---------- Tailoring (after Tailor Now) ----------
   From Figma (Kickresume 3.0 › 61899:29483): four steps, each with its own looping picture and a progress bar that
   fills while it runs (about 30 s each in the product, a few seconds here); then Done! or Something went wrong.
   Trying to leave while it runs shows "Please wait for tailoring to complete." */
.tld { --w: 355px; display: flex; flex-direction: column; gap: 16px; min-height: 374px; padding: 0 0 23px; overflow: hidden; }
.tld-art { position: relative; flex: none; height: 152px; overflow: hidden; background: linear-gradient(#f4f7f8, #9dcad9); }
.tld-pic { position: absolute; left: 50%; top: 24px; width: 242px; height: 172px; margin-left: -121px; overflow: hidden; opacity: 0; transition: opacity var(--dur-base) var(--ease-standard); }
.tld-pic.is-on { opacity: 1; }
/* the resume drawn in boxes, 110 × 152 */
.tld-doc { position: absolute; left: 66px; top: 10px; width: 110px; height: 152px; overflow: hidden; border-radius: 4px; background: var(--kr-white); }
.tld-doc::before { content: ""; position: absolute; inset: 0 0 auto; height: 33px; background: #9bbecc; }
.tld-doc i, .tld-doc u, .tld-doc s { position: absolute; display: block; height: 4px; border-radius: 2px; background: #d9d9d9; }
.tld-doc i.dk { height: 6px; background: #565656; }
.tld-doc u { left: 9px; top: 9px; width: 19px; height: 19px; overflow: hidden; border-radius: 99px; }
.tld-doc u svg { position: absolute; left: 0; bottom: 0; width: 19px; height: 12px; }
.tld-doc s { width: 44px; height: 10px; background: none; }
.tld-doc s::before, .tld-doc s::after { content: ""; position: absolute; left: 0; height: 4px; border-radius: 2px; }
.tld-doc s::before { top: 0; width: 20px; background: #d9d9d9; }
.tld-doc s::after { top: 6px; width: 100%; box-sizing: border-box; border: 1px solid #d9d9d9; background: linear-gradient(90deg, #d9d9d9 var(--fill), transparent 0) border-box; }
/* 1 · Creating a copy: a faded copy slides out from behind the resume, tilts, and slides back */
.tld-pic.p1 { top: 2px; }  /* this one is centred in the header in the design, so it sits higher */
.p1 > .tld-doc { left: 20px; top: 26px; }
.tld-copy { position: absolute; left: 116px; top: 37px; width: 94.08px; height: 130px; opacity: .7; transform: rotate(17.83deg); }
.tld-copy .tld-doc { left: 0; top: 0; transform: scale(.85526); transform-origin: 0 0; }
.p1.is-on .tld-copy { animation: tld-copy 2s cubic-bezier(.5, 0, .5, 1) infinite; }
@keyframes tld-copy {
  0%, 100% { opacity: 0; transform: translate(-86.57px, -7.71px) rotate(.37deg); }
  33.89%, 66.45% { opacity: .7; transform: rotate(17.83deg); }
}
/* 2 · Scanning: a glowing line sweeps up the resume with a violet glow under it */
.tld-glow { position: absolute; left: 66px; top: 82px; width: 110px; height: 40px; background: linear-gradient(rgba(83, 69, 255, .5), rgba(50, 41, 153, 0)); }
.tld-line { position: absolute; left: 22px; top: 66px; width: 197px; height: 30px; }
.p2.is-on .tld-glow { animation: tld-glow 2s linear infinite; }
.p2.is-on .tld-line { animation: tld-line 2s linear infinite; }
@keyframes tld-glow {
  0% { transform: translateY(90px); }
  40% { transform: translateY(-72px); }
  60.9% { transform: translateY(-72px); animation-timing-function: cubic-bezier(.5, 0, .5, 1); }
  71% { transform: translateY(-72px) scaleY(-1); }
  100% { transform: translateY(39px) scaleY(-1); }
}
@keyframes tld-line { 0% { transform: translateY(90px); } 40%, 60.9% { transform: translateY(-72px); } 100% { transform: translateY(80px); } }
/* 3 · Tailoring: keywords fly in and the resume's lines rearrange */
.tld-kw { position: absolute; width: 47px; height: 13px; border-radius: 3px; background: #e4e4e4; }
.tld-kw::before { content: ""; position: absolute; left: 4px; top: 2.5px; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.p3.is-on .tld-kw { animation: tld-kw 2s linear infinite; }
@keyframes tld-kw {
  0% { transform: none; animation-timing-function: ease-in; }
  25.25%, 63% { transform: translate(var(--x1), var(--y1)); }
  81.55%, 100% { transform: translate(var(--x2), var(--y2)); }
}
.p3.is-on .tld-doc [data-a] { animation: 2s linear infinite; }
.p3.is-on .tld-doc [data-a="1"] { animation-name: tld-a1; }
.p3.is-on .tld-doc [data-a="2"] { animation-name: tld-a2; }
.p3.is-on .tld-doc [data-a="3"] { animation-name: tld-a3; }
.p3.is-on .tld-doc [data-a="4"] { animation-name: tld-a4; }
.p3.is-on .tld-doc [data-a="5"] { animation-name: tld-a5; }
.p3.is-on .tld-doc [data-a="6"] { animation-name: tld-a6; }
.p3.is-on .tld-doc [data-a="7"] { animation-name: tld-a7; }
.p3.is-on .tld-doc [data-a="8"] { animation-name: tld-a8; }
.p3.is-on .tld-doc [data-a="9"] { animation-name: tld-a9; }
@keyframes tld-a1 { 0%, 12.75%, 100% { width: 92px; } 34.49%, 74.62% { width: 76px; } }
@keyframes tld-a2 { 0% { width: 71px; } 25.25%, 43.77% { width: 53px; } 74.62% { width: 93px; } 100% { width: 92px; } }
@keyframes tld-a3 { 0%, 100% { width: 25px; } 24.43%, 61.69% { width: 32px; } }
@keyframes tld-a4 { 0%, 100% { width: 44px; } 36.08%, 74.62% { width: 11px; } }
@keyframes tld-a5 { 0%, 100% { width: 44px; } 24.43%, 61.69% { width: 32px; } }
@keyframes tld-a6 { 0%, 100% { width: 44px; } 24.43%, 43.77% { width: 22px; } }
@keyframes tld-a7 { 0%, 100% { width: 44px; } 24.43%, 61.69% { width: 37px; } }
@keyframes tld-a8 { 0%, 100% { transform: translateX(48px); } 24.43%, 43.77% { transform: none; } }
@keyframes tld-a9 { 0%, 100% { transform: translateX(-48px); } 24.43%, 61.69% { transform: none; } }
/* 4 · Finishing up: the templates the person can switch to, sliding by */
.tld-track { position: absolute; inset: 0; }
.tld-track img { position: absolute; top: 10px; width: 111px; height: 152px; border-radius: 4px; object-fit: cover; box-shadow: 1.8px 3.6px 9px rgba(0, 0, 0, .1); }
.p4.is-on .tld-track { animation: tld-track 7s linear infinite; }
@keyframes tld-track {
  0% { transform: none; }
  3.57%, 32.14% { transform: translateX(-190px); }
  35.71%, 59.86% { transform: translateX(-381px); }
  64.29%, 82.29% { transform: translateX(-572px); }
  85.71%, 100% { transform: translateX(-763px); }
}
.tld[data-state="done"] .tld-track, .tld[data-state="error"] .tld-track { animation: none; }
.tld-x.rt-x { top: 16px; right: 16px; }
.tld-bars { display: flex; gap: 4px; padding: 0 16px; }
.tld-bar { flex: 1 1 0; height: 4px; overflow: hidden; border-radius: 100px; background: var(--kr-grey-60); }
.tld-bar i { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--kr-blue); }
.tld-bar.is-done i { width: 100%; }
.tld[data-state="error"] .tld-bar:not(:first-child) { display: none; }
.tld[data-state="error"] .tld-bar i { width: 100%; background: var(--kr-primary); }
.tld-body { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; padding: 0 16px; }
.tld-text { padding: 0 24px; }
.tld-text h2 { margin: 0 0 4px; font-size: 18px; line-height: 24px; font-weight: 500; }
.tld-text p { margin: 0; color: var(--kr-grey-80); }
.tld-foot { display: flex; justify-content: flex-end; }
.tld-btn { height: 34px; padding: 0 32px; border-radius: 10px; }
.tld-wait { min-width: 126px; border: 2px solid #5345ff; background: none; cursor: progress; }
.tld-wait svg { width: 20px; height: 20px; margin: 4px; animation: spin 1s steps(8) infinite; }
.tld-retry { padding: 0 32px; }
.tld-go { background: linear-gradient(164.9deg, #5345ff, #9c3eff); }
.tld-note {
  position: absolute; left: 50%; top: 15px; z-index: 1; padding: 8px 16px; border-radius: 99px; background: var(--kr-grey-100); color: var(--kr-white);
  font-size: 14px; line-height: 20px; white-space: nowrap; box-shadow: var(--kr-shadow-dropdown); transform: translateX(-50%); pointer-events: none;
  opacity: 0; transition: opacity var(--dur-base) var(--ease-standard);
}
.tld-note.is-on { opacity: 1; }
@media (prefers-reduced-motion: reduce) {
  .tld-pic.is-on *, .tld-wait svg { animation: none !important; }
}

/* ---------- Sign up and Log in (/register/, /login/) ----------
   Recreated from the product. Full pages of their own (a photo column, their own top bar), so like the
   dashboard they replace the logo bar and the page. Sizes are the product's at a 2560px-wide window. */
body[data-screen="auth"] .stage { padding-right: 0; }  /* the page runs to the window's edge, under the side rail */
/* the version tag moves up to the photo's top-left corner, clear of the caption and the flow bar */
@media (min-width: 916px) { body[data-screen="auth"]:not(.is-mobile) .proto-ver { top: calc(12px + env(safe-area-inset-top, 0px)); bottom: auto; } }
.auth { margin-inline: -16px; min-height: calc(var(--vh) * 100); display: grid; grid-template-columns: 400px minmax(0, 1fr); background: var(--kr-grey-20); color: var(--kr-grey-100); }
.au-side { position: sticky; top: 0; height: calc(var(--vh) * 100); overflow: hidden; background: #292929; }
.au-slide { position: absolute; inset: 0; margin: 0; opacity: 0; transition: opacity var(--dur-slow) var(--ease-inout); }
.au-slide.is-on { opacity: 1; z-index: 2; }
.au-slide.is-under { opacity: 1; z-index: 1; transition: none; }
.au-slide img { display: block; width: 100%; height: 100%; object-fit: cover; }
.au-slide figcaption { position: absolute; left: 0; right: 0; bottom: 0; height: 96px; padding: 20px 6px 0 0; background: rgba(41, 41, 41, .73); color: var(--kr-white); text-align: center; font-size: 14px; line-height: 20px; }
.au-slide figcaption span { display: block; }
.au-dots { position: absolute; z-index: 3; left: 0; right: 6px; bottom: 19px; display: flex; justify-content: center; gap: 24px; }
.au-dot { width: 6px; height: 6px; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .6); }
button.au-dot { cursor: pointer; }
.au-dot.is-on { background: var(--kr-white); }
.au-dot:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(255, 255, 255, .5); }
.au-main { min-width: 0; min-height: calc(var(--vh) * 100); display: grid; grid-template-rows: 68px minmax(0, 1fr); }
.au-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 28px 0 40px; }
.au-logo { display: inline-flex; padding: 0; border: 0; background: none; cursor: pointer; border-radius: var(--radius); }
.au-logo svg { display: block; width: 152px; height: 24px; }
.au-logo:focus-visible, .au-other:focus-visible, .au-btn:focus-visible, .au-forgot:focus-visible, .au-link:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.au-switch { display: flex; align-items: center; gap: 22px; margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; }
.au-other { width: 121px; height: 36px; padding: 0; border: 1px solid var(--kr-primary); border-radius: var(--radius-btn); background: none; color: var(--kr-primary); font: inherit; cursor: pointer; transition: background .2s; }
.au-other:hover { background: var(--kr-primary-tint); }
.au-form { align-self: center; justify-self: center; width: 273px; padding-block: 24px; }
.au-form.is-signup { padding-top: 32px; }  /* where each page's form rests in the product */
.au-form.is-login { padding-bottom: 26px; }
.au-form h1 { margin: 0 0 32.5px; font: 400 32px/40.5px var(--font-display); text-align: center; color: var(--kr-grey-100); }
.au-consent { display: flex; align-items: center; gap: 11px; margin-bottom: 41px; font-size: 12px; line-height: 18px; }
.au-consent input { appearance: none; -webkit-appearance: none; flex: none; width: 16px; height: 16px; margin: 0; border: 1px solid #555; border-radius: 4px; background: var(--kr-white); cursor: pointer; display: grid; place-items: center; }
.au-consent input:checked { border-color: var(--kr-primary); background: var(--kr-primary); }
.au-consent input:checked::after { content: ""; width: 4px; height: 8px; margin-top: -2px; border: solid var(--kr-white); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.au-consent input:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.au-consent.is-error input { border-color: var(--kr-primary); box-shadow: 0 0 0 3px rgba(255, 94, 89, .2); }
.au-consent label { cursor: pointer; }
.au-link { color: inherit; text-decoration: none; border-radius: 2px; }
.au-link:hover { text-decoration: underline; }
.au-btn { display: flex; align-items: center; gap: 16px; width: 100%; height: 48px; margin-bottom: 20px; padding: 0 0 0 42.5px; border: 1px solid transparent; border-radius: var(--radius-btn); font: 400 14px/20px var(--font-sans); cursor: pointer; transition: filter .2s; }
.au-btn:hover { filter: brightness(.94); }
.au-btn:last-child { margin-bottom: 0; }
.au-ic { flex: none; display: grid; place-items: center; width: 24px; height: 24px; }
.au-ic svg { display: block; width: 24px; height: 24px; }
.au-li { background: #0077b5; color: var(--kr-white); }
.au-ap { background: #000; color: var(--kr-white); }
.au-go, .au-em { background: var(--kr-white); border-color: var(--kr-grey-60); color: var(--kr-grey-100); }
.au-fb { background: #0866ff; color: var(--kr-white); }
.au-em { justify-content: center; gap: 10px; padding: 0; }
.au-em svg { flex: none; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.au-or { margin: 0 0 19.5px; font-size: 14px; line-height: 23px; text-align: center; }
.au-input { display: block; width: 100%; height: 48px; margin-bottom: 20px; padding: 0 9px; border: 1px solid var(--kr-grey-60); border-radius: var(--radius); background: var(--kr-white); color: var(--kr-grey-100); font: 400 14px/20px var(--font-sans); outline: none; transition: border-color .15s; }
.au-input::placeholder { color: var(--kr-grey-80); }
.au-input:focus { border-color: var(--kr-blue); }
.au-submit { display: block; width: 100%; height: 48px; padding: 0; border: 0; border-radius: var(--radius-btn); background: var(--kr-primary); color: var(--kr-white); font: 500 14px/20px var(--font-sans); cursor: pointer; transition: background .2s; }
.au-submit:hover { background: var(--kr-primary-hover); }
.au-forgot { display: block; margin: 25.5px auto 0; padding: 0; border: 0; background: none; color: var(--kr-grey-100); font: 500 14px/20px var(--font-sans); cursor: pointer; border-radius: 2px; }
.au-forgot:hover { text-decoration: underline; }
/* narrower windows: no photo column; phones: the button alone in the top bar */
@container (max-width: 900px) { .auth { grid-template-columns: minmax(0, 1fr); } .au-side { display: none; } }
@container (max-width: 560px) { .au-top { gap: 8px; padding-inline: 16px; } .au-q { display: none; } .au-form { width: min(273px, 100%); } }

/* ---------- Upgrade: Premium plans and student verification (/upgrade/…) ----------
   Recreated from Figma (Premium › A, and Kickresume 3.0 › ISIC/ITIC). Purple pages of their own, so like
   Sign up they replace the logo bar and the page (APPS.upgrade). Sizes are Figma's (a 1440px-wide frame);
   the card keeps the design's drop shadow because it sits on the purple, not on the onboarding's page. */
body[data-screen="upgrade"] .stage { padding-right: 0; }  /* the purple runs to the window's edge, under the side rail */
.upg {
  --upg-grad: #5345ff, #9c3eff;
  margin-inline: -16px; min-height: calc(var(--vh) * 100); display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 50px 16px; background: linear-gradient(#4034d7, #7011ba); color: var(--kr-grey-100);
}
.upg.is-student { background: linear-gradient(rgba(0, 0, 0, .1), rgba(0, 0, 0, .1)), linear-gradient(#4034d7, #7011ba); }
body.has-note .upg, body:has(.flow-bar:not([hidden])) .upg { padding-bottom: 148px; }  /* scrolls clear of the flow bar */
/* the content keeps clear of the side rail; from 1162px the centred page already does */
@media (min-width: 481px) and (max-width: 1161px) { body:not(.is-mobile) .upg { padding-right: 68px; } }
.upg-x { position: absolute; top: 8px; right: 8px; z-index: 1; display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 10px; background: none; color: var(--kr-grey-80); cursor: pointer; transition: background .2s; }
.upg-x:hover { background: rgba(0, 0, 0, .04); }
.upg-x svg { display: block; width: 24px; height: 24px; }
.upg button:focus-visible, .upg a:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
/* Premium = more jobs: the billing card (pitch | plans) and the reviews panel under it */
.upg-modal {
  position: relative; display: flex; width: min(1000px, 100%); min-height: 540px; border-radius: 16px; overflow: clip; background: #f3f2fd;
  box-shadow: 206px 299px 145px 0 rgba(0, 0, 0, .01), 116px 168px 123px 0 rgba(0, 0, 0, .05), 52px 75px 91px 0 rgba(0, 0, 0, .09), 13px 19px 50px 0 rgba(0, 0, 0, .1);
}
.upg-pitch { flex: 1 1 530px; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; padding: 48px; background: var(--kr-white); }
.upg-logo { display: block; width: 153px; height: 34px; }
.upg-pitch h1 { margin: 0 0 16px; font: 400 32px/40px var(--font-display); color: var(--kr-grey-100); }
.upg-perks { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: 14px; line-height: 20px; }
.upg-perks li { display: flex; align-items: center; gap: 8px; padding-left: 1px; }
.upg-perks img { flex: none; width: 20px; height: 20px; }
.upg-proof { position: relative; width: min(434px, 100%); height: 119px; }
.upg-hire {
  position: absolute; top: 0; left: 0; display: flex; align-items: center; gap: 8px; padding: 8px 16px;
  border-radius: 8px; background: var(--kr-white); box-shadow: 1px 2px 10px rgba(0, 0, 0, .1); font-size: 12px; line-height: 18px;
}
.upg-hire + .upg-hire { top: 45px; left: auto; right: 0; gap: 9px; }
.upg-hire > img { flex: none; width: 40px; height: 40px; border-radius: 50%; }
.upg-hire p { width: 180px; margin: 0 0 4px; }
.upg-hire b { font-weight: 500; }
.upg-hire p + img { display: block; height: 16px; }
.upg-plans { flex: 0 0 470px; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 17px; padding: 48px; }
.upg-plans h2 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 500; }
.upg-plans h2 + p { height: 24px; margin: 8px 0 0; font-size: 12px; line-height: 18px; color: var(--kr-grey-80); }
.upg-pick { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.upg-plan {
  position: relative; display: flex; align-items: center; gap: 16px; width: calc(100% - 54px); padding: 14px; border: 2px solid transparent; border-radius: 10px;
  background: var(--kr-white); box-shadow: 1px 2px 10px rgba(0, 0, 0, .1); color: var(--kr-grey-100); font: 400 14px/20px var(--font-sans); text-align: left; cursor: pointer;
  transition: width var(--dur-slow) var(--ease-inout), padding var(--dur-slow) var(--ease-inout);
}
.upg-plan[aria-checked="true"] { width: 100%; padding: 22px; cursor: default; }
/* the picked card's 2px border is the Premium gradient (a masked layer, so it can fade in) */
.upg-plan::after {
  content: ""; position: absolute; inset: -2px; padding: 2px; border-radius: inherit; pointer-events: none; opacity: 0;
  background: linear-gradient(165.9deg, var(--upg-grad)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  transition: opacity var(--dur-base) var(--ease-standard);
}
.upg-plan[aria-checked="true"]::after { opacity: 1; }
/* in the design the card's content casts its own faint shadow (the radio's ring, the text) */
.upg-radio, .upg-plan-t { filter: drop-shadow(.91px 1.83px 4.57px rgba(0, 0, 0, .1)); }
.upg-plan[aria-checked="true"] :is(.upg-radio, .upg-plan-t) { filter: drop-shadow(1.06px 2.12px 5.3px rgba(0, 0, 0, .1)); }
/* the radio: a white disc with a grey dot; picked, a little larger with the gradient dot */
.upg-radio { position: relative; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--kr-white); box-shadow: 1px 2px 10px rgba(0, 0, 0, .1); transition: width var(--dur-slow) var(--ease-inout), height var(--dur-slow) var(--ease-inout); }
.upg-radio::before, .upg-radio::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--kr-grey-60); transition: inset var(--dur-slow) var(--ease-inout), opacity var(--dur-base) var(--ease-standard); }
.upg-radio::after { background: linear-gradient(135deg, var(--upg-grad)); opacity: 0; }
.upg-plan[aria-checked="true"] .upg-radio { width: 26px; height: 26px; }
.upg-plan[aria-checked="true"] .upg-radio::before, .upg-plan[aria-checked="true"] .upg-radio::after { inset: 4.33px; }
.upg-plan[aria-checked="true"] .upg-radio::after { opacity: 1; }
.upg-plan-t { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px; }
.upg-plan-t > span:first-child { flex: 1; display: grid; gap: 4px; }
.upg-plan-t b { font-weight: 500; transition: font-size var(--dur-slow) var(--ease-inout), line-height var(--dur-slow) var(--ease-inout); }
.upg-plan[aria-checked="true"] .upg-plan-t b { font-size: 18px; line-height: 24px; }
.upg-plan-t > span:last-child { font-size: 12px; line-height: 18px; color: var(--kr-grey-80); text-align: right; white-space: nowrap; }
.upg-pop {
  position: absolute; z-index: 1; left: -2px; top: -16.83px; height: 30px; padding: 4px 16px; border-radius: 4px 4px 4px 0;
  background: linear-gradient(160.97deg, var(--upg-grad)); box-shadow: 1.06px 2.12px 5.3px rgba(0, 0, 0, .1); color: var(--kr-white); font-size: 15.73px; line-height: 22.47px; font-weight: 500;
}
.upg-safe { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 12px; line-height: 18px; }
.upg-safe svg { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.33; stroke-linecap: round; stroke-linejoin: round; }
.upg-go, .stu-go {
  display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 10px; color: var(--kr-white); font: 500 16px/24px var(--font-sans); cursor: pointer; transition: filter .2s;
}
.upg-go { width: 100%; height: 48px; background: linear-gradient(172.69deg, var(--upg-grad)); }
.upg-go:hover, .stu-go:hover { filter: brightness(1.07); }
.upg-go:active, .stu-go:active { filter: brightness(.93); }
.upg-go svg { width: 20px; height: 20px; }
.upg-cred {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; width: min(1026px, 100%); margin-top: 48px; padding: 48px 52px 48px 48px;

.jb { display: grid; justify-items: center; width: 100%; }

.jobs { margin-inline: -16px; min-height: calc(var(--vh) * 100); display: grid; grid-template-columns: 232px minmax(0, 1fr); align-items: start; color: var(--kr-grey-100); background: var(--kr-white); }

:where(.jobs) :where(button) { font: inherit; color: inherit; }

/* The job page (/jobs/job/{id}/, Figma concepting-KR › 294:3680): the job, Back to Search, and Prepare for this job */

/* Resume rewrite's loading (Figma concepting-KR › 294:5202): In progress… with the sections ticking off, then Resume
   rewrite done! with Continue; a click beside it while it runs asks to wait */

.rw-l { position: relative; display: grid; place-items: center; padding: 24px 32px; background: var(--kr-background); }

.rw-beta { position: absolute; left: 32px; top: 24px; padding: 2px 8px; border-radius: 4px; background: linear-gradient(90deg, #4aa2ff, #0f6df2); color: var(--kr-white); font: 500 10px/16px var(--font-sans); }

.rw-r > p { margin: -9px 0 0; font: 400 14px/20px var(--font-sans); color: var(--kr-grey-80); }

.rw-foot { display: flex; justify-content: flex-end; }
.rw-go { padding: 10px 32px; border: 0; border-radius: 10px; background: var(--kr-primary); color: var(--kr-white); font: 500 14px/20px var(--font-sans); cursor: pointer; }
.rw-go:hover { background: var(--kr-primary-hover); }
.rw-go:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
.rw-wait { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); padding: 8px 16px; border-radius: 4px; background: var(--kr-grey-100); color: var(--kr-white); font: 400 14px/20px var(--font-sans); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity var(--dur-fast); }

/* ---------- Tool pages: ATS checker, Proofreading, Career Coach (/latest-resume/…) ----------
   Recreated from Figma (Kickresume 3.0 › Analytics 4 PREVIEW, Download/share link active - update, AI Counsellor
   one expanded). Each is the resume tool with its own top bar, left menu and the resume preview on the right, so
   they are an app screen too (APPS.tool). Sizes are Figma's (a 1440px-wide frame). In the proofreading design
   the top bar, the Upgrade button and the preview tabs are blurred; they are here too. */
.tl {
  position: relative; display: grid; grid-template-columns: 232px minmax(564px, 1fr) minmax(0, 628px); align-items: start; margin-inline: -16px; min-height: calc(var(--vh) * 100);
  overflow-x: clip; background: var(--kr-background); color: var(--kr-grey-100);
}
body.has-note .tl, body:has(.flow-bar:not([hidden])) .tl { padding-bottom: 108px; }
:where(.tl) :where(button, input) { font: inherit; color: inherit; }
.tl button:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
:where(.tl) :where(p) { margin: 0; }
.tl-sec { scroll-margin: 24px 0; }
:where(.tl) :where(svg) { display: block; flex: none; }
/* the middle column */

.tl-col { display: grid; gap: 24px; width: 490px; max-width: 100%; }

.tl-h { display: flex; align-items: center; gap: 8px; margin: 0; font: 500 24px/28px var(--font-sans); white-space: nowrap; }
.tl-h img { display: block; width: 95px; height: 20px; margin: 0 -3px 0 -2px; }
/* Job Interviews (Figma concepting-KR › 285:361: loading 285:185, questions 285:5): the page spans both right columns */
.is-iq .tl-main { grid-column: 2 / -1; padding: 24px 32px 80px 28px; }
.iq-h { margin-bottom: 24px; }

.iq-row { display: flex; align-items: flex-start; gap: 16px; max-width: 1076px; }
.iq-list { display: flex; flex-direction: column; gap: 24px; flex: none; width: 380px; padding: 24px; border-radius: 20px; background: var(--kr-white); box-shadow: 1px 2px 5px rgba(0, 0, 0, .1); }
