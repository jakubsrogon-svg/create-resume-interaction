/* Layout: one centered 950px content column; creation cards are a 400px stack inside it.
   Single light theme on purpose — it mirrors the Kickresume product surface. */
:root {
  color-scheme: light;
  /* Kickresume design-system tokens */
  --kr-primary: #ff5e59;
  --kr-primary-hover: #ff736e;
  --kr-primary-active: #cd2927;
  --kr-primary-light: #f8aca7;
  --kr-primary-tint: #fff4f3;
  --kr-blue: #514eea;
  --kr-blue-tint: #f3f2fd;
  --kr-blue-dark: #081430;
  --kr-grey-100: #3f3f3f;
  --kr-grey-80: #8c8c8c;
  --kr-grey-60: #e9e9e9;
  --kr-grey-40: #f2f2f2;
  --kr-grey-20: #fafafa;
  --kr-white: #fff;
  --kr-background: #f4f7f8;
  --kr-mint: #1da36e;
  --kr-mint-tint: #edf8f4;
  --kr-beige: #fbefda;
  --kr-yellow: #ffc107;
  --kr-premium-gradient: linear-gradient(315deg, #a066ff 0%, #666cff 100%);
  --kr-grad-hover: linear-gradient(315deg, #b07dff 0%, #7a80ff 100%);
  --kr-grad-press: linear-gradient(315deg, #8f4fee 0%, #5359e6 100%);
  --kr-grad-disabled: #b9b6f5;

  --kr-shadow-dropdown: 1px 2px 10px 0 rgba(0, 0, 0, 0.1);
  --kr-shadow-modal: 1px 2px 20px 0 rgba(0, 0, 0, 0.1);
  --kr-shadow-cv: 0 8px 20px 0 rgba(140, 140, 140, 0.18);
  --kr-focus-ring: 0 0 0 3px rgba(63, 63, 63, 0.35);

  --font-sans: "Graphik Web", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Henk-Work", Georgia, "Times New Roman", serif;

  --content-w: 950px;
  --card-w: 400px;
  --radius: 6px;
  --radius-btn: 10px;
  --radius-card: 16px;
  --ease: cubic-bezier(.4, 0, .2, 1);

  /* Motion scale: three durations, three curves. Close to the system's
     "short and subtle, 0.25s ease-in-out, no bounce" guidance. */
  --dur-fast: 160ms;   /* feedback, exits, fades */
  --dur-base: 260ms;   /* most enters */
  --dur-slow: 380ms;   /* spatial moves, height changes */
  --ease-standard: cubic-bezier(.2, 0, 0, 1);  /* enters, moves */
  --ease-exit: cubic-bezier(.4, 0, 1, 1);      /* leaving */
  --ease-inout: cubic-bezier(.4, 0, .2, 1);    /* size changes */
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; overflow-anchor: none; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 24px;
  letter-spacing: 0.06px;
  color: var(--kr-grey-100);
  background-color: var(--kr-white);
  background-image: linear-gradient(180deg, var(--kr-background) 0%, var(--kr-background) 50%, var(--kr-white) 100%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Device wrapper (desktop = full page, mobile = phone frame) ---------- */
.device { container-type: inline-size; padding-inline: 16px; overflow-anchor: none; }
.statusbar { display: none; }
body.is-mobile { background-image: none; background-color: var(--kr-grey-40); }
body.is-mobile .stage { padding-block: 24px 112px; display: grid; justify-items: center; }
body.is-mobile .device {
  width: 390px; max-width: 100%; height: min(844px, calc(100vh - 136px)); min-height: 560px;
  overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none;
  border: 10px solid var(--kr-blue-dark); border-radius: 48px; box-shadow: var(--kr-shadow-modal);
  background-color: var(--kr-white);
  background-image: linear-gradient(180deg, var(--kr-background) 0%, var(--kr-background) 50%, var(--kr-white) 100%);
  background-attachment: local;
}
body.is-mobile .device::-webkit-scrollbar { display: none; }
body.is-mobile .statusbar {
  display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 5;
  height: 44px; margin-inline: -16px; padding: 4px 28px 0; background: var(--kr-background);
  font-size: 15px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums;
}
.statusbar .notch { width: 104px; height: 28px; border-radius: 999px; background: var(--kr-blue-dark); }
.statusbar .sys { display: flex; gap: 6px; align-items: center; }
.statusbar .bars { display: flex; gap: 2px; align-items: flex-end; height: 11px; }
.statusbar .bars i { width: 3px; background: var(--kr-grey-100); border-radius: 1px; }
.statusbar .batt { width: 24px; height: 11px; border: 1.5px solid var(--kr-grey-100); border-radius: 3px; padding: 1px; }
.statusbar .batt i { display: block; height: 100%; width: 75%; background: var(--kr-grey-100); border-radius: 1px; }
/* On a real phone the frame would not fit, so mobile view just fills the screen */
@media (max-width: 480px) {
  body.is-mobile .stage { padding-block: 0; }
  body.is-mobile .device { width: auto; height: auto; min-height: 0; overflow: visible; border: 0; border-radius: 0; box-shadow: none; }

<script>
(function () {

    chevron: '<path d="m9 18 6-6-6-6"/>',
    arrowLeft: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
    cloud: '<path d="M12 13v8"/><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="m8 17 4-4 4 4"/>',

  const icon = (n, cls) => `<svg class="i${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

  /* ---------- Intent cards ---------- */
  const INTENTS = [

      scene: `<div class="jobs"><div class="job-row"><div class="job-logo" style="background:var(--kr-beige)"></div><div class="stack"><div class="ln dk w80"></div><div class="ln w50"></div></div></div><div class="job-row"><div class="job-logo" style="background:var(--kr-blue-tint)"></div><div class="stack"><div class="ln dk w70"></div><div class="ln w40"></div></div></div><div class="job-row"><div class="job-logo" style="background:var(--kr-mint-tint)"></div><div class="stack"><div class="ln dk w90"></div><div class="ln w60"></div></div></div></div>` },
    { id: 'track', title: 'Track my job apps', desc: 'Keep every job you’re applying to, and its status, in one place.', tone: 't-beige',
      scene: `<div class="board"><div class="col"><div class="ln dk w60"></div><div class="mini"><div class="ln dk w80"></div><div class="ln w50"></div></div><div class="mini"><div class="ln dk w70"></div><div class="ln w40"></div></div><div class="mini"><div class="ln dk w90"></div><div class="ln w60"></div></div></div><div class="col"><div class="ln dk w70"></div><div class="mini"><div class="ln dk w80"></div><div class="ln w50"></div></div><div class="mini"><div class="ln dk w60"></div><div class="ln w40"></div></div></div><div class="col"><div class="ln dk w40"></div><div class="mini"><div class="ln dk w70"></div><div class="ln w50"></div></div></div></div>` }
  ];

  document.getElementById('intent-grid').innerHTML = INTENTS.map(it => `
    <button class="intent" type="button" ${it.enabled ? 'data-action="pick-intent"' : 'disabled'} aria-label="${it.title}${it.enabled ? '' : ', coming soon'}">
      <div class="scene ${it.tone}${it.id === 'tailor' ? ' scene-tailor' : ''}" aria-hidden="true">${it.scene}</div>
      <div class="intent-text">${it.enabled ? '' : '<span class="badge-soon">Coming soon</span>'}<span class="intent-title">${it.title}</span><span class="intent-desc">${it.desc}</span></div>
    </button>`).join('');

  /* ---------- Creation methods ---------- */
  const METHODS = [
    { id: 'linkedin', title: 'Import my LinkedIn profile', sub: 'Just paste the URL', icon: 'linkedin' },
    { id: 'ai', title: 'Write it with AI', sub: 'Answer a few questions', icon: 'sparkles' },
    { id: 'upload', title: 'Upload my resume', sub: 'PDF or Word', icon: 'upload' },
    { id: 'paste', title: 'Paste any text', sub: 'Any written text you have', icon: 'paste' }
  ];
  const byId = id => METHODS.find(m => m.id === id);

  const SAMPLE_TEXT = `Jana Novák — Product Designer, Bratislava

2021–now: Senior Product Designer at Lumen Health. Led the redesign of the patient booking flow; cut drop-off by 23%. Built the first shared component library with two engineers.
2018–2021: UX Designer at Pixelfield. Designed mobile banking features used by 400k people.

Education: MA Visual Communication, Academy of Fine Arts and Design, Bratislava.
Skills: Figma, user research, prototyping, design systems, accessibility, workshop facilitation. Languages: Slovak, English, German.`;

  function bodyHTML(id, p) {
    const f = `${p}-${id}`;
    if (id === 'linkedin') return `
      <form class="mform" data-method="linkedin" novalidate>
        <p>Paste your profile URL and we’ll build a resume from it.</p>
        <div class="field">
          <label class="sr-only" for="${f}-url">LinkedIn profile URL</label>
          <div class="input-wrap">
            <input class="input" id="${f}-url" name="url" type="url" inputmode="url" autocomplete="url" placeholder="linkedin.com/in/your-name">
            <button class="icon-btn" type="button" data-action="paste-example" aria-label="Paste example URL" title="Paste">${icon('clipboard')}</button>
          </div>
          <span class="error">Enter a LinkedIn profile URL, like linkedin.com/in/your-name.</span>
        </div>
        <div class="actions"><button class="btn btn-coral" type="submit">Import</button></div>
      </form>`;
    if (id === 'ai') return `
      <form class="mform" data-method="ai" novalidate>
        <p>Give us your name and your most recent job title, and the AI will generate a tailored resume for you in seconds.</p>
        <div class="field">
          <label class="label" for="${f}-name">Your name</label>
          <input class="input" id="${f}-name" name="name" autocomplete="name" placeholder="Jana Novák">
          <span class="error">Add your name so we can put it on the resume.</span>
        </div>
        <div class="field">
          <label class="label" for="${f}-title">Job title</label>
          <input class="input" id="${f}-title" name="title" autocomplete="organization-title" placeholder="Product Designer">
          <span class="error">Add a job title. Your most recent one works best.</span>
        </div>
        <div class="actions"><button class="btn btn-gradient" type="submit">${icon('sparkles')}Continue</button></div>
      </form>`;
    if (id === 'upload') return `
      <form class="mform" data-method="upload" novalidate>
        <div class="dropzone">
          <span class="cloud">${icon('cloud')}</span>
          <span class="dz-title">Drop your resume file here</span>
          <span class="dz-meta">or <button class="inline-link" type="button" data-action="browse">browse your files</button> · PDF or DOCX, up to 10 MB</span>
          <input class="sr-only" id="${f}-file" type="file" accept=".pdf,.doc,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" tabindex="-1" aria-label="Choose resume file">
        </div>
        <div class="file-slot field"><span class="error">That file type won’t work. Upload a PDF or a Word document.</span></div>
        <div class="actions"><button class="btn btn-coral" type="submit" disabled>Upload</button></div>
      </form>`;
    if (id === 'paste') return `
      <form class="mform" data-method="paste" novalidate>
        <p>An old resume, a bio, notes, a job post you wrote. We’ll sort it into resume sections.</p>
        <div class="field">
          <label class="sr-only" for="${f}-text">Your text</label>
          <textarea class="textarea" id="${f}-text" name="text" maxlength="5000" placeholder="Paste your text here…"></textarea>
          <span class="error">Add a bit more text. We need at least 80 characters to work with.</span>
          <div class="hint-row"><button class="inline-link" type="button" data-action="paste-sample">Use sample text</button><span class="count">0 / 5,000</span></div>
        </div>
        <div class="actions"><button class="btn btn-coral" type="submit">Continue</button></div>
      </form>`;
  }

  const headHTML = (m, tag, attrs) => `
    <${tag} class="mhead" ${attrs}>
      <span class="mtile tone-${m.id}">${icon(m.icon)}</span>
      <span class="mtext"><span class="mtitle">${m.title}</span><span class="msub">${m.sub}</span></span>
      ${tag === 'button' ? `<span class="chev">${icon('chevron')}</span>` : ''}

  /* ---------- State ---------- */
  let variant = 'A';
  const methodsEl = document.getElementById('methods');
  const screens = { intent: document.getElementById('screen-intent'), create: document.getElementById('screen-create') };
  let current = 'intent';
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const device = document.getElementById('device');
  const framed = () => getComputedStyle(device).overflowY === 'auto';
  const scroller = () => framed() ? device : window;
  const viewBottom = () => framed() ? device.getBoundingClientRect().bottom : window.innerHeight;
  const timers = new Set();
  const later = (fn, ms) => { const t = setTimeout(() => { timers.delete(t); fn(); }, ms); timers.add(t); return t; };
  const clearTimers = () => { timers.forEach(clearTimeout); timers.clear(); };

  function renderCreate() {
    clearTimers();
    const card = (m, p, action) => `
      <div class="mcard" data-id="${m.id}">
        ${headHTML(m, 'button', `type="button" data-action="${action}" aria-expanded="false" aria-controls="${p}-${m.id}-panel"`)}

          <div class="acc-inner"><div class="mbody">${bodyHTML(m.id, p)}</div></div>

      </div>`;

      methodsEl.innerHTML = `<div class="method-list">${METHODS.map(m => card(m, 'a', 'toggle')).join('')}</div>`;
    } else {
      methodsEl.innerHTML = `
        <div class="b-wrap">
          <div class="b-back"><div class="b-back-inner" inert><button class="back" type="button" data-action="back">${icon('arrowLeft')}Back</button></div></div>

  /* ---------- Motion ---------- */
  // Mirrors the CSS motion tokens so JS-driven and CSS-driven motion share one scale.
  const DUR = { fast: 160, base: 260, slow: 380 };
  const EASE = { standard: 'cubic-bezier(.2, 0, 0, 1)', exit: 'cubic-bezier(.4, 0, 1, 1)', inout: 'cubic-bezier(.4, 0, .2, 1)' };
  const STAGGER = 30;
  const play = (el, kf, o) => el.animate(kf, Object.assign({ fill: 'both' }, o));
  const shown = el => el.getClientRects().length > 0;
  const scrollPos = () => framed() ? device.scrollTop : window.scrollY;

  function scrollToTop() {
    if (scrollPos() < 4) return Promise.resolve();
    scroller().scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    return new Promise(res => {

     - Content moves along one axis: forward = from the right, back = from the left.
     - The picked goal card shrinks into the "Create a resume" chip above the headline,
       and grows back out of it when you change the goal.
     Clicking mid-way fast-forwards the running change and starts the new one, so no click is lost. */
  let screenRun = null;
  async function go(screen, picked) {
    if (screenRun) screenRun.finish();
    if (screen === current) return;
    const from = screens[current], to = screens[screen];
    const dir = screen === 'create' ? 1 : -1;
    current = screen;
    await scrollToTop();
    if (current !== screen) return; // another change started while scrolling

    const chip = screens.create.querySelector('.goal-chip');
    const goalCard = screens.intent.querySelector('[data-action="pick-intent"]');
    const fromRect = dir > 0 ? (picked || goalCard).getBoundingClientRect() : chip.getBoundingClientRect();
    const fromOffset = from.offsetTop;
    if (screen === 'create') renderCreate();

    // Overlap: pin the outgoing screen where it is while the new one lays out in flow.
    Object.assign(from.style, { position: 'absolute', top: fromOffset + 'px', left: '0', right: '0', pointerEvents: 'none' });
    to.hidden = false;
    const toRect = dir > 0 ? chip.getBoundingClientRect() : goalCard.getBoundingClientRect();

    const anims = [];
    const outHead = from.querySelector(':scope > .page-head'), inHead = to.querySelector(':scope > .page-head');
    const outItems = [...from.querySelectorAll('.intent, .mcard, :scope > .center')].filter(shown);
    const inItems = [...to.querySelectorAll('.intent, .method-list > .mcard, .slot, :scope > .center')].filter(shown);
    const morphFrom = dir > 0 ? picked || goalCard : chip;   // element that becomes the ghost
    const morphTo = dir > 0 ? chip : goalCard;              // element the ghost becomes

    if (reduce) {
      anims.push(play(from, [{ opacity: 1 }, { opacity: 0 }], { duration: DUR.fast, easing: EASE.exit }));
      anims.push(play(to, [{ opacity: 0 }, { opacity: 1 }], { duration: DUR.base, delay: 60, easing: EASE.standard }));
    } else {
      // Headline: cross-fade in place
      [...outHead.children].forEach(el => { if (el !== chip) anims.push(play(el, [{ opacity: 1 }, { opacity: 0 }], { duration: DUR.fast, easing: EASE.exit })); });
      [...inHead.children].forEach(el => { if (el !== chip) anims.push(play(el, [{ opacity: 0 }, { opacity: 1 }], { duration: DUR.base, delay: 100, easing: EASE.standard })); });
      // Content: leave toward the side we came from, enter from the side we're heading to
      outItems.forEach((el, i) => {
        if (el === morphFrom) return;
        anims.push(play(el, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${-24 * dir}px)` }],
          { duration: DUR.fast, delay: i * (STAGGER / 2), easing: EASE.exit }));
      });
      inItems.forEach((el, i) => {
        if (el === morphTo) return;
        anims.push(play(el, [{ opacity: 0, transform: `translateX(${32 * dir}px)` }, { opacity: 1, transform: 'none' }],
          { duration: DUR.base, delay: 120 + i * STAGGER, easing: EASE.standard }));
      });
      // Shared element: a plain card-coloured box travels from the picked card to the chip (or back)
      const ghost = document.createElement('div');
      ghost.className = 'ghost';
      document.body.appendChild(ghost);
      const box = r => ({ transform: `translate(${r.left}px, ${r.top}px)`, width: r.width + 'px', height: r.height + 'px' });
      const rFrom = dir > 0 ? 16 : 999, rTo = dir > 0 ? 999 : 16;
      const g = play(ghost, [
        Object.assign(box(fromRect), { borderRadius: rFrom + 'px', opacity: 1 }),
        Object.assign(box(toRect), { borderRadius: rTo + 'px', opacity: 1, offset: .82 }),
        Object.assign(box(toRect), { borderRadius: rTo + 'px', opacity: 0 })
      ], { duration: DUR.slow + 120, easing: EASE.standard });
      anims.push(g);
      // The source's contents go immediately (instant acknowledgement); the target's contents arrive as the box lands
      anims.push(play(morphFrom, [{ opacity: 1 }, { opacity: 0 }], { duration: 90, easing: 'linear' }));
      anims.push(play(morphTo, [{ opacity: 0 }, { opacity: 0, offset: .7 }, { opacity: 1 }], { duration: DUR.slow + 60, easing: 'linear' }));
      g.finished.catch(() => {}).then(() => ghost.remove());
      anims.ghost = ghost;
    }

    let finished = false;
    const cleanup = () => {
      if (finished) return; finished = true;
      from.hidden = true; from.removeAttribute('style');
      anims.forEach(a => a.cancel());
      anims.ghost && anims.ghost.remove();
      if (screenRun === run) screenRun = null;
    };
    const run = { finish() { anims.forEach(a => { try { a.finish(); } catch (e) {} }); cleanup(); } };
    screenRun = run;
    await Promise.all(anims.map(a => a.finished.catch(() => {})));
    cleanup();
  }

  /* Keeps an element at a fixed spot on screen while layout above it changes
     (the browser's own scroll anchoring can't be relied on mid-transition). */
  let anchorRaf = 0;
  function holdInPlace(el, ms, then) {
    cancelAnimationFrame(anchorRaf);
    const top = el.getBoundingClientRect().top, t0 = performance.now(), sc = scroller();
    const step = () => {
      const d = el.getBoundingClientRect().top - top;
      if (Math.abs(d) > .5) sc.scrollBy(0, d);
      if (performance.now() - t0 < ms) anchorRaf = requestAnimationFrame(step); else then && then();
    };
    anchorRaf = requestAnimationFrame(step);
  }
  function revealBottom(card) {
    const r = card.getBoundingClientRect();
    const pad = framed() ? 16 : 104, vb = viewBottom();
    if (r.bottom > vb - pad) scroller().scrollBy({ top: Math.min(r.bottom - vb + pad, r.top - (framed() ? device.getBoundingClientRect().top + 52 : 16)), behavior: reduce ? 'auto' : 'smooth' });
  }
  let focusTimer = 0;
  function focusLater(el, ms) { clearTimeout(focusTimer); if (el) focusTimer = setTimeout(() => el.focus({ preventScroll: true }), ms); }

  function setOpen(card, open) {
    card.classList.toggle('is-open', open);
    card.querySelector('.mhead').setAttribute('aria-expanded', String(open));
    card.querySelector('.acc').inert = !open;
  }

  /* Variant A: one card open at a time; the card you clicked stays put under the cursor. */
  function toggleA(card) {
    const opening = !card.classList.contains('is-open');
    holdInPlace(card.querySelector('.mhead'), DUR.slow + 60, () => opening && revealBottom(card));
    methodsEl.querySelectorAll('.mcard.is-open').forEach(c => { if (c !== card) setOpen(c, false); });
    setOpen(card, opening);
    focusLater(opening ? card.querySelector('.input, .textarea') : null, DUR.slow);
  }

  /* Variant B: other options fold away and the picked one becomes the screen.
     Pure CSS state, so Back mid-way simply reverses it. */
  function openB(id) {
    const wrap = methodsEl.querySelector('.b-wrap');
    if (!wrap || wrap.classList.contains('has-focus')) return;
    wrap.classList.add('has-focus');
    wrap.querySelector('.b-back-inner').inert = false;
    wrap.querySelectorAll('.slot').forEach(slot => {
      const mine = slot.dataset.id === id, card = slot.querySelector('.mcard'), head = card.querySelector('.mhead');
      slot.classList.toggle('is-focus', mine);
      slot.inert = !mine;
      setOpen(card, mine);
      if (mine) { head.setAttribute('aria-disabled', 'true'); head.tabIndex = -1; }
    });
    const top = wrap.getBoundingClientRect().top, minTop = framed() ? device.getBoundingClientRect().top + 52 : 16;
    if (top < minTop) scroller().scrollBy({ top: top - minTop, behavior: reduce ? 'auto' : 'smooth' });
    focusLater(wrap.querySelector('.slot.is-focus .input, .slot.is-focus .textarea') || wrap.querySelector('.back'), DUR.slow);
  }
  function backB() {
    const wrap = methodsEl.querySelector('.b-wrap');
    if (!wrap || !wrap.classList.contains('has-focus')) return;
    const focus = wrap.querySelector('.slot.is-focus');
    wrap.classList.remove('has-focus');
    wrap.querySelector('.b-back-inner').inert = true;
    wrap.querySelectorAll('.slot').forEach(slot => {
      const card = slot.querySelector('.mcard'), head = card.querySelector('.mhead');
      slot.classList.remove('is-focus'); slot.inert = false;
      setOpen(card, false);
      head.removeAttribute('aria-disabled'); head.removeAttribute('tabindex');
    });
    focusLater(focus && focus.querySelector('.mhead'), 0);
  }

  /* ---------- Method behaviour ---------- */
  const setError = (field, on) => field.classList.toggle('has-error', on);

  const RESULTS = {
    linkedin: { steps: ['Reading your public profile', 'Pulling work history and education', 'Laying it out on a template'],
      title: 'Your LinkedIn profile is in', text: 'We filled your resume with what we found. Check the details before you send it anywhere.',
      facts: [['4', 'positions'], ['2', 'schools'], ['14', 'skills']] },
    ai: { steps: ['Writing your profile summary', 'Drafting work experience bullets', 'Picking skills for the role'],
      title: 'Your AI draft is ready', text: 'Edit anything that doesn’t sound like you. The AI writer stays available in the editor.',
      facts: [['1', 'summary'], ['6', 'bullet points'], ['10', 'skills']] },
    upload: { steps: ['Uploading your file', 'Reading sections and dates', 'Moving everything to a template'],
      title: 'We read your resume', text: 'Everything is on a fresh template now. Your original file stays untouched.',
      facts: [['3', 'positions'], ['1', 'school'], ['11', 'skills']] },
    paste: { steps: ['Reading your text', 'Sorting it into resume sections', 'Laying it out on a template'],
      title: 'Your text is now a resume', text: 'We sorted what you pasted into sections. Anything we couldn’t place is under Additional info.',
      facts: [['2', 'positions'], ['1', 'school'], ['9', 'skills']] }
  };

  function runFlow(form, id, opts) {
    const body = form.closest('.mbody');
    const r = RESULTS[id];
    const name = opts && opts.name ? opts.name.split(' ')[0] : '';
    const status = document.createElement('div');
    status.className = 'status';
    status.setAttribute('role', 'status');
    status.innerHTML = `<ol class="steps">${r.steps.map(s => `<li class="step"><span class="dot">${icon('check')}</span>${s}</li>`).join('')}</ol>`;
    form.hidden = true;
    body.appendChild(status);
    status.animate(reduce ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: DUR.base, easing: EASE.standard });
    const steps = status.querySelectorAll('.step');
    steps.forEach((s, i) => {
      later(() => { if (i) steps[i - 1].classList.replace('is-active', 'is-done'); s.classList.add('is-active'); }, i * 750);
    });
    later(() => {
      steps[steps.length - 1].classList.replace('is-active', 'is-done');
      later(() => {
        status.innerHTML = `
          <div class="success-head"><span class="ok">${icon('check')}</span>
            <div><h3>${name && id === 'ai' ? `${name}, your AI draft is ready` : r.title}</h3><p>${r.text}</p></div></div>
          <div class="facts">${r.facts.map(([n, l]) => `<div class="fact"><b>${n}</b><span>${l}</span></div>`).join('')}</div>
          <div class="success-actions">
            <button class="btn btn-coral btn-block" type="button" data-action="toast" data-msg="End of prototype. The resume editor opens here.">Open my resume</button>
            <button class="inline-link" type="button" data-action="redo">Try a different input</button>
          </div>`;
        [...status.children].forEach((el, i) => el.animate(
          reduce ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }],
          { duration: DUR.base, delay: i * 60, easing: EASE.standard, fill: 'backwards' }));
        status.querySelector('.btn').focus({ preventScroll: true });
      }, 400);
    }, steps.length * 750);
  }

  function handleSubmit(form) {
    const id = form.dataset.method;
    if (id === 'linkedin') {
      const input = form.querySelector('input');
      const ok = /linkedin\.com\/in\/[\w\-%.]{2,}/i.test(input.value.trim());
      setError(input.closest('.field'), !ok);
      if (!ok) return input.focus();
      runFlow(form, id);
    } else if (id === 'ai') {
      let firstBad = null;
      form.querySelectorAll('.field').forEach(fl => {
        const inp = fl.querySelector('input'); const bad = !inp.value.trim();
        setError(fl, bad); if (bad && !firstBad) firstBad = inp;
      });
      if (firstBad) return firstBad.focus();
      runFlow(form, id, { name: form.querySelector('[name="name"]').value.trim() });
    } else if (id === 'upload') {
      if (form._file) runFlow(form, id);
    } else if (id === 'paste') {
      const ta = form.querySelector('textarea');
      const bad = ta.value.trim().length < 80;
      setError(ta.closest('.field'), bad);
      if (bad) return ta.focus();
      runFlow(form, id);
    }
  }

  function setFile(form, file) {
    const slot = form.querySelector('.file-slot');
    const okType = file && /\.(pdf|docx?)$/i.test(file.name);
    slot.querySelector('.file-row')?.remove();
    form._file = okType ? file : null;
    setError(slot, !!file && !okType);
    form.querySelector('[type="submit"]').disabled = !okType;
    if (!okType) return;
    const kb = file.size / 1024;
    const size = kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.max(1, Math.round(kb)) + ' KB';
    slot.insertAdjacentHTML('afterbegin', `
      <div class="file-row">${icon('file')}
        <span class="ftext"><span class="fname">${file.name.replace(/[<>&"]/g, '')}</span><span class="fsize">${size}</span></span>
        <button class="icon-btn" type="button" data-action="remove-file" aria-label="Remove file">${icon('x')}</button>
      </div>`);
  }

  /* ---------- Events ---------- */
  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  function setVariant(v) {
    if (v !== 'A' && v !== 'B') return;
    variant = v;
    document.querySelectorAll('[data-variant]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.variant === v)));
    try { localStorage.setItem('kr-start-variant', v); } catch (e) {}
    if (current === 'create') renderCreate();
  }

  function setView(v) {
    if (v !== 'desktop' && v !== 'mobile') return;
    document.body.classList.toggle('is-mobile', v === 'mobile');
    document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
    try { localStorage.setItem('kr-start-view', v); } catch (e) {}
    window.scrollTo(0, 0); device.scrollTop = 0;
  }

  document.addEventListener('click', e => {
    const vb = e.target.closest('[data-variant]');
    if (vb) return setVariant(vb.dataset.variant);
    const vw = e.target.closest('[data-view]');
    if (vw) return setView(vw.dataset.view);
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;
    const form = el.closest('form');
    if (a === 'pick-intent') go('create', el);
    else if (a === 'restart') { clearTimers(); go('intent'); }
    else if (a === 'toggle') toggleA(el.closest('.mcard'));
    else if (a === 'open') { if (el.getAttribute('aria-disabled') !== 'true') openB(el.closest('.mcard').dataset.id); }
    else if (a === 'back') backB();
    else if (a === 'toast') toast(el.dataset.msg);
    else if (a === 'paste-example') {
      const inp = form.querySelector('input');
      inp.value = 'linkedin.com/in/jana-novak-design';
      setError(inp.closest('.field'), false); inp.focus();
    }
    else if (a === 'browse') form.querySelector('input[type="file"]').click();
    else if (a === 'remove-file') { setFile(form, null); form.querySelector('input[type="file"]').value = ''; }
    else if (a === 'paste-sample') {
      const ta = form.querySelector('textarea'); ta.value = SAMPLE_TEXT;
      ta.dispatchEvent(new Event('input', { bubbles: true })); ta.focus();
    }
    else if (a === 'redo') {
      const body = el.closest('.mbody');
      body.querySelector('.status').remove();
      const f = body.querySelector('form'); f.hidden = false;
      f.querySelector('.input, .textarea, [data-action="browse"]')?.focus();
    }
  });

  document.addEventListener('submit', e => {
    if (!e.target.matches('form[data-method]')) return;
    e.preventDefault();
    handleSubmit(e.target);
  });

  document.addEventListener('input', e => {
    const fl = e.target.closest('.field');
    if (fl && fl.classList.contains('has-error') && e.target.value.trim()) setError(fl, false);
    if (e.target.matches('.textarea')) {
      fl.querySelector('.count').textContent = `${e.target.value.length.toLocaleString('en-US')} / 5,000`;
    }
  });

  document.addEventListener('change', e => {
    if (e.target.matches('input[type="file"]')) setFile(e.target.closest('form'), e.target.files[0] || null);
  });

  ['dragenter', 'dragover'].forEach(t => document.addEventListener(t, e => {
    const dz = e.target.closest && e.target.closest('.dropzone');
    if (!dz) return;
    e.preventDefault(); dz.classList.add('is-over');
  }));
  document.addEventListener('dragleave', e => {
    const dz = e.target.closest && e.target.closest('.dropzone');
    if (dz && !dz.contains(e.relatedTarget)) dz.classList.remove('is-over');
  });
  document.addEventListener('drop', e => {
    const dz = e.target.closest && e.target.closest('.dropzone');
    if (!dz) return;
    e.preventDefault(); dz.classList.remove('is-over');
    if (e.dataTransfer.files[0]) setFile(dz.closest('form'), e.dataTransfer.files[0]);
  });

  /* Start: #a, #b, #a-mobile, #b-mobile deep-link a state; otherwise remember the last one */
  const hash = (location.hash || '').replace('#', '').toLowerCase();
  const hv = hash.match(/^(a|b)\b/), hm = hash.match(/mobile|desktop/);
  let savedV = null, savedView = null;
  try { savedV = localStorage.getItem('kr-start-variant'); savedView = localStorage.getItem('kr-start-view'); } catch (e) {}
  setVariant(hv ? hv[1].toUpperCase() : (savedV || 'A'));
  setView(hm ? hm[0] : (savedView || 'desktop'));
})();
</script>
